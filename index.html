<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=20261019b"></script>
</head>
<body>
<title>My Fit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: one-screen app. Sticky header, scrolling main, fixed bottom tab bar. White, one accent, five soft type colors. */
:root{
  --bg:#ffffff; --fg:#141516; --muted:#8a8d93; --line:#ebecee; --soft:#f5f6f8; --card:#ffffff;
  --accent:#2f6bff; --accent-fg:#ffffff; --accent-soft:#e9efff;
  --good:#1f9d6a; --warn:#d9822b; --hl:#e5484d; --equip:#55585e;
  --c-stretch:#2fb8a6; --c-warmup:#f2a93b; --c-strength:#2f6bff; --c-cardio:#f26b5b; --c-cooldown:#8b6cf2;
  --font:"IBM Plex Sans KR","Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --r:12px; --nav-h:58px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111214; --fg:#f1f2f4; --muted:#8f9298; --line:#27292d; --soft:#1b1d21; --card:#17191c; --accent:#5b8bff; --accent-soft:#1d2a4d; --equip:#9a9da3; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#111214; --fg:#f1f2f4; --muted:#8f9298; --line:#27292d; --soft:#1b1d21; --card:#17191c; --accent:#5b8bff; --accent-soft:#1d2a4d; --equip:#9a9da3; color-scheme:dark; }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:24px} h2{font-size:17px} h3{font-size:15px}
.muted{color:var(--muted)} .cap{font-size:12px;color:var(--muted)} .num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

#app{height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
header.top .left{display:flex;align-items:center;gap:8px;min-width:0}
header.top h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;overflow-y:auto;padding-block:16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));display:flex}
nav.tabs button{flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--soft)}
.seg button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);min-height:34px}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.wide button{flex:1;padding:8px 10px;font-size:13px}
.seg.wide{display:flex;width:100%}

.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--card)}
.tile .v{font-size:22px;font-weight:600;line-height:1.1;margin-top:4px}
.tile .v small{font-size:13px;font-weight:400;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

.card{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:12px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.card .ic,.ic{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--fg)}
.ic.sm{width:52px;height:52px;border-radius:11px}
.ic .pf{width:88%;height:88%}
.bodymap .sk{fill:var(--line)}
.bodymap path,.bodymap circle{fill:var(--line)}
.bodymap .hl{fill:var(--hl)}
.phase{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.credit{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.ico-svg,.pf{display:block;max-width:100%}
.pf .fill{stroke:var(--soft)}.pf .fillp{fill:var(--soft)}.pf .hls{stroke:var(--hl)}.pf .hlf{fill:var(--hl);stroke:none}.pf .p{stroke:var(--equip);stroke-width:3}.pf .ar{stroke:var(--accent);opacity:.9}.pf .ah{fill:var(--accent);stroke:none}.pf .band{stroke-dasharray:3 2}
.bigico{display:grid;place-items:center;width:140px;height:140px;border-radius:32px;background:var(--soft);margin:0 auto;color:var(--fg)}
.hero{display:flex;align-items:center;justify-content:center;gap:20px}
.howto .hc .fig{color:var(--fg)}
.board .mini .ico-svg{flex:none}
.card .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{font-size:12px;color:var(--muted)}
.card.done{opacity:.55}
.card.done .nm{text-decoration:line-through}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.chk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:var(--accent-fg)}
.chk.on{background:var(--good);border-color:var(--good)}
.chk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 18px;border-radius:var(--r);font-weight:600;width:100%}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.sec{border:1px solid var(--line);background:var(--card)}
.btn.ghost{height:40px;color:var(--accent)}
.btn.danger{color:#d9403c}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{height:36px;padding:0 12px;width:auto;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.t-stretch{color:var(--c-stretch)} .t-warmup{color:var(--c-warmup)} .t-strength{color:var(--c-strength)} .t-cardio{color:var(--c-cardio)} .t-cooldown{color:var(--c-cooldown)}
.b-stretch{background:var(--c-stretch)} .b-warmup{background:var(--c-warmup)} .b-strength{background:var(--c-strength)} .b-cardio{background:var(--c-cardio)} .b-cooldown{background:var(--c-cooldown)}

/* weekly board */
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.board .col{border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px;border:1px solid transparent;min-width:0}
.board .mini{min-width:0;max-width:100%}
.onoff{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--soft)}
.onoff button{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}
.onoff button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ver{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.board .col.sel{border-color:var(--accent);background:var(--accent-soft)}
.board .col.today .d{color:var(--accent)}
.board .wd{font-size:11px;color:var(--muted)} .board .d{font-size:13px;font-weight:600}
.board .mini{width:26px;height:26px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font-size:14px;position:relative}
.board .mini .pf{width:100%;height:100%}
.board .mini.done::after{content:"";position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:var(--good);border:2px solid var(--bg)}
.board .mini i{position:absolute;left:3px;top:3px;width:5px;height:5px;border-radius:50%}

/* monthly */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.cal .cell{aspect-ratio:1/1.15;border-radius:8px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid transparent}
.cal .cell.other{opacity:.35}
.cal .cell.today{border-color:var(--accent)}
.cal .cell .d{font-size:12px;font-weight:600}
.cal .bars{display:flex;gap:2px;width:100%;justify-content:center}
.cal .bars i{width:5px;height:14px;border-radius:2px;opacity:.35}
.cal .bars i.done{opacity:1}

/* list rows */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.list .li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;min-height:52px}
.list .li:last-child{border-bottom:0}
.list .li .nm{font-weight:600} .list .li .sub{font-size:12px;color:var(--muted)}
.list .li .arrow{color:var(--muted);flex:none}
.step{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.step button{width:40px;height:40px;font-size:18px;color:var(--accent)}
.step .sv{min-width:56px;text-align:center;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}

/* sheets and overlays */
#layer{position:fixed;inset:0;z-index:45;pointer-events:none}#layer:empty{display:none}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;pointer-events:auto;background:var(--bg);border-radius:18px 18px 0 0;max-height:min(88%,calc(100dvh - 40px));overflow-y:auto;
  padding-block:8px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  animation:up .22s ease-out}
.sheet .grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.full{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.full .bar-top{display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:8px}
.full .body{flex:1;overflow-y:auto;padding-bottom:16px}
.full .foot{padding-block:12px 16px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--fg)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* how-to carousel */
.howto{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.howto::-webkit-scrollbar{display:none}
.howto .hc{flex:0 0 100%;scroll-snap-align:center;border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:10px;min-height:340px}
.howto .hc .fig{min-height:240px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;gap:16px;padding:16px;position:relative;flex-wrap:wrap}
.howto .hc .fig .pf{width:min(320px,82vw);height:auto;max-height:46vh}
.howto .hc .fig .bodymap{position:absolute;right:10px;top:10px;height:auto;width:min(84px,22vw);opacity:.9}
.howto.v{flex-direction:column;overflow:visible;scroll-snap-type:none;margin:0;padding:0}
.howto.v .hc{flex:none;min-height:0}
.card .ic[data-howto],.li .ic[data-howto]{cursor:pointer}
.card .ic[data-howto]:active,.li .ic[data-howto]:active{transform:scale(.96)}
.howto .hc .fig .phase{position:absolute;left:12px;top:12px}
.howto .hc .k{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.howto .hc .cue{font-size:17px;font-weight:600}
.howto .hc .mis{font-size:13px;color:var(--muted)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

/* timer */
.timer{text-align:center;padding:32px 0 16px}
.timer .big{font-size:64px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.ring{width:220px;height:220px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--p,0%),var(--soft) 0)}
.ring>div{width:196px;height:196px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.setrow{display:grid;grid-template-columns:44px 1fr 1fr 44px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.setrow input{text-align:center;padding:8px 6px}
.setrow .n{font-weight:600;color:var(--muted)}
.setrow.done{opacity:.55}
.setrow .cap{text-transform:capitalize}
.restbox{border-radius:var(--r);background:var(--accent-soft);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cond{display:flex;gap:6px}
.cond button{flex:1;height:44px;border-radius:10px;border:1px solid var(--line);font-weight:600}
.cond button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.delta{font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--warn)}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:40}
.icons{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.icons button{width:52px;height:52px;border-radius:10px;border:1px solid var(--line);flex:none;background:var(--card);display:grid;place-items:center;color:var(--fg)}
.icons button.on{border-color:var(--accent);background:var(--accent-soft)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}
.statusline{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.board .mini .mn{display:none}
.board .mini{width:32px;height:32px}
.board .add{width:34px;height:34px;border-radius:8px;border:1px dashed var(--line);color:var(--muted);font-size:16px;display:grid;place-items:center;margin-top:auto}
.board .col{min-height:140px}
.smart{border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;background:var(--accent-soft);display:flex;flex-direction:column;gap:8px}
.smart .k{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.03em;text-transform:uppercase}
@media (prefers-reduced-motion: reduce){ .sheet{animation:none} }
/* phone: bigger everything */
@media (max-width: 480px){
  body{font-size:16px}
  header.top h1{font-size:22px}
  .card{padding:14px}
  .card .nm{font-size:18px} .card .sub{font-size:13px}
  .card .ic,.ic{width:72px;height:72px;border-radius:16px}
  .ic.sm{width:58px;height:58px}
  .tile .v{font-size:28px} .tile .cap{font-size:13px}
  .btn{height:56px;font-size:17px;border-radius:14px}
  .btn.sm{height:40px;font-size:14px}
  .chk{width:34px;height:34px}
  .list .li{min-height:58px;padding:14px}
  .seg.wide button{padding:11px 10px;font-size:15px}
  .chip{padding:7px 13px;font-size:14px}
  .step button{width:46px;height:46px;font-size:20px} .step .sv{min-width:64px;font-size:17px}
  input,textarea{padding:13px 14px;font-size:16px}
  .board .mini{width:36px;height:36px}
  .board .col{min-height:150px}
  nav.tabs button{font-size:12px} nav.tabs button svg{width:24px;height:24px}
  .timer .big{font-size:76px} .ring{width:250px;height:250px} .ring>div{width:222px;height:222px}
  .howto .hc .cue{font-size:19px} .howto .hc .mis{font-size:14px}
  .bigico{width:160px;height:160px}
}
.sticky-cta{position:sticky;bottom:0;padding-top:8px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:2}
.setcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.setcard.done{opacity:.55}
.setcard .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.setcard .top b{font-size:15px}
.setcard .ctrls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft)}
.stp button{width:42px;height:44px;font-size:20px;color:var(--accent);flex:none}
.stp .v{flex:1;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.stp .v small{font-weight:400;color:var(--muted);font-size:12px}
.chk.big{width:44px;height:44px}
.chk.big svg{width:22px;height:22px}

/* tablet and desktop: side navigation, centered content, wider board */
@media (min-width: 820px){
  :root{--nav-w:200px}
  nav.tabs{top:calc(56px + env(safe-area-inset-top,0px));bottom:0;right:auto;width:var(--nav-w);flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:12px 8px;gap:4px}
  nav.tabs button{flex:none;height:44px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 12px;border-radius:10px;font-size:14px}
  nav.tabs button.on{background:var(--accent-soft)}
  header.top{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  main{margin-left:var(--nav-w);padding-block:24px 40px;padding-left:32px;padding-right:32px}
  main > .stack{max-width:960px;margin:0 auto;gap:20px}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .tile .v{font-size:26px}
  .board{gap:8px}
  .board .col{min-height:220px;padding:10px 6px;align-items:stretch;border-color:var(--line)}

let UNSUBS=[];
const snapExists=sn=>typeof sn.exists==='function'?sn.exists():!!sn.exists;
const pending=sn=>!!(sn.metadata&&sn.metadata.hasPendingWrites);

function packExercises(){ const defs=DEFAULT_EXERCISES(); const byId=Object.fromEntries(defs.map(d=>[d.id,d])); const custom=[],overrides={};
  S.exercises.forEach(e=>{ const d=byId[e.id]; if(!d){custom.push(e);return;} const o={}; ['nameEn','nameKo','icon','type','muscle','equip','mode','sets','reps','weight','rest','minutes','hidden'].forEach(k=>{ if(JSON.stringify(e[k])!==JSON.stringify(d[k]))o[k]=e[k]; }); if(JSON.stringify(e.steps)!==JSON.stringify(d.steps))o.steps=e.steps; if(Object.keys(o).length)overrides[e.id]=o; });
  return {v:2,custom,overrides}; }
function unpackExercises(data){ if(data&&data.v===2){ const list=DEFAULT_EXERCISES().map(d=>Object.assign(d,data.overrides&&data.overrides[d.id]||{})); return list.concat((data.custom||[]).map(x=>Object.assign({},x))); } return ((data&&data.items)||[]).map(x=>Object.assign({},x)); }
function subscribeAll(){ UNSUBS.forEach(u=>{try{u();}catch(e){}}); UNSUBS=[]; const db=DB; if(!db)return; FIRST={ex:false,st:false,rt:false,pl:false,lg:false};
  const onErr=(e)=>{ S.lastError=(e&&e.code)||'error'; renderStatus(); };
  const maybeBackup=()=>{ if(FIRST.ex&&FIRST.st&&FIRST.pl&&FIRST.lg&&!FIRST.bk){ FIRST.bk=true; if(Object.keys(S.plans).length||Object.keys(S.logs).length)setTimeout(()=>makeBackup(false),3000); } };
  UNSUBS.push(db.doc('app/exercises').onSnapshot(snap=>{
    if(snapExists(snap)){ S.exercises=unpackExercises(snap.data()); const old=!(snap.data()&&snap.data().v===2); if((mergeDefaults()||old)&&S.canWrite&&!pending(snap))dbWrite(()=>DB.doc('app/exercises').set(packExercises())); }
    else if(S.canWrite){ dbWrite(()=>DB.doc('app/exercises').set(packExercises())); }
    FIRST.ex=true; saveLocal();render();maybeBackup();
  },onErr));
  UNSUBS.push(db.doc('app/settings').onSnapshot(snap=>{
    if(snapExists(snap)){S.settings=Object.assign({},S.settings,snap.data());}
    else if(S.canWrite){ dbWrite(()=>DB.doc('app/settings').set(S.settings)); }
    FIRST.st=true; saveLocal();render();maybeBackup();
  },onErr));
  UNSUBS.push(db.doc('app/routines').onSnapshot(snap=>{ if(snapExists(snap)){S.routines=(snap.data().items||[]).map(x=>Object.assign({},x));} else if(S.routines.length&&S.canWrite&&!FIRST.rt){ dbWrite(()=>DB.doc('app/routines').set({items:S.routines})); } FIRST.rt=true; saveLocal();render(); },onErr));
  UNSUBS.push(db.collection('plans').onSnapshot(q=>{const o={};q.docs.forEach(d=>{const b=d.data();o[d.id]={items:(b.items||[]).map(x=>Object.assign({},x))};});
    if(!FIRST.pl&&!q.docs.length&&Object.keys(S.plans).length&&S.canWrite){ const local=S.plans; FIRST.pl=true; Object.keys(local).forEach(k=>persist.plan(k)); maybeBackup(); return; }
    FIRST.pl=true; S.plans=o;saveLocal();render();maybeBackup();},onErr));
  UNSUBS.push(db.collection('logs').onSnapshot(q=>{const o={};q.docs.forEach(d=>{const b=d.data();o[d.id]={entries:(b.entries||[]).map(x=>Object.assign({},x))};});
    if(!FIRST.lg&&!q.docs.length&&Object.keys(S.logs).length&&S.canWrite){ const local=S.logs; FIRST.lg=true; Object.keys(local).forEach(k=>persist.log(k)); maybeBackup(); return; }
    FIRST.lg=true; S.logs=o;saveLocal();render();maybeBackup();},onErr));
  renderStatus();
}

function mergeDefaults(){ const defs=DEFAULT_EXERCISES(); let changed=false; const have=new Set(S.exercises.map(e=>e.id));
  defs.forEach(d=>{ if(!have.has(d.id)){S.exercises.push(d);changed=true;} else { const e=S.exercises.find(x=>x.id===d.id); if(!e.muscle){e.muscle=d.muscle;changed=true;} if(!e.equip){e.equip=d.equip;changed=true;} } });
  S.exercises.forEach(e=>{ if(!e.muscle){e.muscle='full';changed=true;} if(!e.equip){e.equip='bodyweight';changed=true;} if(!(FT[e.icon]||(typeof e.icon==='string'&&e.icon.startsWith('pose:')&&PZ[e.icon.slice(5)]))){e.icon=defaultIconFor(e);changed=true;} });
  return changed; }
const planOf=date=>(S.plans[date]&&S.plans[date].items)||[];
const logOf=date=>(S.logs[date]&&S.logs[date].entries)||[];
function targetText(it){ if(it.mode==='time')return it.minutes+' '+t('min'); const w=it.weight>0?it.weight+S.settings.unit+' × ':''; return w+it.reps+' × '+it.sets; }
function estMin(it){ return it.mode==='time'?it.minutes:Math.max(1,Math.round(it.sets*(it.reps*3+(it.rest||0))/60)); }
function lastEntry(exId,beforeDate,excludeItemId){ const keys=Object.keys(S.logs).filter(k=>!beforeDate||k<=beforeDate).sort().reverse(); for(const k of keys){const e=logOf(k).slice().reverse().find(x=>x.exId===exId&&(!excludeItemId||x.planItemId!==excludeItemId));if(e)return e;} return null; }
function entrySummary(e){ if(!e)return t('no_record'); if(e.mode==='time')return mmss(e.duration); const done=e.sets.filter(s=>s.done); if(!done.length)return mmss(e.duration); const w=Math.max(...done.map(s=>s.weight||0)); const reps=Math.round(done.reduce((a,s)=>a+s.reps,0)/done.length); return (w>0?w+S.settings.unit+' × ':'')+reps+' × '+done.length; }
function entryScore(e){ if(!e)return null; if(e.mode==='time')return e.duration; const done=e.sets.filter(s=>s.done); const anyW=done.some(s=>s.weight>0); return done.reduce((a,s)=>a+s.reps*(anyW?(s.weight||0):1),0); }

function clearWeek(ws){ for(let i=0;i<7;i++){const k=keyOf(addDays(ws,i)); if(planOf(k).length){S.plans[k]={items:[]};persist.plan(k);}} }
function applyRoutine(r,wdMap,replace){ const ws=parseKey(S.weekStart); if(replace)clearWeek(ws);
  r.days.forEach((d,i)=>{ const wd=wdMap[i]; if(wd==null)return; const k=keyOf(addDays(ws,wd)); d.exIds.forEach(id=>{const ex=exById(id); if(ex&&!ex.hidden)addPlanItem(k,ex);}); });
  toast(t('applied')); render(); }
function addPlanItem(date,ex,afterId){ const it={id:uid(),exId:ex.id,mode:ex.mode,minutes:ex.minutes,sets:ex.sets,reps:ex.reps,weight:ex.weight,rest:ex.rest??S.settings.restSec,status:'planned'}; S.plans[date]=S.plans[date]||{items:[]}; const arr=S.plans[date].items; const at=afterId?arr.findIndex(x=>x.id===afterId):-1; if(at>=0)arr.splice(at+1,0,it); else arr.push(it); persist.plan(date); return it; }
function doneDays(from,to){ const s=new Set(); Object.keys(S.logs).forEach(k=>{ if(k>=from&&k<=to&&logOf(k).length)s.add(k); }); return s.size; }
function plannedDays(from,to){ const s=new Set(); Object.keys(S.plans).forEach(k=>{ if(k>=from&&k<=to&&planOf(k).length)s.add(k); }); return s.size; }
function totalSec(from,to){ let s=0; Object.keys(S.logs).forEach(k=>{ if(k>=from&&k<=to)logOf(k).forEach(e=>s+=e.duration||0); }); return s; }

function renderDash(){
  const today=todayKey(); const ws=startOfWeek(new Date()); const wsK=keyOf(ws),weK=keyOf(addDays(ws,6));
  const now=new Date(); const ms=keyOf(new Date(now.getFullYear(),now.getMonth(),1)), me=keyOf(new Date(now.getFullYear(),now.getMonth()+1,0));
  const wDone=doneDays(wsK,weK), goal=S.settings.weeklyGoal||3; const pct=Math.min(100,Math.round(wDone/goal*100));
  const mDone=doneDays(ms,me), mPlan=Math.max(plannedDays(ms,me),mDone); const tot=Math.round(totalSec(ms,me)/60);
  const items=planOf(today); const todo=items.filter(i=>i.status==='planned'); const est=todo.reduce((a,i)=>a+estMin(i),0);
  const tomorrow=planOf(keyOf(addDays(new Date(),1)));
  let html=`<div class="stack">
   <div class="tiles">
    <div class="tile"><div class="cap">${esc(t('this_week'))}</div><div class="v num">${wDone}<small> / ${goal} ${esc(t('days'))}</small></div><div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="tile"><div class="cap">${esc(t('workout_days'))}</div><div class="v num">${mDone}<small> / ${mPlan} ${esc(t('planned'))}</small></div></div>
    <div class="tile"><div class="cap">${esc(t('total_time'))}</div><div class="v num">${tot}<small> ${esc(t('min'))}</small></div></div>
    <div class="tile"><div class="cap">${esc(t('streak'))}</div><div class="v num">${streak()}<small> ${esc(t('days'))}</small></div></div>
   </div>
   <div class="sec-h"><h2>${esc(t('today'))} <span class="muted" style="font-weight:400;font-size:13px">${esc(fmtMD(new Date()))}</span></h2>
     ${todo.length?`<span class="cap num">${esc(t('est'))} ${est} ${esc(t('min'))}</span>`:''}</div>`;

function smartDays(ws,n,fromDay){ fromDay=fromDay||0; if(S.settings.smartAlternate!==false&&n<=4){ let start=fromDay; if(fromDay===0&&planOf(keyOf(addDays(ws,-1))).length)start=1; const days=[]; for(let d=start;d<7&&days.length<n;d+=2)days.push(d); if(days.length===n)return {days,alt:true}; }
  const base=(DEFAULT_WD[n]||DEFAULT_WD[7]).filter(d=>d>=fromDay); if(base.length>=n)return {days:base.slice(0,n),alt:false}; const rest=[]; for(let d=fromDay;d<7&&rest.length<n;d++)rest.push(d); return {days:rest,alt:false}; }
const SPLIT_ROUTINE={full:'rt_full3',ul:'rt_ul',ppl:'rt_ppl',home:'rt_home',db:'rt_db'};
function smartPlan(ws){ const nAll=Math.min(7,Math.max(1,S.settings.weeklyGoal||3)); const isCur=keyOf(ws)===keyOf(startOfWeek(new Date())); const todayIdx=isCur?Math.round((parseKey(todayKey())-ws)/86400000):0; const doneBefore=isCur?[0,1,2,3,4,5,6].filter(i=>i<todayIdx&&planOf(keyOf(addDays(ws,i))).some(x=>x.status!=='planned')).length:0; const n=Math.max(0,nAll-doneBefore); const dd=smartDays(ws,n,todayIdx); const wd=dd.days;
  const since=keyOf(addDays(new Date(),-28)); const hist=Object.keys(S.logs).filter(k=>k>=since).flatMap(k=>logOf(k)); const used=new Set(hist.map(e=>e.exId));
  const cands=allRoutines(); let routine,starter=!used.size; const split=S.settings.smartSplit||'auto';
  if(split!=='auto'&&SPLIT_ROUTINE[split]) routine=cands.find(r=>r.id===SPLIT_ROUTINE[split]);
  else if(used.size){ const best=cands.map(r=>({r,score:r.days.flatMap(d=>d.exIds).filter(id=>used.has(id)).length})).sort((a,b)=>b.score-a.score)[0]; routine=best.score>0?best.r:null; }
  if(!routine) routine=cands.find(r=>r.id===(n<=3?'rt_full3':n===4?'rt_ul':'rt_ppl'))||cands[0];
  const prog=S.settings.smartProgress!==false; const step=S.settings.weightStep||(S.settings.unit==='lb'?5:2.5);
  const changes=[]; const plan={};
  for(let i=0;i<n;i++){ const d=routine.days[i%routine.days.length]; const date=keyOf(addDays(ws,wd[i])); plan[date]=plan[date]||[];
    d.exIds.forEach(id=>{ const ex=exById(id); if(!ex||ex.hidden)return; const it={id:uid(),exId:ex.id,mode:ex.mode,minutes:ex.minutes,sets:ex.sets,reps:ex.reps,weight:ex.weight,rest:ex.rest??S.settings.restSec,status:'planned'};
      const last=prog?lastEntry(ex.id):null; if(last&&!plan[date].some(x=>x.exId===ex.id)){
        if(last.mode==='sets'&&it.mode==='sets'){ const done=last.sets.filter(x=>x.done); if(done.length&&done.length>=last.sets.length){ const w=Math.max(...done.map(x=>x.weight||0)); const r=Math.round(done.reduce((a,x)=>a+x.reps,0)/done.length);
            if(w>0){ if(r>=it.reps){ it.weight=Math.round((w+step)*10)/10; changes.push(exName(ex)+' +'+step+S.settings.unit); } else it.weight=w; } else if(r>=it.reps&&r<20){ it.reps=r+1; changes.push(exName(ex)+' +1 '+t('reps')); } } }
        else if(last.mode==='time'&&it.mode==='time'){ const lm=Math.max(1,Math.round(last.duration/60)); if(last.duration>=lm*60*0.9-30&&lm<ex.minutes*2){ it.minutes=Math.min(ex.minutes*2,lm+1); changes.push(exName(ex)+' +1 '+t('min')); } else it.minutes=Math.max(it.minutes,lm); } }
      plan[date].push(it); }); }
  return {plan,routine,starter,changes:[...new Set(changes)],n:nAll,alt:dd.alt,keep:isCur}; }
function applySmart(){ const ws=parseKey(S.weekStart); const r=smartPlan(ws); for(let i=0;i<7;i++){ const k=keyOf(addDays(ws,i)); const keep=r.keep?planOf(k).filter(x=>x.status!=='planned'):[]; if(planOf(k).length!==keep.length||!planOf(k).length&&r.plan[k]){ S.plans[k]={items:keep}; } } Object.keys(r.plan).forEach(k=>{ const keep=planOf(k).filter(x=>x.status!=='planned'); S.plans[k]={items:keep.concat(r.plan[k])}; }); for(let i=0;i<7;i++){ const k=keyOf(addDays(ws,i)); persist.plan(k); } r.week=S.weekStart; S.smartInfo=r; toast(t('applied')); render(); }

async function makeBackup(force){ if(!DB||!S.canWrite)return false; const k=todayKey();
  try{ if(!force){ const snap=await DB.doc('backups/'+k).get(); if(snapExists(snap))return false; } }catch(e){}
  const limit=S.backend==='db'?200000:900000;
  const build=(days)=>{ const cut=keyOf(addDays(new Date(),-days)); const pick=o=>Object.fromEntries(Object.entries(o).filter(([d])=>d>=cut)); return {kind:'data',date:k,at:Date.now(),days,settings:S.settings,routines:S.routines,plans:pick(S.plans),logs:pick(S.logs),planDays:Object.keys(S.plans).length,logDays:Object.keys(S.logs).length}; };
  let body=null; for(const days of [730,365,180,90,45]){ const b=build(days); if(JSON.stringify(b).length<limit){body=b;break;} }
  if(!body){ S.backupError=true; return false; }
  try{ await DB.doc('backups/'+k).set(body); await DB.doc('backups/'+k+'-lib').set(Object.assign({kind:'lib',date:k},packExercises())); S.backupError=false; }catch(e){ S.backupError=true; return false; }
  try{ const cutoff=keyOf(addDays(new Date(),-14)); const old=await DB.collection('backups').get(); for(const d of old.docs){ const b=d.data()||{}; if((b.date||'')<cutoff){ try{await DB.doc('backups/'+d.id).delete();}catch(e){} } } }catch(e){}
  return true; }
async function openBackups(){ showSheet(`<h2 style="margin-bottom:4px">${esc(t('backups'))}</h2><div class="cap" style="margin-bottom:12px">${esc(t('auto_backup_note'))}</div><div id="bklist"><div class="empty">…</div></div>${DB&&S.canWrite?`<button class="btn sec" style="margin-top:12px" id="bknow">${esc(t('backup_now'))}</button>`:''}`);
  $('#bknow')?.addEventListener('click',async()=>{ const ok=await makeBackup(true); toast(ok?t('backed_up'):t('backup_failed')); fill(); });
  async function fill(){ if(!DB){$('#bklist').innerHTML=`<div class="empty">${esc(t('local_only'))}</div>`;return;}
    let docs=[]; try{ const q=await DB.collection('backups').get(); docs=q.docs.filter(d=>!d.id.endsWith('-lib')).slice().sort((a,b)=>(b.data().date||'').localeCompare(a.data().date||'')).slice(0,30); }catch(e){ $('#bklist').innerHTML=`<div class="empty">${esc(t('backup_failed'))}</div>`; return; }
    if(!docs.length){$('#bklist').innerHTML=`<div class="empty">${esc(t('no_backups'))}</div>`;return;}
    $('#bklist').innerHTML=`<div class="list">${docs.map(d=>{const b=d.data();return `<button class="li" data-bk="${d.id}"><span class="grow"><div class="nm num">${esc(b.date)}</div><div class="sub">${b.planDays??0} ${esc(t('planned'))} · ${b.logDays??0} ${esc(t('workout_days'))}</div></span><span class="cap">${esc(t('restore'))}</span></button>`;}).join('')}</div>`;

// ---------- Perform flow ----------
const P={active:false,queue:[],idx:0,stage:'prepare',timer:null,restTimer:null,lock:null};
function startQueue(q){ if(!q.length)return; q.forEach(x=>{ const it=planOf(x.date).find(i=>i.id===x.id); if(it)x.snap=Object.assign({},it); }); Object.assign(P,{active:true,queue:q,idx:0}); enterPrepare(); }
function saveP(){ try{ if(P.active)localStorage.setItem('wwt.perform',JSON.stringify({at:Date.now(),queue:P.queue,idx:P.idx,stage:P.stage==='complete'?'perform':P.stage,sets:P.sets,startedAt:P.startedAt,endAt:P.endAt,remaining:P.remaining,total:P.total,memo:P.memo,pausedMs:P.pausedMs,paused:P.paused})); else localStorage.removeItem('wwt.perform'); }catch(e){} }
function checkResume(){ let saved=null; try{ saved=JSON.parse(localStorage.getItem('wwt.perform')||'null'); }catch(e){} if(!saved||Date.now()-saved.at>6*3600*1000){ try{localStorage.removeItem('wwt.perform');}catch(e){} return; }
  showSheet(`<p style="margin:4px 0 16px;font-weight:600">${esc(t('resume_q'))}</p><div class="stack" style="gap:8px"><button class="btn pri" id="rs-yes">${esc(t('resume'))}</button><button class="btn ghost" id="rs-no">${esc(t('discard_ex'))}</button></div>`);
  $('#rs-no').addEventListener('click',()=>{closeSheet();try{localStorage.removeItem('wwt.perform');}catch(e){}});
  $('#rs-yes').addEventListener('click',()=>{ closeSheet(); Object.assign(P,{active:true,queue:saved.queue,idx:saved.idx,stage:'prepare'}); if(saved.stage==='perform'){ P.stage='perform'; P.sets=saved.sets; P.startedAt=saved.startedAt; P.memo=saved.memo||''; P.pausedMs=saved.pausedMs||0; P.paused=false; const {it}=curItem(); if(it&&it.mode==='time'){ P.total=saved.total; P.remaining=Math.max(0,Math.round((saved.endAt-Date.now())/1000)); P.endAt=Date.now()+P.remaining*1000; P.timer=setInterval(tick,500); } P.restRemaining=0; keepAwake(); renderPerform(); } else enterPrepare(); }); }
function curItem(){ const q=P.queue[P.idx]; if(!q)return {date:todayKey(),it:null,ex:null}; const it=planOf(q.date).find(x=>x.id===q.id)||q.snap||null; return {date:q.date,it,ex:it?exById(it.exId):null}; }
function enterPrepare(){ stopTimers(); P.stage='prepare'; P.howtoIdx=0; renderPerform(); saveP(); }
function enterHowto(){ P.stage='howto'; renderPerform(); }
async function keepAwake(){ try{ if(!P.lock&&navigator.wakeLock){ P.lock=await navigator.wakeLock.request('screen'); P.lock.addEventListener('release',()=>{P.lock=null;}); } }catch(e){ P.lock=null; } }
function releaseAwake(){ try{ if(P.lock){P.lock.release();P.lock=null;} }catch(e){} }
function buzz(pat){ try{ if(navigator.vibrate)navigator.vibrate(pat||[150,80,150]); }catch(e){} }
function enterPerform(){ const {it,ex,date}=curItem(); if(!it)return exitPerform(); stopTimers(); P.stage='perform'; P.startedAt=Date.now(); P.paused=false; P.pausedMs=0; P.memo=''; keepAwake();
  if(it.mode==='time'){ P.remaining=it.minutes*60; P.total=P.remaining; P.endAt=Date.now()+P.remaining*1000; P.timer=setInterval(tick,500); }
  else { P.sets=[]; for(let i=0;i<it.sets;i++){ P.sets.push({reps:it.reps,weight:it.weight,done:false}); } P.restRemaining=0; P.restEndAt=0; }

    case 'edit-ex': S.editEx=JSON.parse(JSON.stringify(exById(a.dataset.id))); S.editDirty=false; S.sub='edit'; render(); break;
    case 'back-edit': if(S.editDirty){confirmSheet(t('discard'),t('discard_btn'),()=>{S.sub='library';render();},true);} else {S.sub='library';render();} break;
    case 'save-ex': saveExercise(); break;
    case 'add-step': S.editEx.steps.push({titleEn:'',titleKo:'',cueEn:'',cueKo:'',mistakeEn:'',mistakeKo:''}); renderEdit(); break;
    case 'rm-step': S.editEx.steps.pop(); renderEdit(); break;
    case 'toggle-hide': S.editEx.hidden=!S.editEx.hidden; saveExercise(); break;
    case 'del-ex': confirmSheet(t('confirm_delete_ex'),t('delete'),()=>{S.exercises=S.exercises.filter(x=>x.id!==S.editEx.id);persist.exercises();S.sub='library';render();},true); break;
    case 'export': { const json=JSON.stringify({exercises:S.exercises,routines:S.routines,settings:S.settings,plans:S.plans,logs:S.logs},null,1); showSheet(`<h2 style="margin-bottom:10px">${esc(t('export'))}</h2><textarea id="exp" rows="8" readonly>${esc(json)}</textarea><button class="btn pri" style="margin-top:10px" id="cp">${esc(t('copy'))}</button>`);
      $('#cp').addEventListener('click',()=>{navigator.clipboard.writeText(json).then(()=>toast(t('copied'))).catch(()=>{$('#exp').select();});}); break; }
    case 'import': { showSheet(`<h2 style="margin-bottom:10px">${esc(t('import'))}</h2><textarea id="imp" rows="8" placeholder="{...}"></textarea><button class="btn pri" style="margin-top:10px" id="ib">${esc(t('import_btn'))}</button>`);
      $('#ib').addEventListener('click',()=>{ try{ const o=JSON.parse($('#imp').value); if(!o||typeof o!=='object')throw 0; const pk=Object.keys(S.plans),lk=Object.keys(S.logs); if(Array.isArray(o.exercises)){S.exercises=o.exercises;mergeDefaults();} if(o.settings)S.settings=Object.assign(S.settings,o.settings); if(Array.isArray(o.routines))S.routines=o.routines; if(o.plans)S.plans=o.plans; if(o.logs)S.logs=o.logs; persist.exercises();persist.settings();persist.routines();new Set([...pk,...Object.keys(S.plans)]).forEach(k=>persist.plan(k));new Set([...lk,...Object.keys(S.logs)]).forEach(k=>persist.log(k)); closeSheet(); toast(t('imported')); render(); }catch(err){ toast(t('import_fail')); } }); break; }
    case 'reset': confirmSheet(t('confirm_reset'),t('delete'),()=>{ const pk=Object.keys(S.plans),lk=Object.keys(S.logs); S.plans={};S.logs={}; S.exercises=DEFAULT_EXERCISES(); pk.forEach(k=>persist.plan(k)); lk.forEach(k=>persist.log(k)); persist.exercises(); render(); },true); break;
  }
});

document.addEventListener('dblclick',e=>{ const el=e.target.closest('.card[data-id],.mini[data-ex],.li[data-act="edit-ex"],.li[data-ex]'); if(!el)return; let id=el.dataset.ex||el.dataset.id; if(el.classList.contains('card')){ const it=planOf(todayKey()).find(x=>x.id===id); id=it&&it.exId; } if(id&&exById(id)){ e.preventDefault(); openHowto(id); } });
// ---------- boot ----------
loadLocal(); render(); connectDb(); checkWhatsNew(); checkResume();
let LAST_DAY=todayKey(); setInterval(()=>{ if(todayKey()!==LAST_DAY){ LAST_DAY=todayKey(); S.smartInfo=null; render(); } },60000);
})();
</script>
