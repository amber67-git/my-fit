<head>
<meta charset="utf-8">

<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="application-name" content="My Fit">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

</head>
<body>
<title>My Fit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: one-screen app. Sticky header, scrolling main, fixed bottom tab bar. White, one accent, five soft type colors. */
:root{
  --bg:#ffffff; --fg:#141516; --muted:#8a8d93; --line:#ebecee; --soft:#f5f6f8; --card:#ffffff;
  --accent:#2f6bff; --accent-fg:#ffffff; --accent-soft:#e9efff;
  --good:#1f9d6a; --warn:#d9822b; --hl:#e5484d; --equip:#55585e;
  --c-stretch:#2fb8a6; --c-warmup:#f2a93b; --c-strength:#2f6bff; --c-cardio:#f26b5b; --c-cooldown:#8b6cf2;
  --font:"IBM Plex Sans KR","Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --r:12px; --nav-h:58px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111214; --fg:#f1f2f4; --muted:#8f9298; --line:#27292d; --soft:#1b1d21; --card:#17191c; --accent:#5b8bff; --accent-soft:#1d2a4d; --equip:#9a9da3; --pri:#2f6bff; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#111214; --fg:#f1f2f4; --muted:#8f9298; --line:#27292d; --soft:#1b1d21; --card:#17191c; --accent:#5b8bff; --accent-soft:#1d2a4d; --equip:#9a9da3; --pri:#2f6bff; color-scheme:dark; }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:24px} h2{font-size:17px} h3{font-size:15px}
.muted{color:var(--muted)} .cap{font-size:12px;color:var(--muted)} .num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

#app{height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
header.top .left{display:flex;align-items:center;gap:8px;min-width:0}
header.top h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;overflow-y:auto;padding-block:16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));display:flex}
nav.tabs button{flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--soft)}
.seg button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);min-height:34px}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.wide button{flex:1;padding:8px 10px;font-size:13px}
.seg.wide{display:flex;width:100%}

.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--card)}
.tile .v{font-size:22px;font-weight:600;line-height:1.1;margin-top:4px}
.tile .v small{font-size:13px;font-weight:400;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

.card{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:12px;display:flex;align-items:center;gap:12px;width:100%;text-align:left;position:relative;z-index:1;transition:transform .18s ease;touch-action:pan-y}
.swipe{position:relative;overflow:hidden;border-radius:var(--r)}
.swipe .swipe-acts{position:absolute;top:0;right:0;bottom:0;width:168px;display:flex;visibility:hidden}
.swipe.open .swipe-acts,.swipe.dragging .swipe-acts{visibility:visible}
.swipe .swipe-acts button{flex:1;border:0;font-weight:700;font-size:15px;display:grid;place-items:center}
.swipe .swipe-cancel{background:var(--soft);color:var(--fg)}
.swipe .swipe-del{background:var(--danger,#e5484d);color:#fff;border-radius:0 var(--r) var(--r) 0}
.swipe.open .card{transform:translateX(-168px)}
.swipe.dragging .card{transition:none}
.card .ic,.ic{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--fg)}
.ic.sm{width:60px;height:60px;border-radius:12px}
.ic .pf{width:88%;height:88%}
.bodymap .sk{fill:var(--line)}
.bodymap path,.bodymap circle{fill:var(--line)}
.bodymap .hl{fill:var(--hl)}
.phase{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.credit{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.ico-svg,.pf{display:block;max-width:100%}
.pf .fill{stroke:var(--soft)}.pf .fillp{fill:var(--soft)}.pf .hls{stroke:var(--hl)}.pf .hlf{fill:var(--hl);stroke:none}.pf .p{stroke:var(--equip);stroke-width:3}.pf .ar{stroke:var(--accent);opacity:.9}.pf .ah{fill:var(--accent);stroke:none}.pf .band{stroke-dasharray:3 2}
.bigico{display:grid;place-items:center;width:140px;height:140px;border-radius:32px;background:var(--soft);margin:0 auto;color:var(--fg)}
.hero{display:flex;align-items:center;justify-content:center;gap:20px}
.ptiles{grid-template-columns:1fr 1fr!important;max-width:440px;margin:0 auto;width:100%;text-align:center}
.steps3{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}.steps3:empty{display:none}
.sc{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:8px 6px 10px;text-align:center;display:flex;flex-direction:column;gap:6px;min-width:0}
.sfig{background:var(--soft);border-radius:10px;display:grid;place-items:center;aspect-ratio:1;color:var(--fg)}.sfig .pf{width:100%;height:100%}
.sk{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.03em;line-height:1.25}
.scue{font-size:13px;font-weight:600;line-height:1.3}
@media (min-width:600px){ .sk{font-size:12px} .scue{font-size:14px} }
.board .mini .ico-svg{flex:none}
.card .nm{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.card .sub{font-size:12px;color:var(--muted)}
.card.done .chk.on{width:20px;height:20px}.card.done .chk.on svg{width:11px;height:11px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.chk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:var(--accent-fg)}
.chk.on{background:var(--good);border-color:var(--good)}
.chk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 18px;border-radius:var(--r);font-weight:600;width:100%}
.btn.pri{background:var(--pri,var(--accent));color:var(--accent-fg)}
.btn.sec{border:1px solid var(--line);background:var(--card)}
.btn.ghost{height:40px;color:var(--accent)}
.btn.danger{color:#d9403c}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{height:36px;padding:0 12px;width:auto;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.t-stretch{color:var(--c-stretch)} .t-warmup{color:var(--c-warmup)} .t-strength{color:var(--c-strength)} .t-cardio{color:var(--c-cardio)} .t-cooldown{color:var(--c-cooldown)}
.b-stretch{background:var(--c-stretch)} .b-warmup{background:var(--c-warmup)} .b-dynamic{background:#f59e0b} .b-strength{background:var(--c-strength)} .b-cardio{background:var(--c-cardio)} .b-cooldown{background:var(--c-cooldown)}

/* weekly board */
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.board .col{border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px;border:1px solid transparent;min-width:0}
.board .mini{min-width:0;max-width:100%}
.onoff{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--soft)}
.onoff button{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}
.onoff button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ver{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.board .col.sel{border-color:var(--accent);background:var(--accent-soft)}
.board .col.today .d{color:var(--accent)}
.board .wd{font-size:11px;color:var(--muted)} .board .d{font-size:13px;font-weight:600}
.board .mini{width:26px;height:26px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font-size:14px;position:relative}
.board .mini .pf{width:100%;height:100%}
.board .mini.done::after{content:"";position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:var(--good);border:2px solid var(--bg)}
.board .mini i{position:absolute;left:3px;top:3px;width:5px;height:5px;border-radius:50%}

/* monthly */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.cal .cell{aspect-ratio:1/1.15;border-radius:8px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid transparent}
.cal .cell.other{opacity:.35}
.cal .cell.today{border-color:var(--accent)}
.cal .cell .d{font-size:12px;font-weight:600}
.cal .bars{display:flex;gap:2px;width:100%;justify-content:center}
.cal .bars i{width:5px;height:14px;border-radius:2px;opacity:.35}
.cal .bars i.done{opacity:1}

/* list rows */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.list .li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;min-height:52px}
.list .li:last-child{border-bottom:0}
.list .li .nm{font-weight:600} .list .li .sub{font-size:12px;color:var(--muted)}
.list .li .arrow{color:var(--muted);flex:none}
.step{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.step button{width:40px;height:40px;font-size:18px;color:var(--accent)}
.step .sv{min-width:56px;text-align:center;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}

/* sheets and overlays */
#layer{position:fixed;inset:0;z-index:45;pointer-events:none}#layer:empty{display:none}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;pointer-events:auto;background:var(--bg);border-radius:18px 18px 0 0;max-height:min(88%,calc(100dvh - 40px));overflow-y:auto;
  padding-block:8px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  animation:up .22s ease-out}
.sheet .grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.full{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.full .bar-top{display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:8px}
.full .body{flex:1;overflow-y:auto;padding-bottom:48px}
.full .foot{padding-block:12px 16px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--fg)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* how-to carousel */
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

/* timer */
.timer{text-align:center;padding:32px 0 16px}
.timer .big{font-size:64px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.ring{width:220px;height:220px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--p,0%),var(--soft) 0)}
.ring>div{width:196px;height:196px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.setrow{display:grid;grid-template-columns:44px 1fr 1fr 44px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.setrow input{text-align:center;padding:8px 6px}
.setrow .n{font-weight:600;color:var(--muted)}
.setrow.done{opacity:.55}
.setrow .cap{text-transform:capitalize}
.restbox{border-radius:var(--r);background:var(--accent-soft);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cond{display:flex;gap:6px}
.cond button{flex:1;height:44px;border-radius:10px;border:1px solid var(--line);font-weight:600}
.cond button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.delta{font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--warn)}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:40}
.icons{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.icons button{width:66px;height:66px;border-radius:12px;border:1px solid var(--line);flex:none;background:var(--card);display:grid;place-items:center;color:var(--fg)}
.icons button.on{border-color:var(--accent);background:var(--accent-soft)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}
.rpt-sec{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:12px;display:flex;flex-direction:column;gap:10px}
.rpt-sec h3{font-size:14px;font-weight:700;margin:0}
.rpt-chart svg{width:100%;height:auto;display:block}
.rpt-chart text{font-size:4.2px;fill:var(--muted);font-family:inherit}
.rpt-chart rect{fill:var(--accent)}
.rpt-chart .alt rect{fill:var(--good)}
.rpt-chart polyline{fill:none;stroke:var(--accent);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.rpt-chart .dim{opacity:.35}
.rpt-row{display:flex;align-items:center;gap:8px;font-size:13px}
.rpt-row .lbl{width:92px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpt-row .bar{flex:1;margin:0}
.rpt-row .val{width:64px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.rpt-kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px}
.rpt-kv b{font-weight:600}
.rpt-small{font-size:12px;color:var(--muted)}
.rpt-need{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.rpt-list{display:flex;flex-direction:column;gap:6px;font-size:13px}
.rpt-list .it{display:flex;justify-content:space-between;gap:8px}
.rpt-list .it span:last-child{color:var(--muted);white-space:nowrap}
.statusline{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.board .mini .mn{display:none}
.board .mini{width:40px;height:40px}
.board .add{width:34px;height:34px;border-radius:8px;border:1px dashed var(--line);color:var(--muted);font-size:16px;display:grid;place-items:center;margin-top:auto}
.board .col{min-height:140px}
.smart{border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;background:var(--accent-soft);display:flex;flex-direction:column;gap:8px}
.smart .k{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.03em;text-transform:uppercase}
@media (prefers-reduced-motion: reduce){ .sheet{animation:none} }
/* phone: bigger everything */
@media (max-width: 480px){
  body{font-size:16px}
  header.top h1{font-size:22px}
  .card{padding:14px}
  .card .nm{font-size:18px} .card .sub{font-size:13px}
  .card .ic,.ic{width:72px;height:72px;border-radius:16px}
  .ic.sm{width:64px;height:64px}
  .tile .v{font-size:28px} .tile .cap{font-size:13px}
  .btn{height:56px;font-size:17px;border-radius:14px}
  .btn.sm{height:40px;font-size:14px}
  .chk{width:34px;height:34px}
  .list .li{min-height:58px;padding:14px}
  .seg.wide button{padding:11px 10px;font-size:15px}
  .chip{padding:7px 13px;font-size:14px}
  .step button{width:46px;height:46px;font-size:20px} .step .sv{min-width:64px;font-size:17px}
  input,textarea{padding:13px 14px;font-size:16px}
  .board .mini{width:44px;height:44px;border-radius:9px}
  .board .col{min-height:150px}

 {v:'0.18.0',date:'2026-10-22',en:['Inner/outer thigh: hip adduction and abduction machines, side-lying leg raise and adduction, clamshell, lateral band walk, side leg swings','Stretching split into Dynamic (leg swings, arm circles, inchworm, cat-cow...) and Static; new dynamic drills: world\'s greatest stretch, lunge with twist','Swipe left now shows Delete and Cancel buttons; nothing is deleted until you tap Delete','Get-ready screen: tap the Target tile to change sets, reps or weight right there','Leg press redrawn (reclined back on the pad); all 193 figures checked one by one again, 10 poses fixed (push press, side lunge, single-leg deadlift, ball bridge/ham curl/hip raise, happy baby, frog...)'],ko:['이너타이·아웃타이: 힙 어덕션/어브덕션 머신, 사이드 레그 레이즈·어덕션, 클램쉘, 밴드 사이드 워크, 사이드 레그 스윙','스트레칭을 동적(레그 스윙, 팔 돌리기, 인치웜, 캣카우 등)과 정적으로 구분, 동적 드릴 추가: 월드 그레이티스트 스트레칭, 런지 트위스트','왼쪽으로 밀면 삭제·취소 버튼이 나오고, 삭제를 눌러야 지워짐','준비 화면의 목표 타일을 누르면 세트·횟수·무게를 바로 수정','레그프레스 다시 그림(등받이에 기댄 자세), 193개 그림 전수 재확인 후 10개 자세 수정(푸시프레스, 사이드 런지, 싱글레그 데드리프트, 짐볼 브릿지/햄컬/힙레이즈, 해피베이비, 개구리 등)']},
 {v:'0.17.1',date:'2026-10-22',en:['Every exercise card on the Dashboard is tappable: today starts it, other days open the editor','Swipe a card left to delete it (short swipe shows the Delete button, long swipe deletes right away)'],ko:['대시보드의 모든 운동 카드를 누를 수 있음: 오늘은 바로 시작, 다른 날은 편집창','카드를 왼쪽으로 밀면 삭제(짧게 밀면 삭제 버튼, 길게 밀면 바로 삭제)']},
 {v:'0.17.0',date:'2026-10-22',en:['Install as an app: on Android tap "Add to home screen" in Settings, on iPhone use Safari Share → Add to Home Screen','Works offline and loads instantly from the home screen; you are told when an update is ready','Google sign-in from the installed app'],ko:['앱으로 설치: 안드로이드는 설정의 "홈 화면에 추가", 아이폰은 Safari 공유 → 홈 화면에 추가','오프라인에서도 열리고 홈 화면에서 바로 실행, 업데이트가 준비되면 알림','설치된 앱에서도 구글 로그인']},
 {v:'0.16.1',date:'2026-10-22',en:['Body proportions corrected to adult ratios: 7.2 heads tall, longer arms (shoulder to wrist 37% of height), slightly longer thighs'],ko:['인체 비율을 성인 비율로 교정: 7.2등신, 팔을 더 길게(어깨~손목이 키의 37%), 허벅지 약간 길게']},
 {v:'0.16.0',date:'2026-10-21',en:['How-to popup removed: the three steps live on the get-ready screen only','Figure-by-figure check of all 81 drawings: overhead triceps, bench bar, rowing fixed','Review fixes: number inputs clamped, weight step everywhere, kg/lb switch converts all weights, exercise steps capped at 3 with empty steps hidden, step text no longer cut, names wrap, start any day from Weekly, feel scale labelled, backups hidden without sync, dark-mode start button stronger, export can download a file'],ko:['운동 방법 팝업 제거: 3단계는 준비 화면에만','81개 그림 전수 확인: 삼두 오버헤드, 벤치 바, 로잉 수정','리뷰 반영: 숫자 입력 범위 제한, 무게 단위 증가량 통일, kg/lb 전환 시 모든 무게 변환, 단계는 3개까지(빈 단계 숨김), 단계 글 잘림 없음, 이름 줄바꿈, 주간에서 아무 날이나 시작, 컨디션 척도 라벨, 동기화 없으면 백업 숨김, 다크모드 시작 버튼 진하게, 내보내기 파일 다운로드']},
 {v:'0.15.0',date:'2026-10-21',en:['One fixed scale for every figure: the person is the same size in every exercise and every step, centred in the box; arrows and line weights no longer change with the pose'],ko:['모든 그림을 고정 배율로: 어떤 운동·어떤 단계든 사람 크기가 같고 박스 중앙에 배치, 화살표와 선 굵기도 동작에 따라 변하지 않음']},
 {v:'0.14.1',date:'2026-10-21',en:['Get-ready screen: everything centred, muscle silhouettes removed, the three how-to steps shown right on the screen','Arrows keep a wider gap from the body'],ko:['준비 화면: 전부 가운데 정렬, 자극 부위 실루엣 제거, 운동 방법 3단계를 화면에 바로 표시','화살표가 몸에서 더 멀리 떨어짐']},
 {v:'0.14.0',date:'2026-10-21',en:['More human figures: shoes instead of foot lines (sole always on the floor side), hands drawn as hands and as fists when holding equipment, torso with a chest curve, rounded upper back and a waist (front view has a waist too)','Held equipment (bar, plates, dumbbells, kettlebells, balls, bands) now sits in front of the body with the fist on top'],ko:['더 사람다운 인체: 발은 신발 모양(밑창이 항상 바닥 쪽), 손은 손 모양·기구를 잡을 땐 주먹, 몸통은 가슴 곡선·둥근 등·허리(정면도도 허리 있음)','들고 있는 기구(바·원판·덤벨·케틀벨·공·밴드)는 몸 앞에, 주먹은 그 위에 표시']},

const S={exercises:[],routines:[],settings:{lang:'en',weeklyGoal:3,unit:'kg',restSec:60,mode:'preset',smartAlternate:true,smartSplit:'auto',smartProgress:true,weightStep:2.5},plans:{},logs:{},body:{},notes:{},rptPeriod:'4w',tab:'dash',sub:null,
  weekStart:null,month:null,selDay:null,backend:'local',canWrite:true,libFilter:'all',libMuscle:'all',libEquip:'all',libQuery:'',pickMuscle:'all',pickEquip:'all'};
let DB=null;
const uid=()=> 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

// ---------- dates ----------
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
// The app's day starts at 04:00: until then "today" is still the previous calendar day (late workouts stay on the evening's date).
const DAY_START_HOUR=4; const appNow=()=>{ const d=new Date(); if(d.getHours()<DAY_START_HOUR)d.setDate(d.getDate()-1); return d; }; // local calendar shift, DST-safe
const todayKey=()=>keyOf(appNow());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const startOfWeek=d=>{const x=new Date(d);x.setHours(0,0,0,0);const w=(x.getDay()+6)%7;return addDays(x,-w);};
const locale=()=>S.settings.lang==='ko'?'ko-KR':'en-US';
const fmtMD=d=>new Intl.DateTimeFormat(locale(),{month:'short',day:'numeric'}).format(d);
const fmtLong=d=>new Intl.DateTimeFormat(locale(),{month:'long',day:'numeric',weekday:'short'}).format(d);
const fmtMonth=d=>new Intl.DateTimeFormat(locale(),{year:'numeric',month:'long'}).format(d);
const t=k=>{const L=I18N[S.settings.lang]||I18N.en;return (k in L)?L[k]:(I18N.en[k]??k);};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss=s=>{s=Math.max(0,Math.round(s));return pad(Math.floor(s/60))+':'+pad(s%60);};

// ---------- storage ----------
function loadLocal(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw){const o=JSON.parse(raw);Object.assign(S,{exercises:o.exercises||[],routines:o.routines||[],settings:Object.assign(S.settings,o.settings||{}),plans:o.plans||{},logs:o.logs||{},body:o.body||{},notes:o.notes||{}});}}catch(e){}
  if(!S.exercises.length)S.exercises=DEFAULT_EXERCISES();
  if(mergeDefaults())saveLocal();
}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({exercises:S.exercises,routines:S.routines,settings:S.settings,plans:S.plans,logs:S.logs,body:S.body,notes:S.notes}));return true;}catch(e){return false;}}
const clean=o=>JSON.parse(JSON.stringify(o));
async function dbWrite(fn){ if(!DB)return; try{await fn(); if(S.lastError){S.lastError=null;renderStatus();}}catch(e){ if(e&&(e.code==='invalid_argument'||e.code==='permission-denied')){S.canWrite=false;} S.lastError=((e&&(e.code||e.message))||'error').toString().slice(0,60); renderStatus(); toast(t('save_failed')); } }
const persist={
  exercises(){saveLocal();dbWrite(()=>DB.doc('app/exercises').set(clean(packExercises())));},
  settings(){saveLocal();dbWrite(()=>DB.doc('app/settings').set(clean(S.settings)));},
  routines(){saveLocal();dbWrite(()=>DB.doc('app/routines').set(clean({items:S.routines})));},
  plan(date){saveLocal();const p=S.plans[date];dbWrite(()=>p&&p.items.length?DB.doc('plans/'+date).set(clean({date,items:p.items})):DB.doc('plans/'+date).delete());},
  log(date){saveLocal();const l=S.logs[date];dbWrite(()=>l&&l.entries.length?DB.doc('logs/'+date).set(clean({date,entries:l.entries})):DB.doc('logs/'+date).delete());},
  body(date){const ok=saveLocal();const b=S.body[date];dbWrite(()=>b?DB.doc('body/'+date).set(clean(Object.assign({date},b))):DB.doc('body/'+date).delete());return ok;},
  notes(key){const ok=saveLocal();const v=S.notes[key];dbWrite(()=>v?DB.doc('notes/'+key).set(clean({week:key,text:v})):DB.doc('notes/'+key).delete());return ok;}
};
let UNSUBS=[];
const snapExists=sn=>typeof sn.exists==='function'?sn.exists():!!sn.exists;
const pending=sn=>!!(sn.metadata&&sn.metadata.hasPendingWrites);
let FIRST={ex:false,st:false,rt:false,pl:false,plSrv:false,lg:false};
function packExercises(){ const defs=DEFAULT_EXERCISES(); const byId=Object.fromEntries(defs.map(d=>[d.id,d])); const custom=[],overrides={};
  S.exercises.forEach(e=>{ const d=byId[e.id]; if(!d){custom.push(e);return;} const o={}; ['nameEn','nameKo','icon','type','muscle','equip','mode','sets','reps','weight','rest','minutes','hidden'].forEach(k=>{ if(JSON.stringify(e[k])!==JSON.stringify(d[k]))o[k]=e[k]; }); if(JSON.stringify(e.steps)!==JSON.stringify(d.steps))o.steps=e.steps; if(Object.keys(o).length)overrides[e.id]=o; });
  return {v:2,custom,overrides}; }
function unpackExercises(data){ if(data&&data.v===2){ const list=DEFAULT_EXERCISES().map(d=>Object.assign(d,data.overrides&&data.overrides[d.id]||{})); return list.concat((data.custom||[]).map(x=>Object.assign({},x))); } return ((data&&data.items)||[]).map(x=>Object.assign({},x)); }
function subscribeAll(){ UNSUBS.forEach(u=>{try{u();}catch(e){}}); UNSUBS=[]; const db=DB; if(!db)return; FIRST={ex:false,st:false,rt:false,pl:false,plSrv:false,lg:false};
  const onErr=(e)=>{ S.lastError=(e&&e.code)||'error'; renderStatus(); };
  const maybeBackup=()=>{ if(FIRST.ex&&FIRST.st&&FIRST.pl&&FIRST.lg&&!FIRST.bk){ FIRST.bk=true; if(Object.keys(S.plans).length||Object.keys(S.logs).length)setTimeout(()=>makeBackup(false),3000); } };
  UNSUBS.push(db.doc('app/exercises').onSnapshot(snap=>{
    if(snapExists(snap)){ S.exercises=unpackExercises(snap.data()); const old=!(snap.data()&&snap.data().v===2); if((mergeDefaults()||old)&&S.canWrite&&!pending(snap))dbWrite(()=>DB.doc('app/exercises').set(clean(packExercises()))); }
    else if(S.canWrite){ dbWrite(()=>DB.doc('app/exercises').set(clean(packExercises()))); }
    FIRST.ex=true; saveLocal();render();maybeBackup();
  },onErr));
  UNSUBS.push(db.doc('app/settings').onSnapshot(snap=>{
    if(snapExists(snap)){S.settings=Object.assign({},S.settings,snap.data());}
    else if(S.canWrite){ dbWrite(()=>DB.doc('app/settings').set(clean(S.settings))); }
    FIRST.st=true; saveLocal();render();maybeBackup();
  },onErr));
  UNSUBS.push(db.doc('app/routines').onSnapshot(snap=>{ if(snapExists(snap)){S.routines=(snap.data().items||[]).map(x=>Object.assign({},x));} else if(S.routines.length&&S.canWrite&&!FIRST.rt){ dbWrite(()=>DB.doc('app/routines').set(clean({items:S.routines}))); } FIRST.rt=true; saveLocal();render(); },onErr));
  UNSUBS.push(db.collection('plans').onSnapshot(q=>{ if(!(q.metadata&&q.metadata.fromCache))FIRST.plSrv=true; const o={};q.docs.forEach(d=>{const b=d.data();o[d.id]={items:(b.items||[]).map(x=>Object.assign({},x))};});
    if(!FIRST.pl&&!q.docs.length&&Object.keys(S.plans).length&&S.canWrite){ const local=S.plans; FIRST.pl=true; Object.keys(local).forEach(k=>persist.plan(k)); maybeBackup(); return; }
    FIRST.pl=true; S.plans=o;saveLocal();render();maybeBackup();},onErr));
  UNSUBS.push(db.collection('logs').onSnapshot(q=>{const o={};q.docs.forEach(d=>{const b=d.data();o[d.id]={entries:(b.entries||[]).map(x=>Object.assign({},x))};});
    if(!FIRST.lg&&!q.docs.length&&Object.keys(S.logs).length&&S.canWrite){ const local=S.logs; FIRST.lg=true; Object.keys(local).forEach(k=>persist.log(k)); maybeBackup(); return; }
    FIRST.lg=true; S.logs=o;saveLocal();render();maybeBackup();},onErr));
  UNSUBS.push(db.collection('body').onSnapshot(q=>{ const o={}; q.docs.forEach(d=>{ const b=d.data()||{}; o[d.id]={w:+b.w||0,sleep:+b.sleep||0,note:String(b.note||'')}; }); if(!FIRST.bd&&!q.docs.length&&Object.keys(S.body).length&&S.canWrite){ FIRST.bd=true; Object.keys(S.body).forEach(k=>persist.body(k)); return; } FIRST.bd=true; S.body=o; saveLocal(); if(S.tab==='report')render(); },onErr));
  UNSUBS.push(db.collection('notes').onSnapshot(q=>{ const o={}; q.docs.forEach(d=>{ const b=d.data()||{}; if(b.text)o[d.id]=String(b.text); }); if(!FIRST.nt&&!q.docs.length&&Object.keys(S.notes).length&&S.canWrite){ FIRST.nt=true; Object.keys(S.notes).forEach(k=>persist.notes(k)); return; } FIRST.nt=true; S.notes=o; saveLocal(); if(S.tab==='report')render(); },onErr));
  renderStatus();
}

const FB={auth:null,fs:null,user:null,configured:false};
function firebaseReady(){ const c=window.FIREBASE_CONFIG; return !!(window.firebase&&c&&c.apiKey&&!/PASTE/.test(String(c.apiKey))); }
function makeFirestoreDB(uid){ const fs=FB.fs,pre='users/'+uid+'/'; return {doc:p=>fs.doc(pre+p),collection:p=>fs.collection(pre+p)}; }
async function connectFirebase(){ if(!firebaseReady())return false; FB.configured=true;
  try{ if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG); FB.auth=firebase.auth(); FB.fs=firebase.firestore();
    try{ await FB.fs.enablePersistence({synchronizeTabs:true}); }catch(e){}
    try{ await FB.auth.getRedirectResult(); }catch(e){}

function smartDays(ws,n,fromDay){ fromDay=fromDay||0; if(S.settings.smartAlternate!==false&&n<=4){ let start=fromDay; if(fromDay===0&&planOf(keyOf(addDays(ws,-1))).length)start=1; const days=[]; for(let d=start;d<7&&days.length<n;d+=2)days.push(d); if(days.length===n)return {days,alt:true}; }
  const base=(DEFAULT_WD[n]||DEFAULT_WD[7]).filter(d=>d>=fromDay); if(base.length>=n)return {days:base.slice(0,n),alt:false}; const rest=[]; for(let d=fromDay;d<7&&rest.length<n;d++)rest.push(d); return {days:rest,alt:false}; }

  const since=keyOf(addDays(appNow(),-28)); const hist=Object.keys(S.logs).filter(k=>k>=since).flatMap(k=>logOf(k)); const used=new Set(hist.map(e=>e.exId));
  const cands=allRoutines(); let routine,starter=!used.size; const split=S.settings.smartSplit||'auto';
  if(split!=='auto'&&SPLIT_ROUTINE[split]) routine=cands.find(r=>r.id===SPLIT_ROUTINE[split]);

  if(!routine) routine=cands.find(r=>r.id===(n<=3?'rt_full3':n===4?'rt_ul':'rt_ppl'))||cands[0];
  const prog=S.settings.smartProgress!==false; const step=S.settings.weightStep||(S.settings.unit==='lb'?5:2.5);

    d.exIds.forEach(id=>{ const ex=exById(id); if(!ex||ex.hidden)return; const it={id:uid(),exId:ex.id,mode:ex.mode,minutes:ex.minutes,sets:ex.sets,reps:ex.reps,weight:ex.weight,rest:ex.rest??S.settings.restSec,status:'planned'};

        if(last.mode==='sets'&&it.mode==='sets'){ const done=last.sets.filter(x=>x.done); if(done.length&&done.length>=last.sets.length){ const w=Math.max(...done.map(x=>x.weight||0)); const r=Math.round(done.reduce((a,x)=>a+x.reps,0)/done.length);
            if(w>0){ if(r>=it.reps){ it.weight=Math.round((w+step)*10)/10; changes.push(exName(ex)+' +'+step+S.settings.unit); } else it.weight=w; } else if(r>=it.reps&&r<20){ it.reps=r+1; changes.push(exName(ex)+' +1 '+t('reps')); } }

async function makeBackup(force){ if(!DB||!S.canWrite)return false; const k=todayKey();
  try{ if(!force){ const snap=await DB.doc('backups/'+k).get(); if(snapExists(snap))return false; } }catch(e){}
  const limit=S.backend==='db'?200000:900000;
  const build=(days)=>{ const cut=keyOf(addDays(appNow(),-days)); const pick=o=>Object.fromEntries(Object.entries(o).filter(([d])=>d>=cut)); return {kind:'data',date:k,at:Date.now(),days,settings:S.settings,routines:S.routines,plans:pick(S.plans),logs:pick(S.logs),body:S.body,notes:S.notes,planDays:Object.keys(S.plans).length,logDays:Object.keys(S.logs).length}; };
  let body=null; for(const days of [730,365,180,90,45]){ const b=build(days); if(JSON.stringify(b).length<limit){body=b;break;} }
  if(!body){ S.backupError=true; return false; }
  try{ await DB.doc('backups/'+k).set(clean(body)); await DB.doc('backups/'+k+'-lib').set(clean(Object.assign({kind:'lib',date:k},packExercises()))); S.backupError=false; }catch(e){ S.backupError=true; return false; }
  try{ const cutoff=keyOf(addDays(appNow(),-14)); const old=await DB.collection('backups').get(); for(const d of old.docs){ const b=d.data()||{}; if((b.date||'')<cutoff){ try{await DB.doc('backups/'+d.id).delete();}catch(e){} } } }catch(e){}
  return true; }
async function openBackups(){ showSheet(`<h2 style="margin-bottom:4px">${esc(t('backups'))}</h2><div class="cap" style="margin-bottom:12px">${esc(t('auto_backup_note'))}</div><div id="bklist"><div class="empty">…</div></div>${DB&&S.canWrite?`<button class="btn sec" style="margin-top:12px" id="bknow">${esc(t('backup_now'))}</button>`:''}`);
  $('#bknow')?.addEventListener('click',async()=>{ const ok=await makeBackup(true); toast(ok?t('backed_up'):t('backup_failed')); fill(); });
  async function fill(){ if(!DB){$('#bklist').innerHTML=`<div class="empty">${esc(t('local_only'))}</div>`;return;}
    let docs=[]; try{ const q=await DB.collection('backups').get(); docs=q.docs.filter(d=>!d.id.endsWith('-lib')).slice().sort((a,b)=>(b.data().date||'').localeCompare(a.data().date||'')).slice(0,30); }catch(e){ $('#bklist').innerHTML=`<div class="empty">${esc(t('backup_failed'))}</div>`; return; }

    $('#bklist').querySelectorAll('[data-bk]').forEach(b=>b.addEventListener('click',()=>confirmSheet(t('confirm_restore'),t('restore'),()=>restoreBackup(b.dataset.bk),true))); }
  fill(); }
async function restoreBackup(id){ try{ const d=await DB.doc('backups/'+id).get(); const l=await DB.doc('backups/'+id+'-lib').get(); if(!snapExists(d)){toast(t('import_fail'));return;} const b=d.data();

    S.settings=Object.assign({},S.settings,b.settings||{}); S.routines=(b.routines||[]).map(x=>Object.assign({},x)); S.plans=JSON.parse(JSON.stringify(b.plans||{})); S.logs=JSON.parse(JSON.stringify(b.logs||{})); if(b.body)S.body=JSON.parse(JSON.stringify(b.body)); if(b.notes)S.notes=JSON.parse(JSON.stringify(b.notes));

// ---------- Perform flow ----------
const P={active:false,queue:[],idx:0,stage:'prepare',timer:null,restTimer:null,lock:null};
function startQueue(q){ if(!q.length)return; q.forEach(x=>{ const it=planOf(x.date).find(i=>i.id===x.id); if(it)x.snap=Object.assign({},it); }); Object.assign(P,{active:true,queue:q,idx:0}); enterPrepare(); }
function saveP(){ try{ if(P.active)localStorage.setItem('wwt.perform',JSON.stringify({at:Date.now(),queue:P.queue,idx:P.idx,stage:P.stage==='complete'?'perform':P.stage,sets:P.sets,startedAt:P.startedAt,endAt:P.endAt,remaining:P.remaining,total:P.total,memo:P.memo,pausedMs:P.pausedMs,paused:P.paused})); else localStorage.removeItem('wwt.perform'); }catch(e){} }
function checkResume(){ let saved=null; try{ saved=JSON.parse(localStorage.getItem('wwt.perform')||'null'); }catch(e){} if(!saved||Date.now()-saved.at>6*3600*1000){ try{localStorage.removeItem('wwt.perform');}catch(e){} return; }
  showSheet(`<p style="margin:4px 0 16px;font-weight:600">${esc(t('resume_q'))}</p><div class="stack" style="gap:8px"><button class="btn pri" id="rs-yes">${esc(t('resume'))}</button><button class="btn ghost" id="rs-no">${esc(t('discard_ex'))}</button></div>`);
  $('#rs-no').addEventListener('click',()=>{closeSheet();try{localStorage.removeItem('wwt.perform');}catch(e){}});
  $('#rs-yes').addEventListener('click',()=>{ closeSheet(); Object.assign(P,{active:true,queue:saved.queue,idx:saved.idx,stage:'prepare'}); if(saved.stage==='perform'){ P.stage='perform'; P.sets=saved.sets; P.startedAt=saved.startedAt; P.memo=saved.memo||''; P.pausedMs=saved.pausedMs||0; P.paused=false; const {it}=curItem(); if(it&&it.mode==='time'){ P.total=saved.total; P.remaining=Math.max(0,Math.round((saved.endAt-Date.now())/1000)); P.endAt=Date.now()+P.remaining*1000; P.timer=setInterval(tick,500); } P.restRemaining=0; keepAwake(); renderPerform(); } else enterPrepare(); }); }
function curItem(){ const q=P.queue[P.idx]; if(!q)return {date:todayKey(),it:null,ex:null}; const it=planOf(q.date).find(x=>x.id===q.id)||q.snap||null; return {date:q.date,it,ex:it?exById(it.exId):null}; }
async function keepAwake(){ try{ if(!P.lock&&navigator.wakeLock){ P.lock=await navigator.wakeLock.request('screen'); P.lock.addEventListener('release',()=>{P.lock=null;}); } }catch(e){ P.lock=null; } }
function releaseAwake(){ try{ if(P.lock){P.lock.release();P.lock=null;} }catch(e){} }
function buzz(pat){ try{ if(navigator.vibrate)navigator.vibrate(pat||[150,80,150]); }catch(e){} }
function enterPrepare(){ stopTimers(); P.stage='prepare'; renderPerform(); saveP(); }
function enterPerform(){ const {it,ex,date}=curItem(); if(!it)return exitPerform(); stopTimers(); P.stage='perform'; P.startedAt=Date.now(); P.paused=false; P.pausedMs=0; P.memo=''; keepAwake();
  if(it.mode==='time'){ P.remaining=it.minutes*60; P.total=P.remaining; P.endAt=Date.now()+P.remaining*1000; P.timer=setInterval(tick,500); }
  else { P.sets=[]; for(let i=0;i<it.sets;i++){ P.sets.push({reps:it.reps,weight:it.weight,done:false}); } P.restRemaining=0; P.restEndAt=0; }
  renderPerform(); saveP(); }
function tick(){ if(P.paused)return; P.remaining=Math.max(0,Math.round((P.endAt-Date.now())/1000)); const el=$('#big'); if(el){el.textContent=mmss(P.remaining);} const r=$('#ring'); if(r)r.style.setProperty('--p',(100-P.remaining/P.total*100)+'%'); if(P.remaining<=0){ stopTimers(); buzz([300,100,300,100,300]); finishPerform(); } }

  stopTimers(); if(P.paused&&P.pauseAt){P.pausedMs=(P.pausedMs||0)+(Date.now()-P.pauseAt);P.paused=false;} const dur=Math.max(1,Math.round((Date.now()-P.startedAt-(P.pausedMs||0))/1000));
  P.result={id:uid(),planItemId:it.id,exId:it.exId,mode:it.mode,startedAt:P.startedAt,endedAt:Date.now(),duration:it.mode==='time'?Math.min(dur,it.minutes*60*3+900):dur,sets:it.mode==='sets'?P.sets.map(s=>Object.assign({},s)):[],memo:P.memo||'',condition:0,rpe:0};

function resultDelta(r){ const prevS=entryScore(P.prev), curS=entryScore(r); if(prevS==null||curS==null)return ''; const d=curS-prevS; const cls=d>0?'up':d<0?'down':''; return `<span class="delta ${cls}">${d>0?'↑':d<0?'↓':'='} ${r.mode==='time'?mmss(Math.abs(d)):Math.abs(Math.round(d*10)/10)}</span> <span class="cap">${esc(t('vs_last'))} ${esc(entrySummary(P.prev))}</span>`; }
function onHowtoScroll(e){ if(e.target.id!=='howto')return; const h=e.target; const i=Math.round(h.scrollLeft/(h.clientWidth+12)); h.parentElement.querySelectorAll('#dots i').forEach((d,j)=>d.classList.toggle('on',j===i)); }
function onPerfInput(e){ const x=e.target; if(x.id==='memo'){P.memo=x.value;saveP();return;} if(P.result&&x.id==='durmin'){ const m=Math.max(0,Math.min(1440,Math.round(+x.value||0))); if(m>0){ P.result.duration=m*60; const dv=$('#dur-v'); if(dv)dv.textContent=mmss(P.result.duration); const de=$('#delta'); if(de)de.innerHTML=resultDelta(P.result); } return;} if(P.result&&x.id==='dist'){P.result.distance=Math.max(0,+x.value||0);return;} if(P.result&&x.id==='hr'){P.result.hr=Math.max(0,Math.round(+x.value||0));return;} }

  if(b.dataset.sp){ const i=+b.dataset.i, k=b.dataset.sp, d=+b.dataset.d; const st=k==='weight'?(S.settings.weightStep||2.5):1; const s0=P.sets[i]; const nv=Math.max(0,Math.round((s0[k]+d*st)*10)/10); s0[k]=nv; for(let j=i+1;j<P.sets.length;j++){ if(!P.sets[j].done)P.sets[j][k]=nv; } const sc=$('#perf .body')?.scrollTop||0; renderPerform(); const bd=$('#perf .body'); if(bd)bd.scrollTop=sc; saveP(); return; }

  else if(a==='pause'){ if(P.paused){P.paused=false;P.pausedMs=(P.pausedMs||0)+(Date.now()-P.pauseAt);P.endAt=Date.now()+P.remaining*1000;} else {P.paused=true;P.pauseAt=Date.now();} b.textContent=P.paused?t('resume'):t('pause'); saveP(); }
  else if(a==='plus1'||a==='minus1'){ const d=a==='plus1'?60:-60; P.remaining=Math.max(10,P.remaining+d); P.total=Math.max(P.total+d,P.remaining); P.endAt=Date.now()+P.remaining*1000; $('#big').textContent=mmss(P.remaining); }

    case 'rpt-save-checkin': { const k=todayKey(); const w=+($('#ci-w').value)||0, sl=+($('#ci-s').value)||0, note=($('#ci-n').value||'').trim(); if(w||sl||note)S.body[k]={w,sleep:sl,note}; else delete S.body[k]; toast(persist.body(k)?t('rpt_saved'):t('save_failed')); render(); break; }
    case 'rpt-save-note': { const k=keyOf(startOfWeek(appNow())); const v=($('#wk-note').value||'').trim(); if(v)S.notes[k]=v; else delete S.notes[k]; toast(persist.notes(k)?t('rpt_saved'):t('save_failed')); break; }
    case 'rpt-text': { const txt=rptText(rptBuild()); navigator.clipboard.writeText(txt).then(()=>toast(t('copied'))).catch(()=>{ showSheet(`<textarea rows="10" readonly>${esc(txt)}</textarea>`); }); break; }
    case 'rpt-csv': { const blob=new Blob([rptCsv()],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='my-fit-report-'+todayKey()+'.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); break; }
    case 'repeat-off': delete S.settings.repeatRoutine; persist.settings(); render(); break;
    case 'go-week': S.tab='week'; S.selDay=todayKey(); S.weekStart=keyOf(startOfWeek(appNow())); render(); break;
    case 'install': { if(S.installEvt){ const ev=S.installEvt; S.installEvt=null; ev.prompt(); ev.userChoice.then(()=>render()); } else { showSheet(`<h2 style="margin-bottom:10px">${esc(t('install'))}</h2><ol style="padding-left:20px;line-height:1.7;margin:0 0 12px"><li>${esc(t('ios_1'))}</li><li>${esc(t('ios_2'))}</li><li>${esc(t('ios_3'))}</li></ol><button class="btn ghost" data-act="close-sheet">${esc(t('close'))}</button>`); } break; }
    case 'start-day': { const d=S.selDay||todayKey(); startQueue(planOf(d).filter(i=>i.status==='planned').map(i=>({date:d,id:i.id}))); break; }
    case 'start-today': { const d=todayKey(); startQueue(planOf(d).filter(i=>i.status==='planned').map(i=>({date:d,id:i.id}))); break; }
    case 'open-item': { if(S._swiping)break; const d=a.dataset.k||todayKey(); const it=planOf(d).find(x=>x.id===a.dataset.id); if(!it)break; if(d!==todayKey()||it.status!=='planned'){openItemEditor(d,it.id);} else startQueue([{date:d,id:a.dataset.id}]); break; }
    case 'swipe-cancel': { const w=a.closest('.swipe'); w&&w.classList.remove('open'); break; }
    case 'swipe-del': { const d=a.dataset.k; const id=a.dataset.id; const it=planOf(d).find(x=>x.id===id); if(!it)break; S.plans[d].items=planOf(d).filter(x=>x.id!==id); if(S.logs[d]){S.logs[d].entries=S.logs[d].entries.filter(x=>x.planItemId!==id);persist.log(d);} persist.plan(d); toast(t('removed')); render(); break; }
    case 'add-day': S.selDay=a.dataset.k; openPicker(a.dataset.k); break;
    case 'smart-apply': applySmart(); break;
    case 'smart-regen': confirmSheet(t('confirm_regen'),t('regenerate'),()=>applySmart(),true); break;
    case 'week-today': S.weekStart=keyOf(startOfWeek(appNow())); S.selDay=todayKey(); S.smartInfo=null; render(); break;
    case 'month-today': { const n=appNow(); S.month=keyOf(new Date(n.getFullYear(),n.getMonth(),1)); render(); break; }
    case 'week-prev': S.weekStart=keyOf(addDays(parseKey(S.weekStart),-7)); S.selDay=S.weekStart; S.smartInfo=null; render(); break;
    case 'week-next': S.weekStart=keyOf(addDays(parseKey(S.weekStart),7)); S.selDay=S.weekStart; S.smartInfo=null; render(); break;
    case 'copy-week': copyLastWeek(); break;
    case 'open-routines': openRoutineList(); break;
    case 'backups': openBackups(); break;
    case 'changelog': openChangelog(); break;
    case 'sign-in': signIn(); break;
    case 'sign-out': signOut().then(()=>render()); break;
    case 'save-routine': saveWeekAsRoutine(); break;
    case 'edit-item': openItemEditor(a.dataset.k||S.selDay,a.dataset.id); break;
    case 'month-prev': { const m=parseKey(S.month); S.month=keyOf(new Date(m.getFullYear(),m.getMonth()-1,1)); render(); break; }
    case 'month-next': { const m=parseKey(S.month); S.month=keyOf(new Date(m.getFullYear(),m.getMonth()+1,1)); render(); break; }
    case 'day-detail': openDayDetail(a.dataset.k); break;
    case 'open-lib': S.sub='library'; render(); break;
    case 'back': S.sub=null; render(); break;
    case 'new-ex': S.editEx=blankExercise(); S.editDirty=false; S.sub='edit'; render(); break;
    case 'edit-ex': S.editEx=JSON.parse(JSON.stringify(exById(a.dataset.id))); S.editDirty=false; S.sub='edit'; render(); break;
    case 'back-edit': if(S.editDirty){confirmSheet(t('discard'),t('discard_btn'),()=>{S.sub='library';render();},true);} else {S.sub='library';render();} break;
    case 'save-ex': saveExercise(); break;
    case 'add-step': S.editEx.steps.push({titleEn:'',titleKo:'',cueEn:'',cueKo:'',mistakeEn:'',mistakeKo:''}); renderEdit(); break;
    case 'rm-step': S.editEx.steps.pop(); renderEdit(); break;
    case 'toggle-hide': S.editEx.hidden=!S.editEx.hidden; saveExercise(); break;
    case 'del-ex': confirmSheet(t('confirm_delete_ex'),t('delete'),()=>{S.exercises=S.exercises.filter(x=>x.id!==S.editEx.id);persist.exercises();S.sub='library';render();},true); break;
    case 'export': { const json=JSON.stringify({exercises:S.exercises,routines:S.routines,settings:S.settings,plans:S.plans,logs:S.logs,body:S.body,notes:S.notes},null,1); showSheet(`<h2 style="margin-bottom:10px">${esc(t('export'))}</h2><textarea id="exp" rows="8" readonly>${esc(json)}</textarea><button class="btn pri" style="margin-top:10px" id="cp">${esc(t('copy'))}</button>${(window.claude&&window.claude.use)?'':`<button class="btn sec" style="margin-top:8px" id="dl">${esc(t('download'))}</button>`}`); $('#dl')?.addEventListener('click',()=>{ const blob=new Blob([json],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='my-fit-'+todayKey()+'.json'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); });
      $('#cp').addEventListener('click',()=>{navigator.clipboard.writeText(json).then(()=>toast(t('copied'))).catch(()=>{$('#exp').select();});}); break; }
    case 'import': { showSheet(`<h2 style="margin-bottom:10px">${esc(t('import'))}</h2><textarea id="imp" rows="8" placeholder="{...}"></textarea><button class="btn pri" style="margin-top:10px" id="ib">${esc(t('import_btn'))}</button>`);
      $('#ib').addEventListener('click',()=>{ try{ const o=JSON.parse($('#imp').value); if(!o||typeof o!=='object')throw 0; const pk=Object.keys(S.plans),lk=Object.keys(S.logs); if(Array.isArray(o.exercises)){S.exercises=o.exercises;mergeDefaults();} if(o.settings)S.settings=Object.assign(S.settings,o.settings); if(Array.isArray(o.routines))S.routines=o.routines; if(o.plans)S.plans=o.plans; if(o.logs)S.logs=o.logs; if(o.body&&typeof o.body==='object'){ const bk=Object.keys(S.body); S.body={}; Object.keys(o.body).forEach(k=>{ const x=o.body[k]||{}; const w=+x.w||0,sl=+x.sleep||0,note=String(x.note||'').slice(0,140); if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&(w||sl||note))S.body[k]={w,sleep:sl,note}; }); new Set([...bk,...Object.keys(S.body)]).forEach(k=>persist.body(k)); } if(o.notes&&typeof o.notes==='object'){ const nk=Object.keys(S.notes); S.notes={}; Object.keys(o.notes).forEach(k=>{ const v=String(o.notes[k]||'').slice(0,500); if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&v)S.notes[k]=v; }); new Set([...nk,...Object.keys(S.notes)]).forEach(k=>persist.notes(k)); } persist.exercises();persist.settings();persist.routines();new Set([...pk,...Object.keys(S.plans)]).forEach(k=>persist.plan(k));new Set([...lk,...Object.keys(S.logs)]).forEach(k=>persist.log(k)); closeSheet(); toast(t('imported')); render(); }catch(err){ toast(t('import_fail')); } }); break; }
    case 'reset': confirmSheet(t('confirm_reset'),t('delete'),()=>{ const pk=Object.keys(S.plans),lk=Object.keys(S.logs); const bk=Object.keys(S.body),nk=Object.keys(S.notes); S.plans={};S.logs={}; S.body={}; S.notes={}; S.exercises=DEFAULT_EXERCISES(); pk.forEach(k=>persist.plan(k)); lk.forEach(k=>persist.log(k)); bk.forEach(k=>persist.body(k)); nk.forEach(k=>persist.notes(k)); persist.exercises(); render(); },true); break;
  }
});

loadLocal(); render(); connectDb(); checkWhatsNew(); checkResume();
(function(){ let sw=null,x0=0,y0=0,dx=0,dragging=false,hor=null; const main=document.body;
  const closeAll=(except)=>{ document.querySelectorAll('.swipe.open').forEach(el=>{ if(el!==except)el.classList.remove('open'); }); };
  const start=(el,x,y)=>{ sw=el; x0=x; y0=y; dx=0; hor=null; dragging=false; };
  const move=(x,y)=>{ if(!sw)return; const mx=x-x0,my=y-y0; if(hor==null){ if(Math.abs(mx)<6&&Math.abs(my)<6)return; hor=Math.abs(mx)>Math.abs(my); if(!hor){sw=null;return;} sw.classList.add('dragging'); dragging=true; S._swiping=true; }
    const base=sw.classList.contains('open')?-168:0; dx=Math.max(-180,Math.min(0,base+mx)); sw.querySelector('.card').style.transform=`translateX(${dx}px)`; };
  const end=()=>{ if(!sw)return; const el=sw; sw=null; el.classList.remove('dragging'); const card=el.querySelector('.card'); card.style.transform='';
    if(dragging){ if(dx<-48){ closeAll(el); el.classList.add('open'); } else el.classList.remove('open'); }
    setTimeout(()=>{S._swiping=false;},50); };
  main.addEventListener('touchstart',e=>{ const el=e.target.closest('.swipe'); if(!el){closeAll();return;} if(e.target.closest('.swipe-acts'))return; start(el,e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
  main.addEventListener('touchmove',e=>{ if(sw)move(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
  main.addEventListener('touchend',end); main.addEventListener('touchcancel',end);
  main.addEventListener('mousedown',e=>{ const el=e.target.closest('.swipe'); if(!el){closeAll();return;} if(e.target.closest('.swipe-acts'))return; start(el,e.clientX,e.clientY); });
  main.addEventListener('mousemove',e=>{ if(sw&&e.buttons)move(e.clientX,e.clientY); });
  main.addEventListener('mouseup',end);
})();
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); S.installEvt=e; if(S.tab==='settings'&&!S.sub)render(); });
window.addEventListener('appinstalled',()=>{ S.installEvt=null; toast('My Fit ✓'); if(S.tab==='settings')render(); });
window.addEventListener('myfit-update',()=>{ if(P.active)return; showSheet(`<p style="margin:4px 0 16px;font-weight:600">${esc(t('update_ready'))}</p><div class="stack" style="gap:8px"><button class="btn pri" id="up-reload">${esc(t('reload'))}</button><button class="btn ghost" data-act="close-sheet">${esc(t('close'))}</button></div>`); $('#up-reload').addEventListener('click',()=>location.reload()); });
let LAST_DAY=todayKey(); setInterval(()=>{ if(todayKey()!==LAST_DAY){ LAST_DAY=todayKey(); S.smartInfo=null; render(); } },60000);
})();
