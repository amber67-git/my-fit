<style>
/* Layout: one-screen app. Sticky header, scrolling main, fixed bottom tab bar. White, one accent, five soft type colors. */
:root{
  --bg:#ffffff; --fg:#141516; --muted:#8a8d93; --line:#ebecee; --soft:#f5f6f8; --card:#ffffff;
  --accent:#2f6bff; --accent-fg:#ffffff; --accent-soft:#e9efff;
  --good:#1f9d6a; --warn:#d9822b;
  --c-stretch:#2fb8a6; --c-warmup:#f2a93b; --c-strength:#2f6bff; --c-cardio:#f26b5b; --c-cooldown:#8b6cf2;
  --font:"IBM Plex Sans KR","Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --r:12px; --nav-h:58px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111214; --fg:#f1f2f4; --muted:#8f9298; --line:#27292d; --soft:#1b1d21; --card:#17191c; --accent:#5b8bff; --accent-soft:#1d2a4d; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#111214; --fg:#f1f2f4; --muted:#8f9298; --line:#27292d; --soft:#1b1d21; --card:#17191c; --accent:#5b8bff; --accent-soft:#1d2a4d; color-scheme:dark; }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:24px} h2{font-size:17px} h3{font-size:15px}
.muted{color:var(--muted)} .cap{font-size:12px;color:var(--muted)} .num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

#app{height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
header.top .left{display:flex;align-items:center;gap:8px;min-width:0}
header.top h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;overflow-y:auto;padding-block:16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));display:flex}
nav.tabs button{flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--soft)}
.seg button{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.wide button{flex:1;padding:8px 10px;font-size:13px}
.seg.wide{display:flex;width:100%}

.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--card)}
.tile .v{font-size:22px;font-weight:600;line-height:1.1;margin-top:4px}
.tile .v small{font-size:13px;font-weight:400;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

.card{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:12px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.card .ic,.ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--fg)}
.ico-svg{display:block}
.bigico{display:grid;place-items:center;width:96px;height:96px;border-radius:24px;background:var(--soft);margin:0 auto;color:var(--fg)}
.howto .hc .fig{color:var(--fg)}
.board .mini .ico-svg{flex:none}
.card .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{font-size:12px;color:var(--muted)}
.card.done{opacity:.55}
.card.done .nm{text-decoration:line-through}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.chk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:var(--accent-fg)}
.chk.on{background:var(--good);border-color:var(--good)}
.chk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 18px;border-radius:var(--r);font-weight:600;width:100%}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.sec{border:1px solid var(--line);background:var(--card)}
.btn.ghost{height:40px;color:var(--accent)}
.btn.danger{color:#d9403c}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{height:36px;padding:0 12px;width:auto;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.t-stretch{color:var(--c-stretch)} .t-warmup{color:var(--c-warmup)} .t-strength{color:var(--c-strength)} .t-cardio{color:var(--c-cardio)} .t-cooldown{color:var(--c-cooldown)}
.b-stretch{background:var(--c-stretch)} .b-warmup{background:var(--c-warmup)} .b-strength{background:var(--c-strength)} .b-cardio{background:var(--c-cardio)} .b-cooldown{background:var(--c-cooldown)}

/* weekly board */
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.board .col{border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px;border:1px solid transparent;min-width:0}
.board .mini{min-width:0;max-width:100%}
.onoff{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--soft)}
.onoff button{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}
.onoff button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ver{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.board .col.sel{border-color:var(--accent);background:var(--accent-soft)}
.board .col.today .d{color:var(--accent)}
.board .wd{font-size:11px;color:var(--muted)} .board .d{font-size:13px;font-weight:600}
.board .mini{width:26px;height:26px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font-size:14px;position:relative}
.board .mini.done::after{content:"";position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:var(--good);border:2px solid var(--bg)}
.board .mini i{position:absolute;left:3px;top:3px;width:5px;height:5px;border-radius:50%}

/* monthly */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.cal .cell{aspect-ratio:1/1.15;border-radius:8px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid transparent}
.cal .cell.other{opacity:.35}
.cal .cell.today{border-color:var(--accent)}
.cal .cell .d{font-size:12px;font-weight:600}
.cal .bars{display:flex;gap:2px;width:100%;justify-content:center}
.cal .bars i{width:5px;height:14px;border-radius:2px;opacity:.35}
.cal .bars i.done{opacity:1}

/* list rows */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.list .li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;min-height:52px}
.list .li:last-child{border-bottom:0}
.list .li .nm{font-weight:600} .list .li .sub{font-size:12px;color:var(--muted)}
.list .li .arrow{color:var(--muted);flex:none}
.step{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.step button{width:40px;height:40px;font-size:18px;color:var(--accent)}
.step .sv{min-width:56px;text-align:center;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}

/* sheets and overlays */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:18px 18px 0 0;max-height:88%;overflow-y:auto;
  padding-block:8px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  animation:up .22s ease-out}
.sheet .grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.full{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.full .bar-top{display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:8px}
.full .body{flex:1;overflow-y:auto;padding-bottom:16px}
.full .foot{padding-block:12px 16px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--fg)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* how-to carousel */
.howto{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.howto::-webkit-scrollbar{display:none}
.howto .hc{flex:0 0 100%;scroll-snap-align:center;border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--card);display:flex;flex-direction:column;gap:10px;min-height:280px}
.howto .hc .fig{height:120px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:48px}
.howto .hc .k{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.howto .hc .cue{font-size:17px;font-weight:600}
.howto .hc .mis{font-size:13px;color:var(--muted)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

/* timer */
.timer{text-align:center;padding:32px 0 16px}
.timer .big{font-size:64px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.ring{width:220px;height:220px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--p,0%),var(--soft) 0)}
.ring>div{width:196px;height:196px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.setrow{display:grid;grid-template-columns:44px 1fr 1fr 44px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.setrow input{text-align:center;padding:8px 6px}
.setrow .n{font-weight:600;color:var(--muted)}
.setrow.done{opacity:.55}
.setrow .cap{text-transform:capitalize}
.restbox{border-radius:var(--r);background:var(--accent-soft);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cond{display:flex;gap:6px}
.cond button{flex:1;height:44px;border-radius:10px;border:1px solid var(--line);font-weight:600}
.cond button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.delta{font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:40}
.icons{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.icons button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);flex:none;background:var(--card);display:grid;place-items:center;color:var(--fg)}
.icons button.on{border-color:var(--accent);background:var(--accent-soft)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}
.statusline{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.board .mini .mn{display:none}
.board .mini{width:30px;height:30px;font-size:15px}
.board .add{width:26px;height:26px;border-radius:7px;border:1px dashed var(--line);color:var(--muted);font-size:16px;display:grid;place-items:center;margin-top:auto}
.board .col{min-height:140px}
.smart{border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;background:var(--accent-soft);display:flex;flex-direction:column;gap:8px}
.smart .k{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.03em;text-transform:uppercase}
@media (prefers-reduced-motion: reduce){ .sheet{animation:none} }

/* tablet and desktop: side navigation, centered content, wider board */
@media (min-width: 820px){
  :root{--nav-w:200px}
  nav.tabs{top:calc(56px + env(safe-area-inset-top,0px));bottom:0;right:auto;width:var(--nav-w);flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:12px 8px;gap:4px}
  nav.tabs button{flex:none;height:44px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 12px;border-radius:10px;font-size:14px}
  nav.tabs button.on{background:var(--accent-soft)}
  header.top{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  main{margin-left:var(--nav-w);padding-block:24px 40px;padding-left:32px;padding-right:32px}
  main > .stack{max-width:960px;margin:0 auto;gap:20px}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .tile .v{font-size:26px}
  .board{gap:8px}
  .board .col{min-height:220px;padding:10px 6px;align-items:stretch;border-color:var(--line)}
  .board .col .wd,.board .col .d{text-align:center}
  .board .mini{width:100%;height:auto;flex-direction:row;display:flex;align-items:center;gap:6px;padding:7px 8px;font-size:13px;border-radius:8px;justify-content:flex-start}
  .board .mini i{position:static;width:6px;height:6px;flex:none}
  .board .mini .mn{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:12px}
  .board .mini.done::after{right:4px;bottom:auto;top:50%;transform:translateY(-50%)}
  .cal .cell{aspect-ratio:auto;min-height:88px;align-items:flex-start;padding:8px}
  .cal .bars{justify-content:flex-start}
  .cal .bars i{width:8px;height:20px}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(520px,92vw);border-radius:18px;max-height:85vh;padding:24px;animation:none}
  .sheet .grip{display:none}
  .full .bar-top,.full .body,.full .foot{width:100%;max-width:600px;margin-left:auto;margin-right:auto}
  .howto{margin:0;padding:0}
  .toast{bottom:24px;left:calc(50% + var(--nav-w) / 2)}
}
</style>

// ---------- dates ----------
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const todayKey=()=>keyOf(new Date());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const startOfWeek=d=>{const x=new Date(d);x.setHours(0,0,0,0);const w=(x.getDay()+6)%7;return addDays(x,-w);};
const locale=()=>S.settings.lang==='ko'?'ko-KR':'en-US';
const fmtMD=d=>new Intl.DateTimeFormat(locale(),{month:'short',day:'numeric'}).format(d);
const fmtLong=d=>new Intl.DateTimeFormat(locale(),{month:'long',day:'numeric',weekday:'short'}).format(d);
const fmtMonth=d=>new Intl.DateTimeFormat(locale(),{year:'numeric',month:'long'}).format(d);
const t=k=>{const L=I18N[S.settings.lang]||I18N.en;return (k in L)?L[k]:(I18N.en[k]??k);};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss=s=>{s=Math.max(0,Math.round(s));return pad(Math.floor(s/60))+':'+pad(s%60);};

function loadLocal(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw){const o=JSON.parse(raw);Object.assign(S,{exercises:o.exercises||[],routines:o.routines||[],settings:Object.assign(S.settings,o.settings||{}),plans:o.plans||{},logs:o.logs||{}});}}catch(e){}
  if(!S.exercises.length)S.exercises=DEFAULT_EXERCISES();
  if(mergeDefaults())saveLocal();
}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({exercises:S.exercises,routines:S.routines,settings:S.settings,plans:S.plans,logs:S.logs}));}catch(e){}}
async function dbWrite(fn){ if(!DB)return; try{await fn();}catch(e){ if(e&&(e.code==='invalid_argument'||e.code==='permission-denied')){S.canWrite=false;renderStatus();} } }
const persist={
  exercises(){saveLocal();dbWrite(()=>DB.doc('app/exercises').set({items:S.exercises}));},
  settings(){saveLocal();dbWrite(()=>DB.doc('app/settings').set(S.settings));},
  routines(){saveLocal();dbWrite(()=>DB.doc('app/routines').set({items:S.routines}));},
  plan(date){saveLocal();const p=S.plans[date];dbWrite(()=>p&&p.items.length?DB.doc('plans/'+date).set({date,items:p.items}):DB.doc('plans/'+date).delete());},
  log(date){saveLocal();const l=S.logs[date];dbWrite(()=>l&&l.entries.length?DB.doc('logs/'+date).set({date,entries:l.entries}):DB.doc('logs/'+date).delete());}
};
let UNSUBS=[];
function subscribeAll(){ UNSUBS.forEach(u=>{try{u();}catch(e){}}); UNSUBS=[]; const db=DB; if(!db)return;
  UNSUBS.push(db.doc('app/exercises').onSnapshot(snap=>{
    if(snap.exists){S.exercises=(snap.data().items||[]).map(x=>Object.assign({},x)); if(mergeDefaults()&&S.canWrite&&!snap.metadata.hasPendingWrites)dbWrite(()=>DB.doc('app/exercises').set({items:S.exercises}));}
    else if(S.canWrite){ dbWrite(()=>DB.doc('app/exercises').set({items:S.exercises})); }
    saveLocal();render();
  },()=>{}));
  UNSUBS.push(db.doc('app/settings').onSnapshot(snap=>{
    if(snap.exists){S.settings=Object.assign({},S.settings,snap.data());}
    else if(S.canWrite){ dbWrite(()=>DB.doc('app/settings').set(S.settings)); }
    saveLocal();render();
  },()=>{}));
  UNSUBS.push(db.doc('app/routines').onSnapshot(snap=>{ if(snap.exists){S.routines=(snap.data().items||[]).map(x=>Object.assign({},x));saveLocal();render();} },()=>{}));
  UNSUBS.push(db.collection('plans').onSnapshot(q=>{const o={};q.docs.forEach(d=>{const b=d.data();o[d.id]={items:(b.items||[]).map(x=>Object.assign({},x))};});S.plans=o;saveLocal();render();},()=>{}));
  UNSUBS.push(db.collection('logs').onSnapshot(q=>{const o={};q.docs.forEach(d=>{const b=d.data();o[d.id]={entries:(b.entries||[]).map(x=>Object.assign({},x))};});S.logs=o;saveLocal();render();},()=>{}));
  renderStatus();
  setTimeout(()=>makeBackup(false),6000);
}

const FB={auth:null,fs:null,user:null,configured:false};
function firebaseReady(){ const c=window.FIREBASE_CONFIG; return !!(window.firebase&&c&&c.apiKey&&!/PASTE/.test(String(c.apiKey))); }
function makeFirestoreDB(uid){ const fs=FB.fs,pre='users/'+uid+'/'; return {doc:p=>fs.doc(pre+p),collection:p=>fs.collection(pre+p)}; }
async function connectFirebase(){ if(!firebaseReady())return false; FB.configured=true;
  try{ if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG); FB.auth=firebase.auth(); FB.fs=firebase.firestore();
    try{ await FB.fs.enablePersistence({synchronizeTabs:true}); }catch(e){}
    try{ await FB.auth.getRedirectResult(); }catch(e){}
    await new Promise(res=>{ let first=true; FB.auth.onAuthStateChanged(u=>{ FB.user=u;
      if(u){ DB=makeFirestoreDB(u.uid); S.backend='firebase'; S.canWrite=true; hideLogin(); subscribeAll(); }
      else { UNSUBS.forEach(x=>{try{x();}catch(e){}}); UNSUBS=[]; DB=null; S.backend='local'; if(!S.localOnly)showLogin(); }
      renderStatus(); if(first){first=false;res();} }); });
    return true; }catch(e){ return false; } }
async function signIn(){ if(!FB.auth)return; const prov=new firebase.auth.GoogleAuthProvider(); try{ await FB.auth.signInWithPopup(prov); }catch(e){ if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'||e.code==='auth/cancelled-popup-request')){ try{await FB.auth.signInWithRedirect(prov);}catch(e2){toast(String(e2.code||e2.message||e2));} } else if(e&&e.code!=='auth/popup-closed-by-user'){ toast(String(e.code||e.message||e)); } } }
async function signOut(){ if(FB.auth){ try{await FB.auth.signOut();}catch(e){} } S.localOnly=false; }

function smartDays(ws,n){ if(S.settings.smartAlternate!==false&&n<=4){ let start=0; if(planOf(keyOf(addDays(ws,-1))).length)start=1; const days=[]; for(let d=start;d<7&&days.length<n;d+=2)days.push(d); if(days.length===n)return {days,alt:true}; if(start===1){const d2=[];for(let d=0;d<7&&d2.length<n;d+=2)d2.push(d); if(d2.length===n)return {days:d2,alt:true};} }
  return {days:DEFAULT_WD[n],alt:false}; }
const SPLIT_ROUTINE={full:'rt_full3',ul:'rt_ul',ppl:'rt_ppl',home:'rt_home',db:'rt_db'};
function smartPlan(ws){ const n=Math.min(7,Math.max(1,S.settings.weeklyGoal||3)); const dd=smartDays(ws,n); const wd=dd.days;
  const since=keyOf(addDays(new Date(),-28)); const hist=Object.keys(S.logs).filter(k=>k>=since).flatMap(k=>logOf(k)); const used=new Set(hist.map(e=>e.exId));
  const cands=allRoutines(); let routine,starter=!used.size; const split=S.settings.smartSplit||'auto';
  if(split!=='auto'&&SPLIT_ROUTINE[split]) routine=cands.find(r=>r.id===SPLIT_ROUTINE[split]);
  else if(used.size){ const best=cands.map(r=>({r,score:r.days.flatMap(d=>d.exIds).filter(id=>used.has(id)).length})).sort((a,b)=>b.score-a.score)[0]; routine=best.score>0?best.r:null; }
  if(!routine) routine=cands.find(r=>r.id===(n<=3?'rt_full3':n===4?'rt_ul':'rt_ppl'))||cands[0];
  const prog=S.settings.smartProgress!==false; const step=S.settings.weightStep||(S.settings.unit==='lb'?5:2.5);
  const changes=[]; const plan={};
  for(let i=0;i<n;i++){ const d=routine.days[i%routine.days.length]; const date=keyOf(addDays(ws,wd[i])); plan[date]=plan[date]||[];
    d.exIds.forEach(id=>{ const ex=exById(id); if(!ex||ex.hidden)return; const it={id:uid(),exId:ex.id,mode:ex.mode,minutes:ex.minutes,sets:ex.sets,reps:ex.reps,weight:ex.weight,rest:ex.rest??S.settings.restSec,status:'planned'};
      const last=prog?lastEntry(ex.id):null; if(last&&!plan[date].some(x=>x.exId===ex.id)){
        if(last.mode==='sets'&&it.mode==='sets'){ const done=last.sets.filter(x=>x.done); if(done.length&&done.length>=last.sets.length){ const w=Math.max(...done.map(x=>x.weight||0)); const r=Math.round(done.reduce((a,x)=>a+x.reps,0)/done.length);
            if(w>0){ it.weight=Math.round((w+step)*10)/10; it.reps=r; changes.push(exName(ex)+' +'+step+S.settings.unit); } else if(r<20){ it.reps=r+1; changes.push(exName(ex)+' +1 '+t('reps')); } else it.reps=r; } }
        else if(last.mode==='time'&&it.mode==='time'){ if(last.duration>=it.minutes*60*0.9&&it.minutes<ex.minutes*2){ it.minutes=Math.min(ex.minutes*2,(last.duration>=it.minutes*60?it.minutes+1:it.minutes)); if(it.minutes>ex.minutes)changes.push(exName(ex)+' +1 '+t('min')); } } }
      plan[date].push(it); }); }

async function makeBackup(force){ if(!DB||!S.canWrite)return false; const k=todayKey();
  try{ if(!force){ const snap=await DB.doc('backups/'+k).get(); if(snap.exists)return false; }
    await DB.doc('backups/'+k).set({kind:'data',date:k,at:Date.now(),settings:S.settings,routines:S.routines,plans:S.plans,logs:S.logs,planDays:Object.keys(S.plans).length,logDays:Object.keys(S.logs).length});
    await DB.doc('backups/'+k+'-lib').set({kind:'lib',date:k,exercises:S.exercises});
    const cutoff=keyOf(addDays(new Date(),-14)); const old=await DB.collection('backups').where('date','<',cutoff).get();
    for(const d of old.docs){ try{await DB.doc('backups/'+d.id).delete();}catch(e){} }
    return true; }catch(e){ return false; } }
async function openBackups(){ showSheet(`<h2 style="margin-bottom:4px">${esc(t('backups'))}</h2><div class="cap" style="margin-bottom:12px">${esc(t('auto_backup_note'))}</div><div id="bklist"><div class="empty">…</div></div>${DB&&S.canWrite?`<button class="btn sec" style="margin-top:12px" id="bknow">${esc(t('backup_now'))}</button>`:''}`);
  $('#bknow')?.addEventListener('click',async()=>{ const ok=await makeBackup(true); toast(ok?t('backed_up'):t('local_only')); fill(); });
  async function fill(){ if(!DB){$('#bklist').innerHTML=`<div class="empty">${esc(t('local_only'))}</div>`;return;}
    let docs=[]; try{ const q=await DB.collection('backups').where('kind','==','data').get(); docs=q.docs.slice().sort((a,b)=>(b.data().date||'').localeCompare(a.data().date||'')).slice(0,30); }catch(e){}
    if(!docs.length){$('#bklist').innerHTML=`<div class="empty">${esc(t('no_backups'))}</div>`;return;}
    $('#bklist').innerHTML=`<div class="list">${docs.map(d=>{const b=d.data();return `<button class="li" data-bk="${d.id}"><span class="grow"><div class="nm num">${esc(b.date)}</div><div class="sub">${b.planDays??0} ${esc(t('planned'))} · ${b.logDays??0} ${esc(t('workout_days'))}</div></span><span class="cap">${esc(t('restore'))}</span></button>`;}).join('')}</div>`;
    $('#bklist').querySelectorAll('[data-bk]').forEach(b=>b.addEventListener('click',()=>confirmSheet(t('confirm_restore'),t('restore'),()=>restoreBackup(b.dataset.bk),true))); }
  fill(); }
async function restoreBackup(id){ try{ const d=await DB.doc('backups/'+id).get(); const l=await DB.doc('backups/'+id+'-lib').get(); if(!d.exists)return; const b=d.data();
    const oldPlans=Object.keys(S.plans), oldLogs=Object.keys(S.logs);
    S.settings=Object.assign({},S.settings,b.settings||{}); S.routines=(b.routines||[]).map(x=>Object.assign({},x)); S.plans=JSON.parse(JSON.stringify(b.plans||{})); S.logs=JSON.parse(JSON.stringify(b.logs||{}));
    if(l.exists&&Array.isArray(l.data().exercises)){S.exercises=l.data().exercises.map(x=>Object.assign({},x));mergeDefaults();}
    persist.settings();persist.routines();persist.exercises(); new Set([...oldPlans,...Object.keys(S.plans)]).forEach(k=>persist.plan(k)); new Set([...oldLogs,...Object.keys(S.logs)]).forEach(k=>persist.log(k));
    toast(t('restored')); render(); }catch(e){ toast(t('import_fail')); } }

   <div class="tiles">${e.mode==='time'?num('minutes',t('minutes'),1,t('min')):num('sets',t('sets'),1,'')+num('reps',t('reps'),1,'')+num('weight',t('weight'),2.5,S.settings.unit)+num('rest',t('rest'),15,t('sec'))}</div>

   ${e.id?(e.builtin?`<div class="cap" style="text-align:center">${esc(t('hide_builtin'))}</div><button class="btn sec" data-act="toggle-hide">${esc(e.hidden?t('unhide'):t('hide'))}</button>`:`<button class="btn ghost danger" data-act="del-ex">${esc(t('delete_exercise'))}</button>`):''}
  </div>`;
  view.querySelectorAll('[data-f]').forEach(inp=>inp.addEventListener('input',ev=>{ const path=ev.target.dataset.f.split('.'); let o=e; for(let i=0;i<path.length-1;i++)o=o[path[i]]; o[path[path.length-1]]=ev.target.value; S.editDirty=true; }));
}
function saveExercise(){ const e=S.editEx; if(!e.nameEn.trim()&&!e.nameKo.trim()){toast(t('name_en'));return;} if(!e.nameEn.trim())e.nameEn=e.nameKo; if(!e.nameKo.trim())e.nameKo=e.nameEn;
  e.steps=e.steps.map(s=>({titleEn:s.titleEn||s.titleKo,titleKo:s.titleKo||s.titleEn,cueEn:s.cueEn||s.cueKo,cueKo:s.cueKo||s.cueEn,mistakeEn:s.mistakeEn||s.mistakeKo||'',mistakeKo:s.mistakeKo||s.mistakeEn||''}));
  if(e.id){const i=S.exercises.findIndex(x=>x.id===e.id);S.exercises[i]=e;}else{e.id='ex_'+uid();S.exercises.push(e);}
  persist.exercises(); S.editDirty=false; S.sub='library'; toast(t('saved')); render(); }

function showSheet(html){ closeSheet(); $('#layer').innerHTML=`<div class="backdrop" data-act="close-sheet"></div><div class="sheet" id="sheet" role="dialog"><div class="grip"></div>${html}</div>`; }
function closeSheet(){ $('#layer').innerHTML=''; }
function confirmSheet(msg,okLabel,onOk,danger){ showSheet(`<p style="margin:4px 0 16px;font-weight:600">${esc(msg)}</p><div class="stack" style="gap:8px"><button class="btn ${danger?'sec danger':'pri'}" id="ok">${esc(okLabel)}</button><button class="btn ghost" data-act="close-sheet">${esc(t('cancel'))}</button></div>`); $('#ok').addEventListener('click',()=>{closeSheet();onOk();}); }

// ---------- Perform flow ----------
const P={active:false,queue:[],idx:0,stage:'prepare',timer:null};
function startQueue(q){ if(!q.length)return; Object.assign(P,{active:true,queue:q,idx:0}); enterPrepare(); }
function curItem(){ const q=P.queue[P.idx]; const it=planOf(q.date).find(x=>x.id===q.id); return {date:q.date,it,ex:it?exById(it.exId):null}; }
function enterPrepare(){ stopTimers(); P.stage='prepare'; P.howtoIdx=0; renderPerform(); }
function enterHowto(){ P.stage='howto'; renderPerform(); }
function enterPerform(){ const {it,ex,date}=curItem(); stopTimers(); P.stage='perform'; P.startedAt=Date.now(); P.paused=false; P.memo='';
  if(it.mode==='time'){ P.remaining=it.minutes*60; P.total=P.remaining; P.timer=setInterval(tick,1000); }
  else { const last=lastEntry(it.exId,date); P.sets=[]; for(let i=0;i<it.sets;i++){ const ls=last&&last.mode==='sets'&&last.sets[i]&&last.sets[i].done?last.sets[i]:null; P.sets.push({reps:ls?ls.reps:it.reps,weight:ls?ls.weight:it.weight,done:false}); } P.restRemaining=0; }
  renderPerform(); }
function tick(){ if(P.paused)return; P.remaining--; const el=$('#big'); if(el){el.textContent=mmss(P.remaining);} const r=$('#ring'); if(r)r.style.setProperty('--p',(100-P.remaining/P.total*100)+'%'); if(P.remaining<=0){ stopTimers(); finishPerform(); } }
function restTick(){ P.restRemaining--; const el=$('#restt'); if(el)el.textContent=mmss(P.restRemaining); if(P.restRemaining<=0){ clearInterval(P.restTimer);P.restTimer=null; const box=$('#restbox'); if(box)box.hidden=true; } }
function stopTimers(){ if(P.timer){clearInterval(P.timer);P.timer=null;} if(P.restTimer){clearInterval(P.restTimer);P.restTimer=null;} }
function finishPerform(){ const {it,date}=curItem(); stopTimers(); const dur=Math.round((Date.now()-P.startedAt)/1000);
  P.result={id:uid(),planItemId:it.id,exId:it.exId,mode:it.mode,startedAt:P.startedAt,endedAt:Date.now(),duration:it.mode==='time'?Math.min(dur,it.minutes*60+600):dur,sets:it.mode==='sets'?P.sets.map(s=>Object.assign({},s)):[],memo:P.memo||'',condition:0};
  P.prev=lastEntry(it.exId,date); P.stage='complete'; renderPerform(); }
function commitResult(){ const {it,date}=curItem(); const r=P.result; S.logs[date]=S.logs[date]||{entries:[]}; S.logs[date].entries=S.logs[date].entries.filter(e=>e.planItemId!==it.id); S.logs[date].entries.push(r); it.status='done'; persist.plan(date); persist.log(date); }
function skipItem(){ const {it,date}=curItem(); it.status='skipped'; persist.plan(date); nextItem(); }
function nextItem(){ stopTimers(); P.idx++; if(P.idx>=P.queue.length){ P.active=false; $('#perf')?.remove(); render(); } else enterPrepare(); }
function exitPerform(){ stopTimers(); P.active=false; $('#perf')?.remove(); render(); }
function renderPerform(keep){
  if(keep&&$('#perf'))return;
  const c=curItem(); if(!c.it||!c.ex){exitPerform();return;} const {it,ex,date}=c; const ko=S.settings.lang==='ko';
  const n=P.queue.length>1?`<span class="cap num">${P.idx+1} / ${P.queue.length}</span>`:'<span></span>';
  let body='',foot='';
  if(P.stage==='prepare'){ const last=lastEntry(ex.id,date);
    body=`<div class="stack" style="padding-top:8px"><div style="text-align:center"><div class="bigico">${iconSvg(ex.icon,64)}</div><h1 style="margin-top:8px">${esc(exName(ex))}</h1><div class="cap" style="margin-top:4px"><span class="dot b-${ex.type}"></span> ${esc(typeName(ex.type))}</div></div>
      <div class="tiles"><div class="tile"><div class="cap">${esc(t('target'))}</div><div class="v num" style="font-size:18px">${esc(targetText(it))}</div></div><div class="tile"><div class="cap">${esc(t('last'))}</div><div class="v num" style="font-size:18px">${esc(entrySummary(last))}</div></div></div>
      <button class="btn sec" data-p="howto">${esc(t('view_howto'))}</button></div>`;
    foot=`<button class="btn pri" data-p="start">${esc(t('start'))}</button><button class="btn ghost" data-p="skip">${esc(t('skip'))}</button>`; }
  else if(P.stage==='howto'){ const steps=ex.steps||[];
    body=`<h2 style="margin:4px 0 12px">${esc(exName(ex))}</h2><div class="howto" id="howto">${steps.map((s,i)=>`<div class="hc"><div class="fig">${iconSvg(ex.icon,56)}</div><div class="k">${esc(t('step'))} ${i+1} · ${esc(ko?(s.titleKo||s.titleEn):(s.titleEn||s.titleKo))}</div><div class="cue">${esc(ko?(s.cueKo||s.cueEn):(s.cueEn||s.cueKo))}</div>${(ko?s.mistakeKo:s.mistakeEn)?`<div class="mis">✕ ${esc(ko?s.mistakeKo:s.mistakeEn)}</div>`:''}</div>`).join('')||`<div class="empty grow">—</div>`}</div><div class="dots" id="dots">${steps.map((s,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>`;
    foot=`<button class="btn pri" data-p="start">${esc(t('begin'))}</button>`; }
  else if(P.stage==='perform'){
    if(it.mode==='time'){ body=`<div class="timer"><div class="cap" style="margin-bottom:16px">${esc(exName(ex))} · ${it.minutes} ${esc(t('min'))}</div><div class="ring" id="ring" style="--p:${(100-P.remaining/P.total*100)}%"><div><div class="big num" id="big">${mmss(P.remaining)}</div></div></div></div>
        <div class="row" style="gap:8px"><button class="btn sec" data-p="pause" id="pausebtn">${esc(P.paused?t('resume'):t('pause'))}</button><button class="btn sec" data-p="plus30">${esc(t('plus30'))}</button></div>
        <div class="field" style="margin-top:16px"><label>${esc(t('memo'))}</label><textarea id="memo" rows="2">${esc(P.memo)}</textarea></div>`;
      foot=`<button class="btn pri" data-p="finish">${esc(t('done'))}</button>`; }
    else { body=`<div class="cap" style="margin-bottom:8px">${esc(exName(ex))} · ${esc(targetText(it))}</div>
        <div class="restbox" id="restbox" ${P.restRemaining>0?'':'hidden'}><span>${esc(t('rest'))} <b class="num" id="restt">${mmss(P.restRemaining)}</b></span><button class="btn sm sec" data-p="skiprest">${esc(t('skip_rest'))}</button></div>
        <div class="setrow" style="border:0;padding-bottom:0"><span class="cap">${esc(t('set_n'))}</span><span class="cap" style="text-align:center">${esc(t('reps'))}</span><span class="cap" style="text-align:center">${esc(t('weight'))} (${esc(S.settings.unit)})</span><span></span></div>
        ${P.sets.map((s,i)=>`<div class="setrow ${s.done?'done':''}"><span class="n num">${i+1}</span><input type="number" inputmode="decimal" data-set="${i}" data-k="reps" value="${s.reps}"><input type="number" inputmode="decimal" step="0.5" data-set="${i}" data-k="weight" value="${s.weight}"><button class="chk ${s.done?'on':''}" data-p="setdone" data-i="${i}" aria-label="done">${ICO.check}</button></div>`).join('')}
        <div class="field" style="margin-top:16px"><label>${esc(t('memo'))}</label><textarea id="memo" rows="2">${esc(P.memo)}</textarea></div>`;
      foot=`<button class="btn pri" data-p="finish">${esc(t('finish'))}</button>`; } }
  else if(P.stage==='complete'){ const r=P.result; const prevS=entryScore(P.prev), curS=entryScore(r); let delta='';
    if(prevS!=null&&curS!=null){ const d=curS-prevS; const cls=d>0?'up':d<0?'down':''; delta=`<span class="delta ${cls}">${d>0?'↑':d<0?'↓':'='} ${r.mode==='time'?mmss(Math.abs(d)):Math.abs(Math.round(d*10)/10)}</span> <span class="cap">${esc(t('vs_last'))} ${esc(entrySummary(P.prev))}</span>`; }
    const doneSets=r.sets.filter(s=>s.done);
    body=`<div class="stack" style="padding-top:8px"><div style="text-align:center"><div class="bigico" style="color:var(--good)"><svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg></div><h1>${esc(exName(ex))}</h1><div class="cap">${esc(t('complete'))}</div></div>
      <div class="tiles"><div class="tile"><div class="cap">${esc(t('duration'))}</div><div class="v num">${mmss(r.duration)}</div></div>
      <div class="tile"><div class="cap">${esc(r.mode==='time'?t('target'):t('volume'))}</div><div class="v num" style="font-size:18px">${esc(r.mode==='time'?it.minutes+' '+t('min'):entrySummary(r))}</div></div></div>
      ${delta?`<div style="text-align:center">${delta}</div>`:''}
      ${r.mode==='sets'?`<div class="cap" style="text-align:center">${doneSets.length} / ${r.sets.length} ${esc(t('total_sets'))}</div>`:''}
      <div class="field"><label>${esc(t('condition'))}</label><div class="cond" id="cond">${[1,2,3,4,5].map(v=>`<button data-c="${v}" class="${r.condition===v?'on':''}">${v}</button>`).join('')}</div></div></div>`;
    foot=`<button class="btn pri" data-p="next">${esc(P.idx+1<P.queue.length?t('next_ex'):t('finish'))}</button>`; }
  let el=$('#perf'); if(!el){el=document.createElement('div');el.className='full';el.id='perf';document.body.appendChild(el);el.addEventListener('click',onPerfClick);el.addEventListener('input',onPerfInput);el.addEventListener('scroll',onHowtoScroll,true);}
  el.innerHTML=`<div class="bar-top"><button class="icon-btn" data-p="exit" aria-label="close">${ICO.close}</button>${n}<span style="width:40px"></span></div><div class="body">${body}</div><div class="foot">${foot}</div>`;
}
function onHowtoScroll(e){ if(e.target.id!=='howto')return; const h=e.target; const i=Math.round(h.scrollLeft/(h.clientWidth+12)); h.parentElement.querySelectorAll('#dots i').forEach((d,j)=>d.classList.toggle('on',j===i)); }
function onPerfInput(e){ const x=e.target; if(x.id==='memo'){P.memo=x.value;return;} if(x.dataset.set!=null){const s=P.sets[+x.dataset.set]; s[x.dataset.k]=Number(x.value)||0;} }
function onPerfClick(e){ const b=e.target.closest('[data-p],[data-c]'); if(!b)return;
  if(b.dataset.c){ P.result.condition=+b.dataset.c; $('#cond').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); return; }
  const a=b.dataset.p; const {it}=curItem();
  if(a==='exit')exitPerform(); else if(a==='howto')enterHowto(); else if(a==='start')enterPerform(); else if(a==='skip')skipItem();
  else if(a==='pause'){P.paused=!P.paused;b.textContent=P.paused?t('resume'):t('pause');}
  else if(a==='plus30'){P.remaining+=30;P.total+=30;$('#big').textContent=mmss(P.remaining);}
  else if(a==='setdone'){ const i=+b.dataset.i; const s=P.sets[i]; s.done=!s.done; if(s.done&&it.rest>0&&i<P.sets.length-1){ P.restRemaining=it.rest; if(P.restTimer)clearInterval(P.restTimer); P.restTimer=setInterval(restTick,1000); } const memo=P.memo; renderPerform(); if(memo!==undefined)P.memo=memo; }
  else if(a==='skiprest'){ P.restRemaining=0; if(P.restTimer){clearInterval(P.restTimer);P.restTimer=null;} $('#restbox').hidden=true; }
  else if(a==='finish')finishPerform();
  else if(a==='next'){ commitResult(); nextItem(); } }

// ---------- global events ----------
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;S.tab=b.dataset.tab;S.sub=null;render();view.scrollTop=0;});
$('#lang').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;S.settings.lang=b.dataset.l;persist.settings();render();});
$('#layer').addEventListener('click',e=>{ const a=e.target.closest('[data-act]'); if(!a)return; if(a.dataset.act==='close-sheet'&&e.target===a)closeSheet(); if(a.dataset.act==='go-day'){S.tab='week';S.selDay=a.dataset.k;S.weekStart=keyOf(startOfWeek(parseKey(a.dataset.k)));closeSheet();render();} });
view.addEventListener('click',e=>{
  const st=e.target.closest('[data-st]'); if(st&&S.sub==='edit'){const k=st.dataset.st,d=Number(st.dataset.d);const ex=S.editEx;ex[k]=Math.max(k==='weight'||k==='rest'?0:1,Math.round((ex[k]+d)*10)/10);S.editDirty=true;$('#sv-'+k).textContent=ex[k]+(k==='minutes'?' '+t('min'):k==='weight'?' '+S.settings.unit:k==='rest'?' '+t('sec'):'');return;}
  const ss=e.target.closest('[data-set]'); if(ss&&S.tab==='settings'&&!S.sub){const k=ss.dataset.set;S.settings[k]=Math.max(k==='restSec'?0:1,S.settings[k]+Number(ss.dataset.d));persist.settings();render();return;}
  const so=e.target.closest('[data-sset]'); if(so){S.settings[so.dataset.sset]=so.dataset.v==='1';persist.settings();S.smartInfo=null;render();return;}
  const sp=e.target.closest('[data-split]'); if(sp){S.settings.smartSplit=sp.dataset.split;persist.settings();S.smartInfo=null;render();return;}
  const wsb=e.target.closest('[data-wstep]'); if(wsb){S.settings.weightStep=Number(wsb.dataset.wstep);persist.settings();S.smartInfo=null;render();return;}
  const lg=e.target.closest('[data-lang]'); if(lg){S.settings.lang=lg.dataset.lang;persist.settings();render();return;}
  const un=e.target.closest('[data-unit]'); if(un){S.settings.unit=un.dataset.unit;persist.settings();render();return;}
  const ic=e.target.closest('[data-icon]'); if(ic&&S.sub==='edit'){S.editEx.icon=ic.dataset.icon;S.editDirty=true;view.querySelectorAll('[data-icon]').forEach(x=>x.classList.toggle('on',x===ic));return;}
  const ty=e.target.closest('[data-type]'); if(ty&&S.sub==='edit'){S.editEx.type=ty.dataset.type;S.editDirty=true;view.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('on',x===ty));return;}
  const ms=e.target.closest('[data-mode-set]'); if(ms){S.settings.mode=ms.dataset.modeSet;persist.settings();S.smartInfo=null;render();return;}
  const md=e.target.closest('[data-mode]'); if(md&&S.sub==='edit'){S.editEx.mode=md.dataset.mode;S.editDirty=true;renderEdit();return;}
  const mu=e.target.closest('[data-muscle]'); if(mu&&S.sub==='edit'){S.editEx.muscle=mu.dataset.muscle;S.editDirty=true;view.querySelectorAll('[data-muscle]').forEach(x=>x.classList.toggle('on',x===mu));return;}
  const eq=e.target.closest('[data-equip]'); if(eq&&S.sub==='edit'){S.editEx.equip=eq.dataset.equip;S.editDirty=true;view.querySelectorAll('[data-equip]').forEach(x=>x.classList.toggle('on',x===eq));return;}
  const fl=e.target.closest('[data-filter]'); if(fl){S.libFilter=fl.dataset.filter;renderLibrary();return;}
  const mf=e.target.closest('[data-mfilter]'); if(mf){S.libMuscle=mf.dataset.mfilter;renderLibrary();return;}
  const ef=e.target.closest('[data-efilter]'); if(ef){S.libEquip=ef.dataset.efilter;renderLibrary();return;}
  const a=e.target.closest('[data-act]'); if(!a)return; const act=a.dataset.act;
  switch(act){
    case 'go-week': S.tab='week'; S.selDay=todayKey(); S.weekStart=keyOf(startOfWeek(new Date())); render(); break;
    case 'start-today': { const d=todayKey(); startQueue(planOf(d).filter(i=>i.status==='planned').map(i=>({date:d,id:i.id}))); break; }
    case 'open-item': { const d=todayKey(); const it=planOf(d).find(x=>x.id===a.dataset.id); if(it&&it.status==='done'){openItemEditor(d,it.id);} else startQueue([{date:d,id:a.dataset.id}]); break; }
    case 'add-day': S.selDay=a.dataset.k; openPicker(a.dataset.k); break;
    case 'smart-apply': applySmart(); break;
    case 'smart-regen': confirmSheet(t('confirm_regen'),t('regenerate'),()=>applySmart(),true); break;
    case 'week-prev': S.weekStart=keyOf(addDays(parseKey(S.weekStart),-7)); S.selDay=S.weekStart; S.smartInfo=null; render(); break;
    case 'week-next': S.weekStart=keyOf(addDays(parseKey(S.weekStart),7)); S.selDay=S.weekStart; S.smartInfo=null; render(); break;
    case 'copy-week': copyLastWeek(); break;
    case 'open-routines': openRoutineList(); break;
    case 'backups': openBackups(); break;
    case 'changelog': openChangelog(); break;
    case 'sign-in': signIn(); break;
    case 'sign-out': signOut().then(()=>render()); break;
    case 'save-routine': saveWeekAsRoutine(); break;
    case 'pick-ex': openPicker(S.selDay); break;
    case 'edit-item': openItemEditor(a.dataset.k||S.selDay,a.dataset.id); break;
    case 'month-prev': { const m=parseKey(S.month); S.month=keyOf(new Date(m.getFullYear(),m.getMonth()-1,1)); render(); break; }
    case 'month-next': { const m=parseKey(S.month); S.month=keyOf(new Date(m.getFullYear(),m.getMonth()+1,1)); render(); break; }
    case 'day-detail': openDayDetail(a.dataset.k); break;
    case 'open-lib': S.sub='library'; render(); break;
    case 'back': S.sub=null; render(); break;
    case 'new-ex': S.editEx=blankExercise(); S.editDirty=false; S.sub='edit'; render(); break;
    case 'edit-ex': S.editEx=JSON.parse(JSON.stringify(exById(a.dataset.id))); S.editDirty=false; S.sub='edit'; render(); break;
    case 'back-edit': if(S.editDirty){confirmSheet(t('discard'),t('discard_btn'),()=>{S.sub='library';render();},true);} else {S.sub='library';render();} break;
    case 'save-ex': saveExercise(); break;
    case 'add-step': S.editEx.steps.push({titleEn:'',titleKo:'',cueEn:'',cueKo:'',mistakeEn:'',mistakeKo:''}); renderEdit(); break;
    case 'rm-step': S.editEx.steps.pop(); renderEdit(); break;
    case 'toggle-hide': S.editEx.hidden=!S.editEx.hidden; saveExercise(); break;
    case 'del-ex': confirmSheet(t('confirm_delete_ex'),t('delete'),()=>{S.exercises=S.exercises.filter(x=>x.id!==S.editEx.id);persist.exercises();S.sub='library';render();},true); break;
    case 'export': { const json=JSON.stringify({exercises:S.exercises,settings:S.settings,plans:S.plans,logs:S.logs},null,1); showSheet(`<h2 style="margin-bottom:10px">${esc(t('export'))}</h2><textarea id="exp" rows="8" readonly>${esc(json)}</textarea><button class="btn pri" style="margin-top:10px" id="cp">${esc(t('copy'))}</button>`);
      $('#cp').addEventListener('click',()=>{navigator.clipboard.writeText(json).then(()=>toast(t('copied'))).catch(()=>{$('#exp').select();});}); break; }
    case 'import': { showSheet(`<h2 style="margin-bottom:10px">${esc(t('import'))}</h2><textarea id="imp" rows="8" placeholder="{...}"></textarea><button class="btn pri" style="margin-top:10px" id="ib">${esc(t('import_btn'))}</button>`);
      $('#ib').addEventListener('click',()=>{ try{ const o=JSON.parse($('#imp').value); if(!o||typeof o!=='object')throw 0; if(Array.isArray(o.exercises))S.exercises=o.exercises; if(o.settings)S.settings=Object.assign(S.settings,o.settings); if(o.plans)S.plans=o.plans; if(o.logs)S.logs=o.logs; persist.exercises();persist.settings();Object.keys(S.plans).forEach(k=>persist.plan(k));Object.keys(S.logs).forEach(k=>persist.log(k)); closeSheet(); toast(t('imported')); render(); }catch(err){ toast(t('import_fail')); } }); break; }
    case 'reset': confirmSheet(t('confirm_reset'),t('delete'),()=>{ const pk=Object.keys(S.plans),lk=Object.keys(S.logs); S.plans={};S.logs={}; S.exercises=DEFAULT_EXERCISES(); pk.forEach(k=>persist.plan(k)); lk.forEach(k=>persist.log(k)); persist.exercises(); render(); },true); break;
  }
});

// ---------- boot ----------
loadLocal(); render(); connectDb(); checkWhatsNew();
})();
</script>
