<script>document.getElementById('fc').textContent=FIG_CSS; const q=new URLSearchParams(location.search); const ids=(q.get('ids')||'').split(','); const exs=DEFAULT_EXERCISES();
ids.forEach(id=>{const ex=exs.find(e=>e.id===id); if(!ex){document.body.insertAdjacentHTML('beforeend','<div class="c"><b>MISSING '+id+'</b></div>');return;} const F=figFrames(ex); const fit=figFitBox(F.frames,{}); document.body.insertAdjacentHTML('beforeend','<div class="c"><b>'+id+'</b>'+F.frames.map(f=>figFrameSvg(f,150,{muscle:ex.muscle,fit})).join('')+'</div>');});</script></body></html>
