# E2E — PR과 main 푸시마다: 소스에서 빌드해 커밋된 산출물과 같은지 확인 → Playwright 스위트(tests/suites) → 정적 서버에서 스모크(tests/smoke.cjs).
name: E2E smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Build from sources and check committed outputs are current
        run: |
          tools/build.sh
          git diff --exit-code -- index.html artifact.html src/app.html
      - name: Run Playwright suites (tests/suites)
        run: tools/run-suites.sh
      - name: Serve the app
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/index.html >/dev/null && break; sleep 1; done
      - name: Run smoke test
        run: node tests/smoke.cjs
        env:
          APP_URL: http://127.0.0.1:8080/
          SHOT_DIR: e2e-out
      - name: Run 8-week persona simulation
        run: node tests/persona.cjs
        env:
          HARNESS: http://127.0.0.1:8080/build/test.html
          SHOT_DIR: e2e-out
      - name: Run persona 2 simulation (smart mode, lb, Korean)
        run: node tests/persona2.cjs
        env:
          HARNESS: http://127.0.0.1:8080/build/test.html
          SHOT_DIR: e2e-out
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            e2e-out
            build/shots
          if-no-files-found: ignore
