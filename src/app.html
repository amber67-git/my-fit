<title>My Fit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: one-screen app. Sticky header, scrolling main, fixed bottom tab bar. White, one accent, five soft type colors. */
:root{
  --bg:#ffffff; --fg:#141516; --muted:#8a8d93; --line:#ebecee; --soft:#f5f6f8; --card:#ffffff;
  --accent:#2f6bff; --accent-fg:#ffffff; --accent-soft:#e9efff;
  --good:#1f9d6a; --warn:#d9822b; --hl:#e5484d; --equip:#55585e;
  --bm-rest:#d9dde3; --bm-decor:#e8ebef; --bm-hair:#b8bfc9;
  --c-stretch:#2fb8a6; --c-warmup:#f2a93b; --c-strength:#2f6bff; --c-cardio:#f26b5b; --c-cooldown:#8b6cf2;
  --font:"IBM Plex Sans KR","Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --r:12px; --nav-h:58px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111214; --fg:#f1f2f4; --muted:#8f9298; --line:#27292d; --soft:#1b1d21; --card:#17191c; --accent:#5b8bff; --accent-soft:#1d2a4d; --equip:#9a9da3; --pri:#2f6bff; --bm-rest:#3b3f47; --bm-decor:#2a2d33; --bm-hair:#4b505a; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#111214; --fg:#f1f2f4; --muted:#8f9298; --line:#27292d; --soft:#1b1d21; --card:#17191c; --accent:#5b8bff; --accent-soft:#1d2a4d; --equip:#9a9da3; --pri:#2f6bff; --bm-rest:#3b3f47; --bm-decor:#2a2d33; --bm-hair:#4b505a; color-scheme:dark; }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:24px} h2{font-size:17px} h3{font-size:15px}
.muted{color:var(--muted)} .cap{font-size:12px;color:var(--muted)} .num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

#app{height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
header.top .left{display:flex;align-items:center;gap:8px;min-width:0}
header.top h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;overflow-y:auto;padding-block:16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));display:flex}
nav.tabs button{flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--soft)}
.seg button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);min-height:34px}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.wide button{flex:1;padding:8px 10px;font-size:13px}
.seg.wide{display:flex;width:100%}

.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--card)}
.tile .v{font-size:22px;font-weight:600;line-height:1.1;margin-top:4px}
.tile .v small{font-size:13px;font-weight:400;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

.card{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:12px;display:flex;align-items:center;gap:12px;width:100%;text-align:left;position:relative;z-index:1;transition:transform .18s ease;touch-action:pan-y}
.swipe{position:relative;overflow:hidden;border-radius:var(--r)}
.swipe .swipe-acts{position:absolute;top:0;right:0;bottom:0;width:168px;display:flex;visibility:hidden}
.swipe.open .swipe-acts,.swipe.dragging .swipe-acts{visibility:visible}
.swipe .swipe-acts button{flex:1;border:0;font-weight:700;font-size:15px;display:grid;place-items:center}
.swipe .swipe-cancel{background:var(--soft);color:var(--fg)}
.swipe .swipe-del{background:var(--danger,#e5484d);color:#fff;border-radius:0 var(--r) var(--r) 0}
.swipe.open .card{transform:translateX(-168px)}
.swipe.dragging .card{transition:none}
.card .ic,.ic{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--fg)}
.ic.sm{width:60px;height:60px;border-radius:12px}
.ic .pf{width:88%;height:88%}
.bodymap .sk{fill:var(--line)}
.bodymap path,.bodymap circle{fill:var(--line)}
.bodymap .hl{fill:var(--hl)}
.phase{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.credit{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.ico-svg,.pf{display:block;max-width:100%}
.pf .fill{stroke:var(--soft)}.pf .fillp{fill:var(--soft)}.pf .hls{stroke:var(--hl)}.pf .hlf{fill:var(--hl);stroke:none}.pf .p{stroke:var(--equip);stroke-width:3}.pf .ar{stroke:var(--accent);opacity:.9}.pf .ah{fill:var(--accent);stroke:none}.pf .band{stroke-dasharray:3 2}
.bigico{display:grid;place-items:center;width:140px;height:140px;border-radius:32px;background:var(--soft);margin:0 auto;color:var(--fg)}
.hero{display:flex;align-items:center;justify-content:center;gap:20px}
.bmtile{display:grid;place-items:center;width:140px;height:140px;border-radius:32px;background:var(--soft);--bm-gap:var(--soft);flex:none}
.bm{display:inline-block;vertical-align:middle}.bm .r{fill:var(--bm-rest);stroke:var(--bm-gap,var(--card));stroke-width:1.5}.bm .r.d{fill:var(--bm-decor)}.bm .r.p{fill:var(--hl)}.bm .r.s{fill:var(--hl);opacity:.42}.bm .hair path,.bm .hair ellipse{fill:var(--bm-hair);stroke:none}.bmwrap{display:inline-flex;gap:4px;align-items:center}
.bmsm{flex:none;margin-left:auto;--bm-gap:var(--card)}
.guide h2{font-size:20px}.guide .rpt-sec{gap:6px;line-height:1.55}.guide .rpt-sec h3{font-size:16px;margin-bottom:2px}.guide p{margin:0}.guide ul{margin:0;padding-left:18px}.guide li{margin:3px 0}.guide .chips a{text-decoration:none}.guide .faq,.guide .hist{margin:0}.guide .faq dt{font-weight:600;margin-top:8px}.guide .faq dd,.guide .hist dd{margin:2px 0 0;color:var(--muted)}.guide .hist dt{font-weight:600;margin-top:8px}.guide .hist dd{color:var(--fg)}.guide section{scroll-margin-top:72px}
.moved{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:14px}.moved .grow{flex:1 1 260px}.moved .row{flex:none;margin-left:auto}.moved .btn.sm{width:auto}.moved a.btn{text-decoration:none}.hero .bigico{margin:0}.rpt-map{display:flex;justify-content:center;margin:2px 0 4px;--bm-gap:var(--card)}
.ptiles{grid-template-columns:1fr 1fr!important;max-width:440px;margin:0 auto;width:100%;text-align:center}
.steps3{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}.steps3:empty{display:none}
.sc{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:8px 6px 10px;text-align:center;display:flex;flex-direction:column;gap:6px;min-width:0}
.sfig{background:var(--soft);border-radius:10px;display:grid;place-items:center;aspect-ratio:1;color:var(--fg)}.sfig .pf{width:100%;height:100%}
.sk{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.03em;line-height:1.25}
.scue{font-size:13px;font-weight:600;line-height:1.3}
.smis{font-size:11px;color:var(--muted);line-height:1.3}
.holdbtn{min-height:44px}
@media (min-width:600px){ .sk{font-size:12px} .scue{font-size:14px} }
.board .mini .ico-svg{flex:none}
.card .nm{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.card .sub{font-size:12px;color:var(--muted)}
.card.done .chk.on{width:20px;height:20px}.card.done .chk.on svg{width:11px;height:11px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.chk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:var(--accent-fg)}
.chk.on{background:var(--good);border-color:var(--good)}
.chk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 18px;border-radius:var(--r);font-weight:600;width:100%}
.btn.pri{background:var(--pri,var(--accent));color:var(--accent-fg)}
.btn.sec{border:1px solid var(--line);background:var(--card)}
.btn.ghost{height:40px;color:var(--accent)}
.btn.danger{color:#d9403c}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{height:36px;padding:0 12px;width:auto;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.t-stretch{color:var(--c-stretch)} .t-warmup{color:var(--c-warmup)} .t-strength{color:var(--c-strength)} .t-cardio{color:var(--c-cardio)} .t-cooldown{color:var(--c-cooldown)}
.b-stretch{background:var(--c-stretch)} .b-warmup{background:var(--c-warmup)} .b-dynamic{background:#f59e0b} .b-strength{background:var(--c-strength)} .b-cardio{background:var(--c-cardio)} .b-cooldown{background:var(--c-cooldown)}

/* weekly board */
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.board .col{border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px;border:1px solid transparent;min-width:0}
.board .mini{min-width:0;max-width:100%}
.onoff{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--soft)}
.onoff button{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}
.onoff button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ver{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.navver{display:none}
.navver:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.sheet:focus{outline:none}
.board .col.sel{border-color:var(--accent);background:var(--accent-soft)}
.board .col.today .d{color:var(--accent)}
.board .wd{font-size:11px;color:var(--muted)} .board .d{font-size:13px;font-weight:600}
.board .mini{width:26px;height:26px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font-size:14px;position:relative}
.board .mini .pf{width:100%;height:100%}
.board .mini.done::after{content:"";position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:var(--good);border:2px solid var(--bg)}
.board .mini i{position:absolute;left:3px;top:3px;width:5px;height:5px;border-radius:50%}

/* monthly */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.cal .cell{aspect-ratio:1/1.15;border-radius:8px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid transparent}
.cal .cell.other{opacity:.35}
.cal .cell.today{border-color:var(--accent)}
.cal .cell .d{font-size:12px;font-weight:600}
.cal .bars{display:flex;gap:2px;width:100%;justify-content:center}
.cal .bars i{width:5px;height:14px;border-radius:2px;opacity:.35}
.cal .bars i.done{opacity:1}

/* list rows */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.list .li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;min-height:52px}
.list .li:last-child{border-bottom:0}
.list .li .nm{font-weight:600} .list .li .sub{font-size:12px;color:var(--muted)}
.list .li .arrow{color:var(--muted);flex:none}
.step{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.step button{width:40px;height:40px;font-size:18px;color:var(--accent)}
.step .sv{min-width:56px;text-align:center;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}

/* sheets and overlays */
#layer{position:fixed;inset:0;z-index:45;pointer-events:none}#layer:empty{display:none}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;pointer-events:auto;background:var(--bg);border-radius:18px 18px 0 0;max-height:min(88%,calc(100dvh - 40px));overflow-y:auto;
  padding-block:8px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  animation:up .22s ease-out}
.sheet .grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.full{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.full .bar-top{display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:8px}
.full .body{flex:1;overflow-y:auto;padding-bottom:48px}
.full .foot{padding-block:12px 16px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--fg)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* how-to carousel */
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

/* timer */
.timer{text-align:center;padding:32px 0 16px}
.timer .big{font-size:64px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.ring{width:220px;height:220px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--p,0%),var(--soft) 0)}
.ring>div{width:196px;height:196px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.setrow{display:grid;grid-template-columns:44px 1fr 1fr 44px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.setrow input{text-align:center;padding:8px 6px}
.setrow .n{font-weight:600;color:var(--muted)}
.setrow.done{opacity:.55}
.setrow .cap{text-transform:capitalize}
.restbox{border-radius:var(--r);background:var(--accent-soft);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cond{display:flex;gap:6px}
.cond button{flex:1;height:44px;border-radius:10px;border:1px solid var(--line);font-weight:600}
.cond button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.delta{font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--warn)}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:40}
.icons{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.icons button{width:66px;height:66px;border-radius:12px;border:1px solid var(--line);flex:none;background:var(--card);display:grid;place-items:center;color:var(--fg)}
.icons button.on{border-color:var(--accent);background:var(--accent-soft)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}
.targets{margin-top:6px;line-height:1.5}.targets b{font-weight:600;color:var(--fg)}
.rpt-sec{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:12px;display:flex;flex-direction:column;gap:10px}
.rpt-sec h3{font-size:14px;font-weight:700;margin:0}
.rpt-chart svg{width:100%;height:auto;display:block}.rpt-chart{max-width:560px;margin-inline:auto;width:100%}
.rpt-chart text{font-size:4.2px;fill:var(--muted);font-family:inherit}
.rpt-chart rect{fill:var(--accent)}
.rpt-chart .alt rect{fill:var(--good)}
.rpt-chart polyline{fill:none;stroke:var(--accent);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.rpt-chart .dim{opacity:.35}
.rpt-row{display:flex;align-items:center;gap:8px;font-size:13px}
.rpt-row .lbl{width:92px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpt-row .bar{flex:1;margin:0}
.rpt-row .val{width:64px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.rpt-kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px}
.rpt-kv b{font-weight:600}
.rpt-small{font-size:12px;color:var(--muted)}
.rpt-need{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.rpt-list{display:flex;flex-direction:column;gap:6px;font-size:13px}
.rpt-list .it{display:flex;justify-content:space-between;gap:8px}
.rpt-list .it span:last-child{color:var(--muted);white-space:nowrap}
.statusline{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.board .mini .mn{display:none}
.board .mini{width:40px;height:40px}
.board .add{width:34px;height:34px;border-radius:8px;border:1px dashed var(--line);color:var(--muted);font-size:16px;display:grid;place-items:center;margin-top:auto}
.board .col{min-height:140px}
.smart{border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;background:var(--accent-soft);display:flex;flex-direction:column;gap:8px}

 {v:'0.25.3',date:'2026-11-04',en:['Reinstalling works even on a phone that had the old app: the install settings file now always comes fresh from the network instead of the offline copy, so the new app id is what the phone sees','Settings shows the app id under the version ("/my-fit/app" means the phone has the new install settings)'],ko:['예전 앱이 있던 휴대폰에서도 다시 설치되게: 설치 설정 파일을 오프라인 사본이 아니라 항상 네트워크에서 새로 받아서, 휴대폰이 새 앱 id를 보게 함','설정의 버전 아래에 앱 id 표시("/my-fit/app"이면 새 설치 설정을 받은 것)']},
 {v:'0.25.2',date:'2026-11-04',en:['The app can be installed again after you remove it: it now has a fixed app id, so Chrome no longer says "This app is already installed" / "Could not open app". If an older My Fit is still on your home screen, remove it and install again','The installed app now turns to landscape too (the portrait-only lock is gone)'],ko:['앱을 지운 뒤 다시 설치할 수 있게: 앱 고유 id를 정해서 Chrome의 "이미 설치됨" / "앱을 열 수 없음" 문제가 생기지 않음. 홈 화면에 예전 My Fit이 남아 있으면 지우고 다시 설치','설치한 앱도 가로로 돌아감(세로 고정 해제)']},
 {v:'0.25.1',date:'2026-11-03',en:['Layout checked on desktop (full and split screen), Galaxy Tab S8 (landscape and portrait) and phones (portrait and landscape)','Phones turned sideways: icon-only side menu, smaller pictures and a one-line button bar so the workout stays visible','Tablet portrait: content stays in a centered column instead of stretching edge to edge','Wide screens: the exercise picture and muscle map sit side by side; report chart labels keep a normal size'],ko:['데스크톱(전체·분할 화면), 갤럭시탭 S8(가로·세로), 휴대폰(세로·가로)에서 화면 배치 점검','휴대폰 가로: 아이콘만 있는 옆 메뉴, 작은 그림, 한 줄 버튼으로 운동 화면이 가려지지 않게','태블릿 세로: 화면 끝까지 늘어나지 않고 가운데 열로 표시','넓은 화면: 운동 그림과 근육 지도가 나란히, 보고서 그래프 글자 크기 정상화']},
 {v:'0.25.0',date:'2026-11-03',en:['Muscle map: a front/back body next to every exercise colours the primary muscles red and the secondary ones light red, showing only the side that works (get-ready screen and exercise editor)','Report: a weekly muscle map shades each muscle by how many sets it got','Settings: choose a male or female body figure','New app icon: cleaner, thicker outline'],ko:['근육 지도: 운동마다 앞·뒤 몸 그림에 주동근은 빨강, 보조근은 연한 빨강으로 표시. 자극되는 쪽만 보여줌(준비 화면, 운동 편집창)','보고서: 이번 기간 세트 수에 따라 진하기가 달라지는 근육 지도','설정: 몸 그림을 남성/여성 중에서 선택','새 앱 아이콘: 선을 두껍고 깔끔하게']},
 {v:'0.24.0',date:'2026-11-01',en:['Every exercise now lists the specific muscles it works — primary and secondary (upper/lower chest, lats, rear delts, quads, hamstrings, glute med, adductors, obliques, deep core, calves, forearms…) on the get-ready screen and in the item editor','Report: muscle balance adds a breakdown by specific muscle (sets by primary mover)'],ko:['모든 운동에 자극 부위를 구체적으로 표시 — 주동근·보조근(상부/하부 대흉근, 광배근, 후면 삼각근, 대퇴사두근, 햄스트링, 중둔근, 내전근, 복사근, 심부 코어, 종아리, 전완근 등). 준비 화면과 편집창에 표시','보고서: 부위 균형에 세부 부위별(주동근 기준 세트) 목록 추가']},
 {v:'0.23.0',date:'2026-10-31',en:['Smart plan: deload week — after several weeks on goal (every 3/4/6 weeks, your choice) the next week is suggested 5–20% lighter','Smart plan: lighter first week back — after a break of 7/14/21+ days the week starts 5–20% below your last weights. Both are switches in Settings → Smart mode'],ko:['스마트 플랜: 디로드 주 — 목표를 몇 주(3/4/6주 선택) 연속 채우면 다음 주를 5~20% 가볍게 제안','스마트 플랜: 복귀 첫 주 감량 — 7/14/21일 이상 쉬었다 돌아오면 첫 주를 마지막 무게보다 5~20% 낮게 제안. 둘 다 설정 → 스마트 모드에서 켜고 끌 수 있음']},
 {v:'0.22.1',date:'2026-10-31',en:['Smart plan: an exercise you could not finish last time keeps that weight next week instead of dropping back to the library default'],ko:['스마트 플랜: 지난번에 세트를 다 못 채운 운동은 다음 주에 기본 무게로 돌아가지 않고 그 무게를 유지']},
 {v:'0.22.0',date:'2026-10-28',en:['Streak now counts consecutive weeks that met your weekly goal (not calendar days); a week in progress keeps the count until it ends short','Routines can repeat every week: tick "Apply every week" when applying; a new empty week is filled automatically (preset mode). Turn it off in Settings','The day now starts at 04:00, so a workout that ends after midnight stays on that evening\'s date and the dashboard keeps showing it','Monthly "planned" counts only days up to today'],ko:['연속(streak)은 주간 목표를 채운 연속 주 수로 계산(달력 일수가 아님). 진행 중인 주는 끝나기 전까지 지난 연속 수를 유지','루틴 매주 반복: 적용할 때 "매주 자동 적용"을 켜면 새 주가 비어 있을 때 자동으로 채움(프리셋 모드). 설정에서 끌 수 있음','하루의 시작을 새벽 4시로: 자정 넘겨 끝낸 운동은 그날 저녁 날짜로 남고 대시보드에도 계속 보임','월간 "planned"는 오늘까지의 계획일만 셈']},
 {v:'0.21.2',date:'2026-10-27',en:['Timed exercises: the duration on the completion screen is editable, and a long hike or run is no longer cut to the target + 10 minutes (cap is now 3× target + 15 min)','Switching kg/lb now converts your check-in body weights too (used for × body weight in the report)'],ko:['시간형 운동: 완료 화면에서 운동 시간을 직접 고칠 수 있고, 긴 등산·달리기가 목표+10분으로 잘리지 않음(상한 목표×3+15분)','kg/lb 전환 시 체크인 체중도 함께 변환(보고서의 체중 대비 배수에 사용)']},
 {v:'0.21.1',date:'2026-10-27',en:['Figures: elbows never fold past 150° (curls, stretches, squat rack grip, machine handles adjusted)','Custom exercises with an unusual icon name no longer break the picture'],ko:['그림: 팔꿈치가 150° 이상 접히지 않도록 제한(컬·스트레칭·스쿼트 바 그립·머신 손잡이 보정)','특이한 아이콘 이름의 사용자 운동에서 그림이 깨지던 문제 수정']},
 {v:'0.21.0',date:'2026-10-27',en:['New Report tab: period (4 wk / 12 wk / 1 yr / all), summary, week-by-week volume and minutes, growth by estimated 1RM, strength board with × body weight, muscle balance, consistency, effort & recovery, cardio, body, personal records, notes; copy as text or export CSV','New data captured for future reports: time of each set, session RPE, cardio distance and average heart rate, daily check-in (body weight, sleep, note), weekly note. Everything syncs, exports and backs up with the rest of your data'],ko:['보고서 탭 추가: 기간(4주/12주/1년/전체), 요약, 주별 볼륨·시간, 추정 1RM 성장 속도, 근력 보드(체중 대비), 부위 균형, 꾸준함, 강도·회복, 유산소, 신체, 개인 기록, 메모. 텍스트 복사·CSV 내보내기','앞으로의 보고서를 위해 새로 기록되는 값: 세트별 완료 시각, 세션 RPE, 유산소 거리·평균 심박, 오늘 체크인(체중·수면·메모), 주간 메모. 동기화·내보내기·백업에 모두 포함']},
 {v:'0.20.0',date:'2026-10-22',en:['68 Samsung Health activity types added under a new "Sports & outdoor" filter: walking, running, hiking, backpacking, orienteering, snowshoeing, exercise bike, mountain biking, step machine, circuit training, sit-up, star jump, hula-hooping, aerobics, pilates, t\'ai chi, boxing, martial arts, ballet, dancing, ballroom, baseball, softball, cricket, golf, billiards, bowling, hockey, ice hockey, rugby, American football, basketball, football, handball, volleyball, beach volleyball, squash, tennis, badminton, table tennis, racquetball, flying disc, inline/roller/ice skating, ice dancing, hang gliding, pistol shooting, archery, horseback riding, rock climbing, aquarobics, scuba, snorkeling, canoeing, kayaking, rafting, rowing, sailing, yachting, windsurfing, kitesurfing, water skiing, skiing, alpine, cross-country, snowboarding','Figures now obey ankle range of motion (sole perpendicular to the shin, at most 55° pointed / 25° flexed) and knee flexion limits; leg press feet sit flat on the platform; seated machines, kneeling and floor poses corrected'],ko:['삼성헬스 운동 종류 68개 추가, 새 필터 "스포츠·야외": 걷기, 달리기, 등산, 백패킹, 오리엔티어링, 스노슈잉, 실내 자전거, MTB, 스텝 머신, 서킷, 싯업, 스타 점프, 훌라후프, 에어로빅, 필라테스, 태극권, 복싱, 무술, 발레, 댄스, 볼룸, 야구, 소프트볼, 크리켓, 골프, 당구, 볼링, 하키, 아이스하키, 럭비, 미식축구, 농구, 축구, 핸드볼, 배구, 비치발리볼, 스쿼시, 테니스, 배드민턴, 탁구, 라켓볼, 원반, 인라인·롤러·아이스 스케이트, 아이스 댄스, 행글라이딩, 사격, 양궁, 승마, 클라이밍, 아쿠아로빅, 스쿠버, 스노클링, 카누, 카약, 래프팅, 조정, 세일링, 요트, 윈드서핑, 카이트서핑, 수상스키, 스키, 알파인, 크로스컨트리, 스노보드','그림이 발목 가동범위(발바닥은 정강이에 수직, 최대 55° 폄 / 25° 굽힘)와 무릎 굽힘 한계를 지키도록 수정. 레그프레스 발이 발판에 평평하게, 앉는 머신·무릎 꿇기·바닥 자세 교정']},
 {v:'0.19.0',date:'2026-10-22',en:['28 new machine and cable exercises: pec deck, reverse pec deck, incline chest press, shoulder press, seated row, assisted pull-up, T-bar row, back extension, straight-arm pulldown, preacher curl, seated dip, hack squat, Smith squat, seated leg curl, standing/seated calf, calf press, glute kickback, ab crunch machine, treadmill, elliptical, cable curl/lateral/kickback/crunch/pull-through/woodchop','Finished exercises keep their name readable: a small green check instead of strike-through','Dashboard always offers "Add exercise" for today, even after everything is done'],ko:['머신·케이블 운동 28개 추가: 펙덱, 리버스 펙덱, 인클라인 체스트 프레스, 숄더 프레스, 시티드 로우, 어시스트 풀업, 티바 로우, 백 익스텐션, 스트레이트 암 풀다운, 프리처 컬, 시티드 딥, 핵 스쿼트, 스미스 스쿼트, 시티드 레그 컬, 스탠딩·시티드 카프, 카프 프레스, 글루트 킥백, 복근 머신, 러닝머신, 일립티컬, 케이블 컬·레터럴·킥백·크런치·풀스루·우드챱','완료한 운동은 취소선 대신 작은 초록 체크로 표시','오늘 운동을 다 해도 대시보드에서 바로 운동 추가 가능']},
 {v:'0.18.0',date:'2026-10-22',en:['Inner/outer thigh: hip adduction and abduction machines, side-lying leg raise and adduction, clamshell, lateral band walk, side leg swings','Stretching split into Dynamic (leg swings, arm circles, inchworm, cat-cow...) and Static; new dynamic drills: world\'s greatest stretch, lunge with twist','Swipe left now shows Delete and Cancel buttons; nothing is deleted until you tap Delete','Get-ready screen: tap the Target tile to change sets, reps or weight right there','Leg press redrawn (reclined back on the pad); all 193 figures checked one by one again, 10 poses fixed (push press, side lunge, single-leg deadlift, ball bridge/ham curl/hip raise, happy baby, frog...)'],ko:['이너타이·아웃타이: 힙 어덕션/어브덕션 머신, 사이드 레그 레이즈·어덕션, 클램쉘, 밴드 사이드 워크, 사이드 레그 스윙','스트레칭을 동적(레그 스윙, 팔 돌리기, 인치웜, 캣카우 등)과 정적으로 구분, 동적 드릴 추가: 월드 그레이티스트 스트레칭, 런지 트위스트','왼쪽으로 밀면 삭제·취소 버튼이 나오고, 삭제를 눌러야 지워짐','준비 화면의 목표 타일을 누르면 세트·횟수·무게를 바로 수정','레그프레스 다시 그림(등받이에 기댄 자세), 193개 그림 전수 재확인 후 10개 자세 수정(푸시프레스, 사이드 런지, 싱글레그 데드리프트, 짐볼 브릿지/햄컬/힙레이즈, 해피베이비, 개구리 등)']},
 {v:'0.17.1',date:'2026-10-22',en:['Every exercise card on the Dashboard is tappable: today starts it, other days open the editor','Swipe a card left to delete it (short swipe shows the Delete button, long swipe deletes right away)'],ko:['대시보드의 모든 운동 카드를 누를 수 있음: 오늘은 바로 시작, 다른 날은 편집창','카드를 왼쪽으로 밀면 삭제(짧게 밀면 삭제 버튼, 길게 밀면 바로 삭제)']},
 {v:'0.17.0',date:'2026-10-22',en:['Install as an app: on Android tap "Add to home screen" in Settings, on iPhone use Safari Share → Add to Home Screen','Works offline and loads instantly from the home screen; you are told when an update is ready','Google sign-in from the installed app'],ko:['앱으로 설치: 안드로이드는 설정의 "홈 화면에 추가", 아이폰은 Safari 공유 → 홈 화면에 추가','오프라인에서도 열리고 홈 화면에서 바로 실행, 업데이트가 준비되면 알림','설치된 앱에서도 구글 로그인']},
 {v:'0.16.1',date:'2026-10-22',en:['Body proportions corrected to adult ratios: 7.2 heads tall, longer arms (shoulder to wrist 37% of height), slightly longer thighs'],ko:['인체 비율을 성인 비율로 교정: 7.2등신, 팔을 더 길게(어깨~손목이 키의 37%), 허벅지 약간 길게']},
 {v:'0.16.0',date:'2026-10-21',en:['How-to popup removed: the three steps live on the get-ready screen only','Figure-by-figure check of all 81 drawings: overhead triceps, bench bar, rowing fixed','Review fixes: number inputs clamped, weight step everywhere, kg/lb switch converts all weights, exercise steps capped at 3 with empty steps hidden, step text no longer cut, names wrap, start any day from Weekly, feel scale labelled, backups hidden without sync, dark-mode start button stronger, export can download a file'],ko:['운동 방법 팝업 제거: 3단계는 준비 화면에만','81개 그림 전수 확인: 삼두 오버헤드, 벤치 바, 로잉 수정','리뷰 반영: 숫자 입력 범위 제한, 무게 단위 증가량 통일, kg/lb 전환 시 모든 무게 변환, 단계는 3개까지(빈 단계 숨김), 단계 글 잘림 없음, 이름 줄바꿈, 주간에서 아무 날이나 시작, 컨디션 척도 라벨, 동기화 없으면 백업 숨김, 다크모드 시작 버튼 진하게, 내보내기 파일 다운로드']},
 {v:'0.15.0',date:'2026-10-21',en:['One fixed scale for every figure: the person is the same size in every exercise and every step, centred in the box; arrows and line weights no longer change with the pose'],ko:['모든 그림을 고정 배율로: 어떤 운동·어떤 단계든 사람 크기가 같고 박스 중앙에 배치, 화살표와 선 굵기도 동작에 따라 변하지 않음']},
 {v:'0.14.1',date:'2026-10-21',en:['Get-ready screen: everything centred, muscle silhouettes removed, the three how-to steps shown right on the screen','Arrows keep a wider gap from the body'],ko:['준비 화면: 전부 가운데 정렬, 자극 부위 실루엣 제거, 운동 방법 3단계를 화면에 바로 표시','화살표가 몸에서 더 멀리 떨어짐']},

function bodyHairSvg(sex,view){ const [cx,cy,rx,ry]=BODY_HEAD[sex][view];
  if(sex==='m'){ const base=view==='b'?`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>`:''; return `<g class="hair">${base}<g transform="translate(${cx-rx} ${cy-ry}) scale(${(2*rx/112).toFixed(4)} ${(2*ry/144).toFixed(4)}) translate(-76 -36)">${BODY_HAIR.m.map(u=>`<path d="${u.d}" transform="translate(${u.tx} ${u.ty})"/>`).join('')}</g></g>`; }
  return `<g class="hair" transform="translate(${cx} ${cy}) scale(${rx} ${ry})">${BODY_HAIR.f[view].map(d=>`<path d="${d}"/>`).join('')}</g>`; }
let _bodyUid=0;
// opts: sex 'm'|'f', weights {key: 0..1} (opacity of primary keys, for the weekly map)
function bodyMapSvg(view,prim,sec,size,opts){ opts=opts||{}; const sex=opts.sex==='f'?'f':'m'; const parts=BODY_PARTS[sex][view]; const vb=BODY_VB[sex][view]; const vbx=vb.split(' ').map(Number); const mid=vbx[0]+vbx[2]/2; const weights=opts.weights||null;
  const bySlug={}; parts.forEach(([slug,pieces])=>{ bySlug[slug]=pieces; });
  const uid='bm'+(++_bodyUid); let defs=''; const overlays=[]; const base={}; const bands=[];
  const alpha=(cls,w)=>(cls==='s'?.42:1)*w; const op=(cls,w)=>w<1?` style="opacity:${alpha(cls,w).toFixed(2)}"`:'';
  const apply=(key,cls)=>{ (BODY_RULES[key]||[]).forEach(([v,slug,pick,clip])=>{ if(v!==view)return; const slugs=slug==='*'?Object.keys(bySlug).filter(s=>!BODY_DECOR[s]):[slug]; slugs.forEach(sl=>{ const pieces=bySlug[sl]; if(!pieces)return; const maxA=Math.max(...pieces.map(p=>p[1][2]*p[1][3]));
    pieces.forEach((p,i)=>{ const a=p[1][2]*p[1][3]; if(pick==='big'&&a<maxA*.5)return; if(pick==='small'&&a>=maxA*.5)return; const w=weights?(weights[key]||0):1; const k=sl+'#'+i;
      if(!clip){ if(!base[k]||alpha(cls,w)>alpha(base[k].cls,base[k].w))base[k]={cls,w}; return; }
      const [x,y,bw,bh]=p[1]; let r; if(clip[0]==='y')r=[x-5,y+bh*clip[1],bw+10,bh*(clip[2]-clip[1])]; else { const lat=x+bw/2>mid; const x0=lat?x+bw*clip[1]:x+bw*(1-clip[2]); r=[x0,y-5,bw*(clip[2]-clip[1]),bh+10]; }
      bands.push({d:p[0],k,cls,w,r}); }); }); }); };
  (sec||[]).forEach(k=>apply(k,'s')); (prim||[]).forEach(k=>apply(k,'p'));
  // a band drawn over an already coloured piece only adds what is needed to reach the larger of the two values
  bands.forEach(c=>{ const b=base[c.k]; let style=op(c.cls,c.w); if(b){ const a1=alpha(b.cls,b.w), a2=alpha(c.cls,c.w); if(a2<=a1+1e-6||a1>=1)return; style=` style="opacity:${(1-(1-a2)/(1-a1)).toFixed(2)}"`; }
    const id=uid+'c'+overlays.length; defs+=`<clipPath id="${id}"><rect x="${c.r[0].toFixed(1)}" y="${c.r[1].toFixed(1)}" width="${c.r[2].toFixed(1)}" height="${c.r[3].toFixed(1)}"/></clipPath>`; overlays.push(`<path d="${c.d}" class="r ${c.cls}" clip-path="url(#${id})"${style}/>`); });
  let body=''; parts.forEach(([slug,pieces])=>pieces.forEach((p,i)=>{ const b=base[slug+'#'+i]; const cls=BODY_DECOR[slug]?'d':b?b.cls:'n'; body+=`<path d="${p[0]}" class="r ${cls}"${b?op(b.cls,b.w):''}/>`; }));
  const heart=(prim||[]).includes('heart')&&view==='f'?`<path d="M${mid} 470l-38-38a27 27 0 0 1 38-30a27 27 0 0 1 38 30z" class="r p"/>`:'';
  return `<svg viewBox="${vb}" width="${(size/2).toFixed(0)}" height="${size}" class="bm" data-sex="${sex}" aria-hidden="true"><defs>${defs}</defs>${body}${overlays.join('')}${heart}${bodyHairSvg(sex,view)}</svg>`; }
// which side to show: the one holding the primary muscles (both when they span front and back, or for opts.both)
function bodyViewsFor(prim,sec){ const has=(keys,v)=>(keys||[]).some(k=>(BODY_RULES[k]||[]).some(r=>r[0]===v)||(k==='heart'&&v==='f')); const pf=has(prim,'f'), pb=has(prim,'b'); if(pf!==pb)return [pf?'f':'b']; if(pf&&pb)return ['f','b']; const sf=has(sec,'f'), sb=has(sec,'b'); if(sf!==sb)return [sf?'f':'b']; return ['f','b']; }
function muscleMapHtml(prim,sec,size,opts){ opts=opts||{}; const views=opts.both?['f','b']:bodyViewsFor(prim,sec); return `<span class="bmwrap">${views.map(v=>bodyMapSvg(v,prim,sec,size,opts)).join('')}</span>`; }

 {id:'start',title:{en:'Getting started',ko:'시작하기'},en:[
  'My Fit is a weekly workout planner and tracker. It runs in the browser and can be installed on your phone like an app.',
  'What it is for — three things: ① Log with ease: tick off sets with one hand while you train and fix weight or reps on the spot. ② Train correctly: every built-in exercise starts with step-by-step figures, a map of the muscles it works, and your target next to your last result. ③ Track by looking back: the weekly, monthly and report views show volume, estimated 1RM, muscle balance and consistency so you can set the next target. Your records are yours — export them as JSON any time from Settings, and as CSV from the Report tab when you use the app in a browser (the claude.ai preview offers copy-as-text instead).',
  '• Address: https://amber-my-fit.netlify.app/ — install from here. The older GitHub address still works but only shows a moving notice.',
  '• Android: open the address in Chrome → ⋮ → Install app. iPhone: open it in Safari → Share → Add to Home Screen.',
  '• First screen: choose Google sign-in (data saved to your account and synced across devices) or "Use without account" (data stays on this device only).',
  '• Switch EN / KO with the toggle at the top right. The day starts at 04:00, so a workout finished after midnight still counts for that evening.'],
  ko:[
  'My Fit은 주간 운동 계획·기록 앱입니다. 브라우저에서 돌아가고, 휴대폰에 앱처럼 설치할 수 있습니다.',
  '이 앱의 목적은 세 가지입니다. ① 편하게 기록하기: 운동 중 한 손으로 세트를 체크하고 무게·횟수를 그 자리에서 고칩니다. ② 올바르게 운동하기: 기본 운동마다 동작 단계 그림, 자극되는 근육 지도, 지난 기록 옆의 목표를 보고 시작합니다. ③ 기록을 보며 추적하기: 주간·월간·보고서에서 볼륨, 추정 1RM, 부위 균형, 꾸준함을 확인하고 다음 목표를 정합니다. 기록은 내 것입니다. 설정에서 언제든 JSON으로, 브라우저에서 쓸 때는 보고서 탭에서 CSV로 내보낼 수 있습니다(claude.ai 미리보기에서는 CSV 대신 텍스트 복사).',
  '• 주소: https://amber-my-fit.netlify.app/ — 앱 설치는 여기서 합니다. 예전 GitHub 주소도 열리지만 이사 안내만 보여 줍니다.',
  '• 안드로이드: 크롬으로 주소를 열고 ⋮ → 앱 설치. 아이폰: Safari로 열고 공유 → 홈 화면에 추가.',
  '• 첫 화면에서 구글 로그인(계정에 저장, 모든 기기 동기화) 또는 "계정 없이 사용"(이 기기에만 저장)을 고릅니다.',
  '• 오른쪽 위 토글로 EN / KO를 바꿉니다. 하루는 새벽 4시에 시작해서, 자정을 넘겨 끝낸 운동도 그날 저녁 기록으로 남습니다.']},
 {id:'dash',title:{en:'Dashboard',ko:'대시보드'},en:[
  '• This week: workout days done out of your weekly goal. Streak counts consecutive weeks that met the goal; the current week keeps the count until it ends short.',
  '• Today: the exercises planned for today. Tap a card to start it, swipe left to delete it, or tap "+ Add exercise" to add one even after everything is done.',
  '• Weekly review: on Monday to Wednesday the dashboard shows last week in one card — sessions, volume and minutes with the change from the week before, new personal records and the most-trained muscles. "Save as image" downloads it as a picture (in the claude.ai preview it copies the text instead); "Close" hides it until next week.',
  '• "Start today\'s workout" runs the planned exercises one after another. On a day with nothing planned, "Log a workout now" lets you pick an exercise and start it straight away; the picker lists the exercises you did in the last 4 weeks first.'],
  ko:[
  '• 이번 주: 주간 목표 대비 운동한 날 수. 연속(streak)은 목표를 채운 연속 주 수이고, 진행 중인 주는 끝나기 전까지 지난 연속 수를 유지합니다.',
  '• 오늘: 오늘 계획된 운동 목록. 카드를 누르면 바로 시작, 왼쪽으로 밀면 삭제, "+ 운동 추가"로 다 끝낸 뒤에도 추가할 수 있습니다.',
  '• 주간 리뷰: 월~수요일에는 대시보드에 지난주가 한 장으로 나옵니다. 세션·볼륨·시간과 그 전 주 대비 변화, 새 개인 기록, 많이 한 부위가 보이고, "이미지로 저장"으로 사진 파일로 받을 수 있습니다(claude.ai 미리보기에서는 텍스트 복사). "닫기"를 누르면 다음 주까지 숨겨집니다.',
  '• "오늘 운동 시작"을 누르면 계획된 운동을 차례로 진행합니다. 계획이 없는 날은 "지금 운동 기록하기"로 운동을 골라 바로 시작할 수 있고, 운동 고르기 맨 위에는 최근 4주 동안 한 운동이 먼저 나옵니다.']},
 {id:'week',title:{en:'Weekly plan',ko:'주간 계획'},en:[
  '• Preset mode: place exercises on each day yourself. "Apply routine" fills the week from one of 6 presets (Push/Pull/Legs, Upper/Lower, Full body, Home, Dumbbell, Cardio + core) or a routine you saved with "Save as routine".',
  '• Tick "Apply every week" when applying a routine and a new empty week is filled automatically (preset mode only, remaining days only). Turn it off in Settings.',
  '• Smart mode: the app lays out the week for you — every other day when possible, a split that fits your days per week, and automatic progression once you complete a target. Deload weeks and a lighter first week back are in Settings → Smart mode.'],
  ko:[
  '• 프리셋 모드: 요일 칸에 운동을 직접 놓습니다. "루틴 적용"은 프리셋 6개(푸시/풀/레그, 상/하체, 전신, 홈트, 덤벨, 유산소+코어)나 "루틴으로 저장"해 둔 내 루틴으로 한 주를 채웁니다.',
  '• 루틴을 적용할 때 "매주 자동 적용"을 켜면 새 주가 비어 있을 때 자동으로 채워집니다(프리셋 모드, 남은 요일만). 설정에서 끌 수 있습니다.',
  '• 스마트 모드: 앱이 한 주를 짜 줍니다. 가능하면 격일로, 주당 일수에 맞는 분할로, 목표를 다 채우면 자동 증량. 디로드 주와 복귀 첫 주 감량은 설정 → 스마트 모드에서 켜고 끕니다.']},
 {id:'workout',title:{en:'Doing a workout',ko:'운동하기'},en:[
  '• Get-ready screen: the exercise picture, a muscle map (primary muscles red, secondary light red; only the side that works is shown), target sets × reps × weight, your last record, and 3 how-to steps. Tap the Target tile to change sets, reps or weight before you start.',
  '• Sets screen: tick each set as you finish it, change reps or weight on the spot (later sets follow), add or remove sets, rest timer with ±15 s, add another exercise or skip one mid-workout.',
  '• Timed exercises (stretching, cardio) use a countdown; on the completion screen you can correct the duration and, for cardio, enter distance and average heart rate.',
  '• Hold exercises (dead hang, flexed-arm hang): the set card has a stopwatch instead of a weight — tap "Start hold", hang, tap again when you let go. The seconds are saved as that set, the rest timer starts, and the phone buzzes once you pass your target. You can also type the seconds with the − / + buttons.',
  '• Under every step the card shows the common mistake to avoid; for stretches, cool-downs and warm-ups it shows a tip (breathing, how long to hold) instead.',
  '• Set details (Settings → Goals, off by default): each working set gets a type chip (Normal → Drop set → To failure) and, once ticked, RPE buttons 6–10. The workout\'s RPE on the completion screen is pre-filled from the average of the set RPEs, and the CSV export includes set_rpe and set_kind.',
  '• Warm-up sets (Settings → Goals, off by default): exercises at 20 kg / 45 lb or more start with two dashed warm-up cards, 8 reps at 50 % and 5 at 70 % of the working weight. Tick them like any set; they are not counted in volume, records or progression.',
  '• When Smart mode changed a target (from v0.32 on), a line under it says why: weight up because last time\'s average reps reached the target, the same because they fell short, or lighter in a deload week or the first week back. Exercises with no history, preset-mode plans and targets you change yourself (or swap, copy, or convert to another unit) show no line.',
  '• The get-ready screen of a strength exercise also shows a tempo and breathing hint, and lists the muscles you already worked today with their set counts; if this exercise uses one of them as a main muscle, the line turns orange so you can swap or go lighter.',
  '• Swap: on the get-ready screen, "Swap" lists exercises that work the same main muscles, best matches first. Pick one and it replaces the planned exercise with its own targets — useful when a machine is taken or you have different equipment.',
  '• Faster logging: tap a number on a set card to type reps, weight or seconds (later sets follow). Under each set you see what you did last time — tap that line to copy it. Beating your best shows a "New personal record" badge on the completion screen.',
  '• Completion: how it felt (1–5) and how hard it was (RPE 6–10) feed the report. You can leave a workout safely: save or discard, and resume after closing the app.'],
  ko:[
  '• 준비 화면: 운동 그림, 근육 지도(주동근 빨강·보조근 연한 빨강, 자극되는 쪽만 표시), 목표 세트×횟수×무게, 지난 기록, 운동 방법 3단계. 목표 타일을 누르면 시작 전에 세트·횟수·무게를 바꿀 수 있습니다.',
  '• 세트 화면: 세트를 끝낼 때마다 체크, 횟수·무게 즉시 수정(뒤 세트가 따라감), 세트 추가/삭제, 휴식 타이머 ±15초, 운동 중 다른 운동 추가·건너뛰기.',
  '• 시간형 운동(스트레칭·유산소)은 카운트다운으로 진행하고, 완료 화면에서 시간을 고치거나 유산소는 거리·평균 심박을 넣을 수 있습니다.',
  '• 버티기 운동(데드 행, 굽힌 팔 매달리기): 세트 카드에 무게 대신 스톱워치가 있습니다. "버티기 시작"을 누르고 매달렸다가 손을 놓을 때 다시 누르면 그 초가 세트로 저장되고 휴식 타이머가 시작되며, 목표 초를 넘기면 진동이 한 번 옵니다. − / + 버튼으로 초를 직접 넣어도 됩니다.',
  '• 단계 카드마다 동작 설명 아래에 피해야 할 흔한 실수가 보이고, 스트레칭·쿨다운·워밍업은 실수 대신 팁(호흡, 유지 시간)이 보입니다.',
  '• 세트 상세 기록(설정 → 목표, 기본은 꺼짐): 본 세트마다 유형 칩(일반 → 드롭세트 → 실패까지)이 생기고, 체크한 세트에는 RPE 6~10 버튼이 나옵니다. 완료 화면의 운동 RPE는 세트 RPE 평균으로 미리 채워지고, CSV 내보내기에 세트별 RPE와 세트 유형 열이 들어갑니다.',
  '• 워밍업 세트(설정 → 목표, 기본은 꺼짐): 20kg·45lb 이상 운동은 점선 카드 두 장으로 시작합니다. 작업 무게의 50%로 8회, 70%로 5회입니다. 다른 세트처럼 체크하면 되고, 볼륨·기록·자동 증량에는 들어가지 않습니다.',
  '• 스마트 모드가 목표를 바꾼 경우(v0.32부터) 목표 아래 한 줄로 그 이유가 나옵니다. 지난번 평균 횟수가 목표를 채워 무게가 올랐는지, 못 채워 그대로인지, 디로드 주나 복귀 첫 주라 가벼운지 알려 줍니다. 기록이 없는 운동, 프리셋 모드 계획, 직접 고치거나 대체·복사·단위 변환한 목표에는 나오지 않습니다.',
  '• 근력 운동의 준비 화면에는 템포·호흡 힌트와 오늘 이미 한 부위(세트 수)가 나옵니다. 이 운동의 주동근이 그중에 있으면 주황색으로 바뀌니, 대체하거나 가볍게 하세요.',
  '• 대체: 준비 화면에서 "대체"를 누르면 같은 주동근을 쓰는 운동이 잘 맞는 순서로 나옵니다. 고르면 그 운동의 기본 목표로 계획이 바뀝니다. 기구가 사용 중이거나 다른 도구밖에 없을 때 쓰세요.',
  '• 빠른 기록: 세트 카드의 숫자를 누르면 횟수·무게·초를 바로 입력할 수 있고(뒤 세트가 따라감), 세트마다 지난번 기록이 한 줄 보여 누르면 그 값으로 채워집니다. 최고 기록을 넘기면 완료 화면에 "개인 기록 갱신" 배지가 뜹니다.',
  '• 완료 화면의 컨디션(1~5)과 강도(RPE 6~10)는 보고서에 쓰입니다. 운동 중 나가도 저장/버리기를 고를 수 있고, 앱을 닫았다가 이어서 할 수 있습니다.']},
 {id:'library',title:{en:'Exercise library',ko:'운동 라이브러리'},en:[
  '• Settings → Exercise library: 355 built-in exercises (bodyweight, barbell, dumbbell, kettlebell, band, machine, cable, stability ball, yoga, stretching, sports & outdoor) with filters by type, muscle and equipment, and Korean search.',
  '• Every exercise lists its primary and secondary muscles. You can add your own exercises, edit built-ins, or hide ones you never use.'],
  ko:[
  '• 설정 → 운동 라이브러리: 기본 운동 355개(맨몸·바벨·덤벨·케틀벨·밴드·머신·케이블·짐볼·요가·스트레칭·스포츠/야외). 종류·부위·도구 필터와 한글 검색.',
  '• 운동마다 주동근·보조근이 적혀 있습니다. 내 운동을 추가하거나 기본 운동을 고치고, 안 쓰는 운동은 숨길 수 있습니다.']},
 {id:'report',title:{en:'Report',ko:'보고서'},en:[
  '• Pick a period (4 wk / 12 wk / 1 yr / all). Sections: summary, week-by-week volume and minutes, growth by estimated 1RM, strength board (× body weight), muscle balance with a weekly muscle map and sets by specific muscle, consistency, effort & recovery, cardio, body, personal records, notes.',
  '• Today\'s check-in (body weight, sleep, note) and the weekly note are entered just below the summary.',
  '• Tap an exercise in growth, strength board or personal records to open its history: best, change since the first session, a trend line (estimated 1RM, or most reps / seconds / minutes) and the last 12 sessions. The same screen opens from the "Last" tile before an exercise, "History" in the item editor and the last-workout card on the dashboard.',
  '• "Copy as text" and "Export CSV" give you the numbers for a spreadsheet. Sections that need more data say what is missing.'],
  ko:[
  '• 기간(4주/12주/1년/전체)을 고릅니다. 항목: 요약, 주별 볼륨·시간, 추정 1RM 성장 속도, 근력 보드(체중 대비), 부위 균형(주간 근육 지도와 세부 부위별 세트), 꾸준함, 강도·회복, 유산소, 신체, 개인 기록, 메모.',
  '• 오늘 체크인(체중·수면·메모)과 주간 메모는 요약 바로 아래에서 적습니다.',
  '• 성장 속도·근력 보드·개인 기록에서 운동을 누르면 그 운동의 기록이 열립니다. 최고 기록, 첫 세션 대비 변화, 추이 그래프(추정 1RM, 또는 최다 횟수·초·분), 최근 세션 12개가 보입니다. 운동 전 준비 화면의 "지난번" 칸, 항목 편집의 "기록 보기", 대시보드의 지난 운동 카드에서도 같은 화면이 열립니다.',
  '• "텍스트 복사"와 "CSV 내보내기"로 숫자를 스프레드시트로 가져갈 수 있습니다. 데이터가 더 필요한 항목은 무엇이 부족한지 알려 줍니다.']},
 {id:'settings',title:{en:'Settings',ko:'설정'},en:[
  '• Goals: weekly goal (days), rest between sets. Smart mode: alternate days, split, auto progression and weight step, deload week (every 3/4/6 weeks, −5…20 %), lighter first week back (after 7/14/21+ days, −5…20 %).',
  '• Language, unit (kg/lb converts every stored weight), body figure (male/female) for the muscle map.',
  '• Data: Export JSON (copy or download a backup file), Import JSON (choose a file or paste; the app asks before replacing data), automatic daily backups (14 kept) and restore when signed in, reset.',
  '• Theme: Auto follows the phone\'s light / dark setting; Light or Dark keeps one look. The first time you open the app it asks how many days you train and which routine to start with — you can skip it.',
  '• The version row opens "What\'s new"; the app id line under it shows which install settings your phone received. On a tablet or desktop the side menu also shows the version and its release date at the bottom left — tap it for the same list.'],
  ko:[
  '• 목표: 주간 목표(일수), 세트 간 휴식. 스마트 모드: 격일 배치, 분할, 자동 증량과 무게 단위, 디로드 주(3/4/6주마다 −5~20%), 복귀 첫 주 감량(7/14/21일 이상 쉬면 −5~20%).',
  '• 언어, 단위(kg/lb 전환 시 저장된 무게가 모두 변환), 근육 지도의 몸 그림(남성/여성).',
  '• 데이터: JSON 내보내기(복사 또는 백업 파일 다운로드), JSON 가져오기(파일 고르기 또는 붙여넣기, 바꾸기 전에 한 번 확인), 로그인 시 하루 1회 자동 백업(14개 보관)과 복원, 초기화.',
  '• 화면 테마: 자동은 휴대폰의 밝게·어둡게 설정을 따르고, 밝게·어둡게는 한 가지로 고정합니다. 앱을 처음 열면 주당 운동 일수와 시작할 루틴을 묻는 안내가 나오며 건너뛸 수 있습니다.',
  '• 버전 줄을 누르면 "새로운 기능"이 열리고, 그 아래 앱 id 줄은 휴대폰이 받은 설치 설정을 보여 줍니다. 태블릿·데스크톱에서는 옆 메뉴 왼쪽 아래에도 버전과 업데이트 날짜가 보이고, 누르면 같은 목록이 열립니다.']},
 {id:'data',title:{en:'Where your data lives',ko:'데이터는 어디에 있나'},en:[
  '• Signed in with Google: in the app\'s Firebase project under your user ID, synced to every device you sign in on. The status line at the bottom of Settings says "Uploading changes…" until every change has reached the server, then "Synced to Firebase".',
  '• Without an account: in this browser\'s storage on this device only. A different browser, device or address is a different storage — move data with Export / Import JSON.',
  '• Privacy: My Fit has no ads and no tracking. It keeps your plans, workout logs, check-ins (body weight, sleep, notes) and settings — in this browser and, if you sign in with Google, in the app\'s Firebase project under your user ID. Nothing is sent anywhere else. Export JSON or CSV any time.',
  '• Deleting data: Settings → Reset all data deletes plans, workout logs, check-ins, notes and your exercise edits — on this device, and in your account if you are signed in. It keeps saved routines, settings and the automatic backups (the last 14 daily snapshots of a signed-in account). Signing out or removing the app does not delete what is stored in your account; to have the account\'s data and backups removed completely, contact the app\'s support.',
  '• Never use the browser\'s "Clear site data" for this address: it also wipes other apps that share the address (on the old GitHub address, ClassDesk and StudyDesk).'],
  ko:[
  '• 구글 로그인: 앱의 Firebase 프로젝트에 사용자별로 저장되고 로그인한 모든 기기에 동기화됩니다. 설정 맨 아래 상태 줄이 "변경 올리는 중…"이면 아직 서버에 다 안 올라간 것이고, "Firebase에 동기화됨"이면 끝난 것입니다.',
  '• 계정 없이 사용: 이 기기의 이 브라우저 저장소에만 있습니다. 다른 브라우저·기기·주소는 저장소가 다르므로 JSON 내보내기/가져오기로 옮깁니다.',
  '• 개인정보: My Fit에는 광고와 추적이 없습니다. 계획·운동 기록·체크인(체중·수면·메모)·설정만 이 브라우저에 저장하고, 구글로 로그인하면 앱의 Firebase 프로젝트에도 사용자별로 저장합니다. 다른 곳으로는 보내지 않습니다. JSON·CSV로 언제든 내보낼 수 있습니다.',
  '• 데이터 삭제: 설정 → 모든 데이터 초기화는 계획·운동 기록·체크인·메모·운동 편집 내용을 이 기기에서, 로그인했다면 계정에서도 지웁니다. 저장한 루틴, 설정, 자동 백업(로그인 계정의 최근 14일치 스냅샷)은 남습니다. 로그아웃하거나 앱을 지워도 계정에 저장된 데이터는 지워지지 않으니, 계정 데이터와 백업까지 모두 지우려면 앱 지원 창구에 요청하세요.',
  '• 이 주소에 대해 브라우저의 "사이트 데이터 삭제"는 누르지 마세요. 같은 주소를 쓰는 다른 앱(예전 GitHub 주소의 ClassDesk·StudyDesk) 데이터까지 지워집니다.']},
 {id:'move',title:{en:'Moving from the old address',ko:'예전 주소에서 옮기기'},en:[
  'The old address (amber67-git.github.io/my-fit) shares its storage and its "installed app" slot with other apps, which is why installing there failed. Do this once per device:',
  '• 1. Open the old address online where you used it (on iPhone, inside the home-screen app if that is where you worked). Signed in with Google: wait until the status line says "Synced to Firebase" (it only means this device\'s changes were sent), then check that your records look complete, including days logged on other devices; if you cannot confirm that, put off signing in at the new address. Without an account: nothing to wait for. Either way, download a backup from the notice.',
  '• 2. Open the new address. With Google sign-in, just sign in — do not import. Without an account, Settings → Import JSON → choose the backup file. If you already logged workouts at the new address without an account and now want to sign in, export them first: signing in loads the account\'s records and local ones are not merged.',
  '• 3. Check your data is there, then install the app from the new address. On iPhone the home-screen app has its own storage, separate from Safari: open the installed app and check again — signed in with Google, sign in inside it; without an account, import the backup file again inside it. If Google sign-in does not complete inside the installed app (iOS can block it there), choose "Use without account" and import the backup file inside it. Workouts logged there stay on this device only and are not synced to the account; log workouts that must sync in Safari. Before you later sign in inside that app, export its data, and also export the account data from Safari: wait for "Synced to Firebase" (it only means your own changes were sent), check that the records look complete, then export; then sign in while online. If you cannot confirm the records are complete, put off the sign-in. Records are not merged: signing in loads the account\'s records, and on a bad connection local records can overwrite account records for the same dates.',
  '• 4. Delete the old My Fit app from the phone (app only — never "Clear site data"). In Chrome, chrome://webapks should show My Fit with the new address.'],
  ko:[
  '예전 주소(amber67-git.github.io/my-fit)는 다른 앱과 저장소와 "설치된 앱" 자리를 같이 써서 설치가 막혔습니다. 기기마다 한 번씩 아래대로 합니다.',
  '• 1. 데이터를 쓰던 곳(아이폰은 홈 화면 앱에서 썼다면 그 앱 안)에서 예전 주소를 인터넷 연결 상태로 엽니다. 구글 로그인을 쓰면 상태 줄이 "Firebase에 동기화됨"이 될 때까지 기다리고(이 기기의 변경이 전송됐다는 뜻일 뿐입니다), 다른 기기에서 기록한 날까지 기록이 빠짐없이 보이는지 확인합니다. 확인할 수 없으면 새 주소에서의 로그인을 미루세요. 계정 없이 썼다면 기다릴 것 없이 바로 진행합니다. 어느 쪽이든 안내 띠에서 백업을 받아 둡니다.',
  '• 2. 새 주소를 엽니다. 구글 로그인을 쓰면 로그인만 하고 가져오기는 하지 않습니다. 계정 없이 썼다면 설정 → JSON 가져오기 → 백업 파일 고르기. 새 주소에서 이미 계정 없이 운동을 기록했는데 이제 로그인하려면 먼저 내보내 두세요. 로그인하면 계정의 기록을 불러오고 로컬 기록은 합쳐지지 않습니다.',
  '• 3. 데이터가 다 보이는지 확인한 뒤 새 주소에서 앱을 설치합니다. 아이폰의 홈 화면 앱은 Safari와 저장소가 따로라서, 설치한 앱을 열어 다시 확인합니다. 구글 로그인은 그 앱 안에서 로그인하고, 계정 없이 쓰면 그 앱 안에서 백업 파일을 다시 가져옵니다. 설치한 앱 안에서 구글 로그인이 끝나지 않으면(iOS가 막을 수 있음) "계정 없이 사용"을 고르고 그 앱 안에서 백업 파일을 가져옵니다. 거기서 기록한 운동은 이 기기에만 남고 계정에 동기화되지 않으니, 동기화가 필요한 운동은 Safari에서 기록합니다. 나중에 그 앱 안에서 로그인하려면 먼저 그 앱의 데이터를 내보내고, Safari에서도 계정 데이터를 따로 내보냅니다. "Firebase에 동기화됨"은 내 변경이 전송됐다는 뜻일 뿐이니, 그 표시가 뜬 뒤 기록이 빠짐없이 보이는지 확인하고 내보내세요. 그런 다음 인터넷이 연결된 상태에서 로그인합니다. 기록이 다 있는지 확인할 수 없으면 로그인을 미루세요. 기록은 합쳐지지 않습니다. 로그인하면 계정의 기록을 불러오고, 연결이 나쁘면 같은 날짜의 계정 기록이 로컬 기록으로 덮어써질 수 있습니다.',
  '• 4. 예전 My Fit 앱을 휴대폰에서 지웁니다(앱만, "사이트 데이터 삭제"는 금지). 크롬 chrome://webapks에 My Fit이 새 주소로 나오면 성공입니다.']},
 {id:'faq',title:{en:'FAQ',ko:'자주 묻는 질문'},en:[
  {q:'Chrome says "This app is already installed" and then "Could not open app".',a:'Another app on the same address is installed (current Android Chrome allows one web app per address). Install from the new address instead; then remove the old My Fit from Settings → Apps. Do not clear site data.'},
  {q:'The new address is empty.',a:'Each address has its own storage. Sign in with the same Google account, or import the backup you downloaded at the old address.'},
  {q:'My streak dropped although I worked out.',a:'Streak counts weeks that met the weekly goal, not days. Check the goal in Settings; a week in progress keeps the previous count until it ends.'},
  {q:'A workout after midnight landed on the wrong day.',a:'The day starts at 04:00. Anything finished before 04:00 belongs to the previous day on purpose.'},
  {q:'Weights look wrong after switching kg/lb.',a:'Switching converts every stored weight and body weight. Switch back if you did not mean to.'},
  {q:'What does "Deload week" / "Back after a break" on the weekly card mean?',a:'Smart mode lowered this week\'s weights by your chosen percentage: after several weeks on goal, or after a break longer than the days you set. Both can be turned off in Settings.'},
  {q:'The muscle map shows only the front (or only the back).',a:'It shows the side where the primary muscles are. Exercises that work both (e.g. squats) show both; the weekly map in the report always shows both.'},
  {q:'Is the app updated automatically?',a:'Yes. When a new version is ready the app tells you; reload or reopen it. The version is at the bottom of Settings.'}],
  ko:[
  {q:'크롬이 "This app is already installed"라고 하고 누르면 "Could not open app"이 떠요.',a:'같은 주소의 다른 앱이 설치돼 있어서입니다(현재 안드로이드 크롬은 주소당 웹앱 하나만 설치). 새 주소에서 설치하고, 예전 My Fit은 설정 → 애플리케이션에서 지우세요. 사이트 데이터 삭제는 하지 마세요.'},
  {q:'새 주소를 열었더니 비어 있어요.',a:'주소마다 저장소가 따로입니다. 같은 구글 계정으로 로그인하거나, 예전 주소에서 받은 백업을 가져오세요.'},

function renderGuide(){ const ko=S.settings.lang==='ko'; const L=k=>ko?k.ko:k.en;
  const item=x=>typeof x==='string'?(x.startsWith('• ')?`<li>${esc(x.slice(2))}</li>`:`<p>${esc(x)}</p>`):`<dt>${esc(x.q)}</dt><dd>${esc(x.a)}</dd>`;
  const body=arr=>{ let h='',list=false,dl=false; arr.forEach(x=>{ const isLi=typeof x==='string'&&x.startsWith('• '), isDl=typeof x!=='string'; if(list&&!isLi){h+='</ul>';list=false;} if(dl&&!isDl){h+='</dl>';dl=false;} if(isLi&&!list){h+='<ul>';list=true;} if(isDl&&!dl){h+='<dl class="faq">';dl=true;} h+=item(x); }); if(list)h+='</ul>'; if(dl)h+='</dl>'; return h; };
  const stamp=(ko?'기준 버전: v':'Guide written against version: v')+GUIDE_VERSION+' · '+(ko?'FAQ 기준일: ':'FAQ current as of: ')+GUIDE_DATE+(GUIDE_VERSION!==APP_VERSION?' · '+(ko?'앱 버전 v'+APP_VERSION:'app is v'+APP_VERSION):'');
  view.innerHTML=`<div class="stack guide">
   <div class="row"><button class="icon-btn" data-act="back" aria-label="${esc(t('a11y_back'))}">${ICO.back}</button><div class="grow"><h2>${esc(t('guide'))}</h2><div class="cap num">${esc(stamp)}</div></div></div>
   <div class="chips">${GUIDE.map(s=>`<a class="chip" href="#g-${s.id}">${esc(L(s.title))}</a>`).join('')}<a class="chip" href="#g-history">${esc(t('guide_history'))}</a></div>
   ${GUIDE.map(s=>`<section class="rpt-sec" id="g-${s.id}"><h3>${esc(L(s.title))}</h3>${body(ko?s.ko:s.en)}</section>`).join('')}
   <section class="rpt-sec" id="g-history"><h3>${esc(t('guide_history'))}</h3><div class="cap">${esc(t('guide_history_sub'))}</div><dl class="hist">${GUIDE_HISTORY.map(h=>`<dt class="num">v${esc(h.v)} <span class="cap">${esc(h.date)}</span></dt><dd>${esc(L(h))}</dd>`).join('')}</dl><button class="btn sec" data-act="changelog">${esc(t('whats_new'))}</button></section>
  </div>`; }

// ---------- dates ----------
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
// The app's day starts at 04:00: until then "today" is still the previous calendar day (late workouts stay on the evening's date).
const DAY_START_HOUR=4; const appNow=()=>{ const d=new Date(); if(d.getHours()<DAY_START_HOUR)d.setDate(d.getDate()-1); return d; }; // local calendar shift, DST-safe
const todayKey=()=>keyOf(appNow());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const startOfWeek=d=>{const x=new Date(d);x.setHours(0,0,0,0);const w=(x.getDay()+6)%7;return addDays(x,-w);};
const locale=()=>S.settings.lang==='ko'?'ko-KR':'en-US';
const fmtMD=d=>new Intl.DateTimeFormat(locale(),{month:'short',day:'numeric'}).format(d);
const fmtLong=d=>new Intl.DateTimeFormat(locale(),{month:'long',day:'numeric',weekday:'short'}).format(d);
const fmtMonth=d=>new Intl.DateTimeFormat(locale(),{year:'numeric',month:'long'}).format(d);
const t=k=>{const L=I18N[S.settings.lang]||I18N.en;return (k in L)?L[k]:(I18N.en[k]??k);};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss=s=>{s=Math.max(0,Math.round(s));return pad(Math.floor(s/60))+':'+pad(s%60);};

function loadLocal(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw){const o=JSON.parse(raw);Object.assign(S,{exercises:o.exercises||[],routines:o.routines||[],settings:Object.assign(S.settings,o.settings||{}),plans:o.plans||{},logs:o.logs||{},body:o.body||{},notes:o.notes||{}});}}catch(e){}
  if(!S.exercises.length)S.exercises=DEFAULT_EXERCISES();
  if(mergeDefaults())saveLocal();
}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({exercises:S.exercises,routines:S.routines,settings:S.settings,plans:S.plans,logs:S.logs,body:S.body,notes:S.notes})); if(S.localSaveError){S.localSaveError=false; try{renderStatus();}catch(e2){}} return true;}catch(e){ S.localSaveError=true; try{renderStatus();}catch(e2){} return false;}}
const clean=o=>JSON.parse(JSON.stringify(o));
async function dbWrite(fn){ if(!DB)return; try{ const pending=fn(); trackPending(); /* after the write is queued: waitForPendingWrites only covers writes issued before it */ await pending; if(S.lastError){S.lastError=null;renderStatus();}}catch(e){ if(e&&(e.code==='invalid_argument'||e.code==='permission-denied')){S.canWrite=false;} S.lastError=((e&&(e.code||e.message))||'error').toString().slice(0,60); renderStatus(); toast(t('save_failed')); } }
const persist={
  exercises(){saveLocal();dbWrite(()=>DB.doc('app/exercises').set(clean(packExercises())));},
  settings(){saveLocal();dbWrite(()=>DB.doc('app/settings').set(clean(S.settings)));},
  routines(){saveLocal();dbWrite(()=>DB.doc('app/routines').set(clean({items:S.routines})));},
  plan(date){const ok=saveLocal();const p=S.plans[date];dbWrite(()=>p&&p.items.length?DB.doc('plans/'+date).set(clean({date,items:p.items})):DB.doc('plans/'+date).delete());return ok;},
  log(date){saveLocal();const l=S.logs[date];dbWrite(()=>l&&l.entries.length?DB.doc('logs/'+date).set(clean({date,entries:l.entries})):DB.doc('logs/'+date).delete());},
  body(date){const ok=saveLocal();const b=S.body[date];dbWrite(()=>b?DB.doc('body/'+date).set(clean(Object.assign({date},b))):DB.doc('body/'+date).delete());return ok;},
  notes(key){const ok=saveLocal();const v=S.notes[key];dbWrite(()=>v?DB.doc('notes/'+key).set(clean({week:key,text:v})):DB.doc('notes/'+key).delete());return ok;}
};

function packExercises(){ const defs=DEFAULT_EXERCISES(); const byId=Object.fromEntries(defs.map(d=>[d.id,d])); const custom=[],overrides={};
  S.exercises.forEach(e=>{ const d=byId[e.id]; if(!d){custom.push(e);return;} const o={}; ['nameEn','nameKo','icon','type','muscle','equip','mode','sets','reps','weight','rest','minutes','hidden'].forEach(k=>{ if(JSON.stringify(e[k])!==JSON.stringify(d[k]))o[k]=e[k]; }); if(JSON.stringify(e.steps)!==JSON.stringify(d.steps))o.steps=e.steps; if(Object.keys(o).length)overrides[e.id]=o; });

function rptGrowth(entries){ const by={}; entries.forEach(r=>{ if(r.e.mode!=='sets'||!r.best)return; (by[r.e.exId]=by[r.e.exId]||[]).push({d:r.date,v:r.best,ton:r.ton}); }); const rows=[]; Object.keys(by).forEach(id=>{ const a=by[id].sort((x,y)=>x.d<y.d?-1:1); const first=a[0],last=a[a.length-1]; if(a.length<2)return; const days=(parseKey(last.d)-parseKey(first.d))/864e5; if(days<6)return; const ch=(last.v-first.v)/first.v; rows.push({id,n:a.length,first:first.v,last:last.v,ch,perWeek:ch/(days/7),series:a}); }); rows.sort((x,y)=>y.ch-x.ch); return rows; }
function rptBuild(){ const {from,to,days}=rptRange(); const E=rptEntries(from,to); const dates=[...new Set(E.map(r=>r.date))].sort(); const u=S.settings.unit; const sess=dates.length; const ton=E.reduce((a,r)=>a+r.ton,0), min=E.reduce((a,r)=>a+r.min,0); const pFrom=from<'1000'?(Object.keys(S.plans).sort()[0]||to):from; const planned=plannedDays(pFrom,to), doneD=doneDays(pFrom,to); const adh=planned?Math.round(100*Math.min(doneD,planned)/planned):null; const conds=E.map(r=>r.e.condition).filter(c=>c>0); const avgCond=conds.length?conds.reduce((a,b)=>a+b,0)/conds.length:null; const rpes=E.map(r=>r.e.rpe).filter(c=>c>0); const avgRpe=rpes.length?rpes.reduce((a,b)=>a+b,0)/rpes.length:null;
  // weeks
  const wk={}; E.forEach(r=>{ const k=weekKeyOf(r.date); wk[k]=wk[k]||{ton:0,min:0,d:new Set()}; wk[k].ton+=r.ton; wk[k].min+=r.min; wk[k].d.add(r.date); }); const firstLog=Object.keys(S.logs).sort()[0]; const wFrom=startOfWeek(parseKey(from<'1000'?(firstLog||to):from)); const wTo=startOfWeek(appNow()); const weeks=[]; for(let d=wFrom; d<=wTo && weeks.length<260; d=addDays(d,7)){ const k=keyOf(d); const w=wk[k]||{ton:0,min:0,d:new Set()}; weeks.push({k,ton:w.ton,min:w.min,sess:w.d.size}); }
  // muscles
  const mus={}; MUSCLES.forEach(m=>mus[m]={sets:0,min:0}); E.forEach(r=>{ const m=r.ex&&r.ex.muscle; if(!mus[m])return; mus[m].sets+=r.done.length; if(r.e.mode==='time')mus[m].min+=r.min; });
  const subSets={}; E.forEach(r=>{ if(!r.ex)return; const tg=targetsOf(r.ex); const n=r.e.mode==='time'?0:r.done.length; tg.p.forEach(k=>{ subSets[k]=(subSets[k]||0)+n; }); }); const subTop=Object.keys(subSets).filter(k=>subSets[k]>0).sort((a,b)=>subSets[b]-subSets[a]);
  const grp={push:['chest','shoulders'],pull:['back'],legs:['legs','glutes','innerthigh','outerthigh'],core:['core']}; const grpSets={}; Object.keys(grp).forEach(g=>grpSets[g]=grp[g].reduce((a,m)=>a+(mus[m]?mus[m].sets:0),0));
  // weekday / time of day / durations

  // set intervals vs planned rest
  let gaps=[],plannedRest=[]; E.forEach(r=>{ const ts=r.done.map(s=>s.t).filter(Boolean).sort((a,b)=>a-b); for(let i=1;i<ts.length;i++){ const g=(ts[i]-ts[i-1])/1000; if(g>5&&g<900)gaps.push(g); } const it=planOf(r.date).find(x=>x.id===r.e.planItemId); if(it&&it.rest>0)plannedRest.push(it.rest); }); const avgGap=gaps.length?gaps.reduce((a,b)=>a+b,0)/gaps.length:null; const avgRest=plannedRest.length?plannedRest.reduce((a,b)=>a+b,0)/plannedRest.length:null;
  // cardio

  // body
  const bodyKeys=Object.keys(S.body).filter(k=>k>=from&&k<=to).sort(); const wts=bodyKeys.map(k=>S.body[k].w).filter(v=>v>0); const latestW=(()=>{ const all=Object.keys(S.body).sort(); for(let i=all.length-1;i>=0;i--){ if(S.body[all[i]].w>0)return S.body[all[i]].w; } return null; })(); const sleeps=bodyKeys.map(k=>S.body[k].sleep).filter(v=>v>0); const avgSleep=sleeps.length?sleeps.reduce((a,b)=>a+b,0)/sleeps.length:null;
  // growth / strength / PRs
  const growth=rptGrowth(E); const bestBy={}; E.forEach(r=>{ if(r.e.mode!=='sets')return; const b=bestBy[r.e.exId]||{e1:0,reps:0,w:0,d:null,n:0}; b.n++; if(r.best>b.e1){b.e1=r.best;b.d=r.date;} const mw=Math.max(0,...r.done.map(s=>s.weight||0)); const mr=Math.max(0,...r.done.map(s=>s.reps||0)); if(mw>b.w)b.w=mw; if(mr>b.reps){b.reps=mr;if(!mw)b.d=r.date;} bestBy[r.e.exId]=b; }); const board=Object.keys(bestBy).map(id=>({id,ex:exById(id),...bestBy[id]})).filter(x=>x.ex&&x.e1>0).sort((a,b)=>b.e1-a.e1);
  const allBest={}; Object.keys(S.logs).forEach(k=>logOf(k).forEach(e=>{ const done=(e.sets||[]).filter(s=>s.done); const b=done.reduce((a,s)=>Math.max(a,e1rm(s.weight,s.reps)),0); const mr=Math.max(0,...done.map(s=>s.reps||0)); const cur=allBest[e.exId]||{e1:0,reps:0}; allBest[e.exId]={e1:Math.max(cur.e1,b),reps:Math.max(cur.reps,mr)}; }));

function rptText(R){ const ko=S.settings.lang==='ko'; const L=[]; const per={ '4w':ko?'최근 4주':'Last 4 weeks','12w':ko?'최근 12주':'Last 12 weeks','1y':ko?'최근 1년':'Last year','all':ko?'전체 기간':'All time'}[S.rptPeriod||'4w'];

  L.push(ko?`세션 ${R.sess}회 · 운동 ${fmtN(R.min)}분 · 볼륨 ${fmtN(R.ton)} ${R.u}·회${R.adh!=null?` · 계획 이행 ${R.adh}%`:''}`:`${R.sess} sessions · ${fmtN(R.min)} min · volume ${fmtN(R.ton)} ${R.u}·reps${R.adh!=null?` · plan kept ${R.adh}%`:''}`);
  if(R.avgCond!=null||R.avgRpe!=null){ const parts=[]; if(R.avgCond!=null)parts.push((ko?'평균 컨디션 ':'Avg feel ')+R.avgCond.toFixed(1)+'/5'); if(R.avgRpe!=null)parts.push((ko?'평균 RPE ':'avg RPE ')+R.avgRpe.toFixed(1)); L.push(parts.join(', ')); }

function rptCsv(){ const rows=[['date','exercise_id','exercise','type','muscle','equip','mode','set','reps','weight','unit','done','set_time','duration_sec','condition','rpe','distance_km','avg_hr','memo','set_rpe','set_kind']]; Object.keys(S.logs).sort().forEach(k=>logOf(k).forEach(e=>{ const ex=exById(e.exId); const base=[k,e.exId,ex?ex.nameEn:'',ex?ex.type:'',ex?ex.muscle:'',ex?ex.equip:'',e.mode]; if(e.mode==='sets'&&e.sets&&e.sets.length){ e.sets.forEach((s,i)=>rows.push(base.concat([i+1,s.reps,s.weight,S.settings.unit,s.done?1:0,(typeof s.t==='number'&&isFinite(s.t)&&s.t>0)?new Date(s.t).toISOString():'',e.duration||0,e.condition||'',e.rpe||'','','',e.memo||'',s.rpe||'',s.kind||'']))); } else rows.push(base.concat(['','','',S.settings.unit,1,'',e.duration||0,e.condition||'',e.rpe||'',e.distance||'',e.hr||'',e.memo||'','',''])); })); const body=[['date','weight','unit','sleep_h','note']].concat(Object.keys(S.body).sort().map(k=>[k,S.body[k].w||'',S.settings.unit,S.body[k].sleep||'',S.body[k].note||''])); const notes=[['week_start','note']].concat(Object.keys(S.notes).sort().map(k=>[k,S.notes[k]])); const q=v=>{ const isStr=typeof v==='string'; v=String(v==null?'':v); if(isStr&&/^[=+\-@\t\r]/.test(v))v="'"+v; return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }; const csv=(r)=>r.map(x=>x.map(q).join(',')).join('\n'); return '# sets\n'+csv(rows)+'\n\n# body\n'+csv(body)+'\n\n# weekly_notes\n'+csv(notes)+'\n'; }

function weekSummary(ws){ const a=keyOf(ws), b=keyOf(addDays(ws,6)); const days=new Set(); let ton=0, sec=0, sets=0; const mus={}; const best={};
  /* best of the week per exercise, kept separately for weighted sets (estimated 1RM) and bodyweight sets (reps / seconds) */
  Object.keys(S.logs).filter(k=>k>=a&&k<=b).forEach(k=>logOf(k).forEach(e=>{ days.add(k); sec+=e.duration||0; const ex=exById(e.exId); const done=(e.sets||[]).filter(s=>s.done); sets+=done.length; done.forEach(s=>{ if(s.weight>0)ton+=s.weight*s.reps; }); if(ex&&done.length)mus[ex.muscle]=(mus[ex.muscle]||0)+done.length;
    done.forEach(s=>{ const w=s.weight>0; const v=w?e1rm(s.weight,s.reps):s.reps; const g=best[e.exId]||(best[e.exId]={}); const key=w?'w':'b'; if(!g[key]||v>g[key].v)g[key]={v,w,s}; }); }));
  const prevBest=(id,w)=>{ let p=null; Object.keys(S.logs).filter(k=>k<a).forEach(k=>logOf(k).forEach(e=>{ if(e.exId!==id)return; (e.sets||[]).filter(s=>s.done&&((s.weight>0)===w)).forEach(s=>{ const v=w?e1rm(s.weight,s.reps):s.reps; if(p==null||v>p)p=v; }); })); return p; };
  const prs=[]; Object.keys(best).forEach(id=>{ const g=best[id]; const ex=exById(id); for(const c of [g.w,g.b].filter(Boolean)){ const p=prevBest(id,c.w); if(p!=null&&c.v>p+1e-9){ prs.push({id,ex,txt:c.w?c.s.weight+S.settings.unit+' × '+c.s.reps:c.s.reps+' '+repUnit(ex)}); break; } } });
  const top=Object.keys(mus).sort((x,y)=>mus[y]-mus[x]).slice(0,3).map(m=>({m,n:mus[m]}));
  return {a,b,sess:days.size,ton:Math.round(ton),min:Math.round(sec/60),sets,prs,top}; }

function smartDays(ws,n,fromDay){ fromDay=fromDay||0; if(S.settings.smartAlternate!==false&&n<=4){ let start=fromDay; if(fromDay===0&&planOf(keyOf(addDays(ws,-1))).length)start=1; const days=[]; for(let d=start;d<7&&days.length<n;d+=2)days.push(d); if(days.length===n)return {days,alt:true}; }
  const base=(DEFAULT_WD[n]||DEFAULT_WD[7]).filter(d=>d>=fromDay); if(base.length>=n)return {days:base.slice(0,n),alt:false}; const rest=[]; for(let d=fromDay;d<7&&rest.length<n;d++)rest.push(d); return {days:rest,alt:false}; }
const SPLIT_ROUTINE={full:'rt_full3',ul:'rt_ul',ppl:'rt_ppl',home:'rt_home',db:'rt_db'};
function smartPlan(ws){ const nAll=Math.min(7,Math.max(1,S.settings.weeklyGoal||3)); const isCur=keyOf(ws)===keyOf(startOfWeek(appNow())); const todayIdx=isCur?Math.round((parseKey(todayKey())-ws)/86400000):0; const doneBefore=isCur?[0,1,2,3,4,5,6].filter(i=>i<todayIdx&&planOf(keyOf(addDays(ws,i))).some(x=>x.status!=='planned')).length:0; const n=Math.max(0,nAll-doneBefore); const dd=smartDays(ws,n,todayIdx); const wd=dd.days;
  const since=keyOf(addDays(appNow(),-28)); const hist=Object.keys(S.logs).filter(k=>k>=since).flatMap(k=>logOf(k)); const used=new Set(hist.map(e=>e.exId));
  const cands=allRoutines(); let routine,starter=!used.size; const split=S.settings.smartSplit||'auto';
  if(split!=='auto'&&SPLIT_ROUTINE[split]) routine=cands.find(r=>r.id===SPLIT_ROUTINE[split]);
  else if(used.size){ const best=cands.map(r=>({r,score:r.days.flatMap(d=>d.exIds).filter(id=>used.has(id)).length})).sort((a,b)=>b.score-a.score)[0]; routine=best.score>0?best.r:null; }
  if(!routine) routine=cands.find(r=>r.id===(n<=3?'rt_full3':n===4?'rt_ul':'rt_ppl'))||cands[0];
  const prog=S.settings.smartProgress!==false; const step=S.settings.weightStep||(S.settings.unit==='lb'?5:2.5);
  // Lighter weeks: a return week after a break (no logs for returnGapDays) or a scheduled deload week (every deloadEvery-th week on goal)
  // Decided from data before this week only, so the decision does not flip once the user logs a workout in the planned week.
  const st=S.settings; const pctOf=v=>Math.min(50,Math.max(0,Math.round(Number(v)||0)))||10; const wsKey=keyOf(ws); const lastLogKey=Object.keys(S.logs).filter(k=>k<wsKey&&logOf(k).length).sort().pop(); const gapDays=lastLogKey?Math.round((ws-parseKey(lastLogKey))/86400000):0;
  const returning=!!(st.returnOn!==false&&isCur&&lastLogKey&&gapDays>=(Number(st.returnGapDays)||14)); const every=Math.max(2,Number(st.deloadEvery)||4); const stk=streakBefore(ws);
  const deload=!returning&&!!(st.deloadOn!==false&&isCur&&stk>0&&stk%every===every-1); const lighten=returning?pctOf(st.returnPct):deload?pctOf(st.deloadPct):0; const lightW=w=>Math.max(0,Math.round(w*(1-lighten/100)*2)/2);
  const changes=[]; const plan={};
  for(let i=0;i<n;i++){ const d=routine.days[i%routine.days.length]; const date=keyOf(addDays(ws,wd[i])); plan[date]=plan[date]||[];
    d.exIds.forEach(id=>{ const ex=exById(id); if(!ex||ex.hidden)return; const it={id:uid(),exId:ex.id,mode:ex.mode,minutes:ex.minutes,sets:ex.sets,reps:ex.reps,weight:ex.weight,rest:ex.rest??S.settings.restSec,status:'planned'};
      // lighter weeks: base = last record WITH completed sets before the week (or this week's if none), keep its sets/reps, scale weight (0 included)
      const doneOf=e=>(e&&e.sets||[]).filter(x=>x.done); const lastDone=(exId,before)=>{ const ks=Object.keys(S.logs).filter(k=>!before||k<=before).sort().reverse(); for(const k of ks){ const e=logOf(k).slice().reverse().find(x=>x.exId===exId&&(x.mode!=='sets'||doneOf(x).length)); if(e)return e; } return null; };
      const before=lighten?lastDone(ex.id,keyOf(addDays(ws,-1))):null; const thisWeek=lighten&&!before?lastDone(ex.id):null; const lightenHere=lighten&&!!before; const last=lighten?(before||thisWeek):prog?lastEntry(ex.id):null; if(last&&!plan[date].some(x=>x.exId===ex.id)){
        if(last.mode==='sets'&&it.mode==='sets'){ const done=doneOf(last);
          if(lighten&&done.length){ const w=Math.max(0,...done.map(x=>x.weight||0)); it.weight=lightenHere?lightW(w):w; it.sets=last.sets.length; it.reps=done[0].reps||it.reps; if(lightenHere&&w>0&&it.weight<w)it.why={k:returning?'return':'deload',p:Math.round((1-it.weight/w)*100)}; }
          else if(done.length&&done.length>=last.sets.length){ const w=Math.max(...done.map(x=>x.weight||0)); const r=Math.round(done.reduce((a,x)=>a+x.reps,0)/done.length);
            if(w>0){ if(prog&&r>=it.reps){ it.weight=Math.round((w+step)*10)/10; it.why={k:'up_w',d:step,r}; changes.push(exName(ex)+' +'+step+S.settings.unit); } else { it.weight=w; if(prog)it.why={k:'hold',r}; } } else if(prog&&r>=it.reps&&r<20){ it.reps=r+1; it.why={k:'up_r',r}; changes.push(exName(ex)+' +1 '+repUnit(ex)); } }
          else if(done.length){ it.weight=Math.max(...done.map(x=>x.weight||0)); } }
        else if(last.mode==='time'&&it.mode==='time'){ const lm=Math.max(1,Math.round(last.duration/60)); if(!lighten&&prog&&last.duration>=lm*60*0.9-30&&lm<ex.minutes*2){ it.minutes=Math.min(ex.minutes*2,lm+1); it.why={k:'up_m'}; changes.push(exName(ex)+' +1 '+t('min')); } else it.minutes=Math.max(it.minutes,lm); } }
      plan[date].push(it); }); }
  return {plan,routine,starter,changes:[...new Set(changes)],n:nAll,alt:dd.alt,keep:isCur,returning,deload,lighten,gapDays}; }
function applySmart(){ const ws=parseKey(S.weekStart); const r=smartPlan(ws); for(let i=0;i<7;i++){ const k=keyOf(addDays(ws,i)); const keep=r.keep?planOf(k).filter(x=>x.status!=='planned'):[]; if(planOf(k).length!==keep.length||!planOf(k).length&&r.plan[k]){ S.plans[k]={items:keep}; } } Object.keys(r.plan).forEach(k=>{ const keep=planOf(k).filter(x=>x.status!=='planned'); S.plans[k]={items:keep.concat(r.plan[k])}; }); for(let i=0;i<7;i++){ const k=keyOf(addDays(ws,i)); persist.plan(k); } r.week=S.weekStart; S.smartInfo=r; toast(t('applied')); render(); }

// ---------- Backups (db only) ----------
async function makeBackup(force){ if(!DB||!S.canWrite)return false; const k=todayKey();
  try{ if(!force){ const snap=await DB.doc('backups/'+k).get(); if(snapExists(snap))return false; } }catch(e){}
  const limit=S.backend==='db'?200000:900000;
  const build=(days)=>{ const cut=keyOf(addDays(appNow(),-days)); const pick=o=>Object.fromEntries(Object.entries(o).filter(([d])=>d>=cut)); return {kind:'data',date:k,at:Date.now(),days,settings:S.settings,routines:S.routines,plans:pick(S.plans),logs:pick(S.logs),body:S.body,notes:S.notes,planDays:Object.keys(S.plans).length,logDays:Object.keys(S.logs).length}; };
  let body=null; for(const days of [730,365,180,90,45]){ const b=build(days); if(JSON.stringify(b).length<limit){body=b;break;} }
  if(!body){ S.backupError=true; return false; }
  try{ await DB.doc('backups/'+k).set(clean(body)); await DB.doc('backups/'+k+'-lib').set(clean(Object.assign({kind:'lib',date:k},packExercises()))); S.backupError=false; }catch(e){ S.backupError=true; return false; }
  try{ const cutoff=keyOf(addDays(appNow(),-14)); const old=await DB.collection('backups').get(); for(const d of old.docs){ const b=d.data()||{}; if((b.date||'')<cutoff){ try{await DB.doc('backups/'+d.id).delete();}catch(e){} } } }catch(e){}
  return true; }
async function openBackups(){ showSheet(`<h2 style="margin-bottom:4px">${esc(t('backups'))}</h2><div class="cap" style="margin-bottom:12px">${esc(t('auto_backup_note'))}</div><div id="bklist"><div class="empty">…</div></div>${DB&&S.canWrite?`<button class="btn sec" style="margin-top:12px" id="bknow">${esc(t('backup_now'))}</button>`:''}`);
  $('#bknow')?.addEventListener('click',async()=>{ const ok=await makeBackup(true); toast(ok?t('backed_up'):t('backup_failed')); fill(); });
  async function fill(){ if(!DB){$('#bklist').innerHTML=`<div class="empty">${esc(t('local_only'))}</div>`;return;}
    let docs=[]; try{ const q=await DB.collection('backups').get(); docs=q.docs.filter(d=>!d.id.endsWith('-lib')).slice().sort((a,b)=>(b.data().date||'').localeCompare(a.data().date||'')).slice(0,30); }catch(e){ $('#bklist').innerHTML=`<div class="empty">${esc(t('backup_failed'))}</div>`; return; }

    $('#bklist').querySelectorAll('[data-bk]').forEach(b=>b.addEventListener('click',()=>confirmSheet(t('confirm_restore'),t('restore'),()=>restoreBackup(b.dataset.bk),true))); }
  fill(); }
async function restoreBackup(id){ try{ const d=await DB.doc('backups/'+id).get(); const l=await DB.doc('backups/'+id+'-lib').get(); if(!snapExists(d)){toast(t('import_fail'));return;} const b=d.data();
    const oldPlans=Object.keys(S.plans), oldLogs=Object.keys(S.logs), oldBody=Object.keys(S.body), oldNotes=Object.keys(S.notes);
    S.settings=Object.assign({},S.settings,b.settings||{}); S.routines=(b.routines||[]).map(x=>Object.assign({},x)); S.plans=JSON.parse(JSON.stringify(b.plans||{})); S.logs=JSON.parse(JSON.stringify(b.logs||{})); if(b.body)S.body=JSON.parse(JSON.stringify(b.body)); if(b.notes)S.notes=JSON.parse(JSON.stringify(b.notes));
    if(snapExists(l)){ const ld=l.data(); S.exercises=ld.v===2?unpackExercises(ld):Array.isArray(ld.exercises)?ld.exercises.map(x=>Object.assign({},x)):S.exercises; mergeDefaults(); }
    persist.settings();persist.routines();persist.exercises(); new Set([...oldPlans,...Object.keys(S.plans)]).forEach(k=>persist.plan(k)); new Set([...oldLogs,...Object.keys(S.logs)]).forEach(k=>persist.log(k)); if(b.body)new Set([...oldBody,...Object.keys(S.body)]).forEach(k=>persist.body(k)); if(b.notes)new Set([...oldNotes,...Object.keys(S.notes)]).forEach(k=>persist.notes(k));
    toast(t('restored')); render(); }catch(e){ toast(t('import_fail')); } }

function openRoutine(id){ const r=allRoutines().find(x=>x.id===id); if(!r)return; const wd=t('week_days'); const map=(DEFAULT_WD[r.days.length]||DEFAULT_WD[7]).slice(0,r.days.length);
  const ws=S.weekStart?parseKey(S.weekStart):startOfWeek(appNow()); if(!S.weekStart)S.weekStart=keyOf(ws);

  const dayHtml=(d,i)=>`<div class="tile stack" style="gap:8px"><div class="row between"><b>${esc(dayLabel(d))}</b><div class="seg" data-day="${i}">${wd.map((w,j)=>`<button data-wd="${j}" class="${map[i]===j?'on':''}" style="padding:4px 7px">${esc(w)}</button>`).join('')}</div></div><div class="cap">${esc(d.exIds.map(x=>{const e=exById(x);return e?exName(e):'';}).filter(Boolean).join(' · '))}</div></div>`;
  showSheet(`<h2>${esc(rtName(r))}</h2><div class="cap" style="margin:4px 0 12px">${esc(rtDesc(r))}</div><div class="stack" style="gap:8px">${r.days.map(dayHtml).join('')}</div>
