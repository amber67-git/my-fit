    <label class="row" style="gap:8px;margin-top:10px"><input type="checkbox" id="rt-repeat" style="width:auto" ${S.settings.repeatRoutine&&S.settings.repeatRoutine.id===r.id?'checked':''}><span class="nm">${esc(t('repeat_weekly'))}</span></label>
    ${r.builtin?'':`<button class="btn ghost danger" id="rt-del" style="margin-top:8px">${esc(t('delete_routine'))}</button>`}`);
  const setRepeat=()=>{ const on=!!($('#rt-repeat')&&$('#rt-repeat').checked); const cur=S.settings.repeatRoutine; if(on){ S.settings.repeatRoutine={id:r.id,map:map.slice(),applied:keyOf(ws)}; } else if(cur&&cur.id===r.id){ delete S.settings.repeatRoutine; } persist.settings(); };
  $('#sheet').addEventListener('click',e=>{ const w=e.target.closest('[data-wd]'); if(w){const di=+w.closest('[data-day]').dataset.day; map[di]=+w.dataset.wd; w.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===w)); return;}

    if(e.target.id==='rt-del'){S.routines=S.routines.filter(x=>x.id!==r.id);persist.routines();closeSheet();render();} }); }
function saveWeekAsRoutine(){ const ws=parseKey(S.weekStart); const wd=t('week_days'); const days=[]; for(let i=0;i<7;i++){const items=planOf(keyOf(addDays(ws,i))); if(items.length)days.push({labelEn:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i],labelKo:wd[i],exIds:items.map(it=>it.exId)});}

  showSheet(`<h2 style="margin-bottom:10px">${esc(t('save_week_routine'))}</h2><div class="field"><label>${esc(t('routine_name'))}</label><input id="rtname" value="${esc(t('mine'))} ${S.routines.length+1}"></div><button class="btn pri" style="margin-top:12px" id="rtsave">${esc(t('save'))}</button>`);

function saveExercise(){ const e=S.editEx; if(!e.nameEn.trim()&&!e.nameKo.trim()){toast(t('name_required'));return;} if(!e.nameEn.trim())e.nameEn=e.nameKo; if(!e.nameKo.trim())e.nameKo=e.nameEn;

  if(e.id){const i=S.exercises.findIndex(x=>x.id===e.id);S.exercises[i]=e;}else{e.id='ex_'+uid();S.exercises.push(e);}
  persist.exercises(); S.editDirty=false; S.sub='library'; toast(t('saved')); render(); }

// ---------- sheets ----------
function stepCards(ex){ const ko=S.settings.lang==='ko'; const steps=(ex.steps||[]).slice(0,3).map((s,i)=>({s,i})).filter(({s})=>(s.titleEn||s.titleKo||s.cueEn||s.cueKo||'').trim()); return steps.map(({s,i})=>{ const title=ko?(s.titleKo||s.titleEn):(s.titleEn||s.titleKo); const cue=ko?(s.cueKo||s.cueEn):(s.cueEn||s.cueKo); const mist=ko?(s.mistakeKo||s.mistakeEn):(s.mistakeEn||s.mistakeKo); const tipLike=['stretch','cooldown','warmup','dynamic'].includes(ex.type); return `<div class="sc"><div class="sfig">${figSvg(ex,140,i)}</div><div class="sk">${esc(t('step'))} ${i+1}${title?' · '+esc(title):''}</div><div class="scue">${esc(cue||'')}</div>${mist?`<div class="smis">${esc(t(tipLike?'tip':'mistake'))}: ${esc(mist)}</div>`:''}</div>`; }).join(''); }
function showSheet(html){ closeSheet(); $('#layer').innerHTML=`<div class="backdrop" data-act="close-sheet"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"><div class="grip"></div>${html}</div>`; const sh=$('#sheet'); if(sh)sh.focus({preventScroll:true}); }
function closeSheet(){ $('#layer').innerHTML=''; }
function confirmSheet(msg,okLabel,onOk,danger){ showSheet(`<p style="margin:4px 0 16px;font-weight:600">${esc(msg)}</p><div class="stack" style="gap:8px"><button class="btn ${danger?'sec danger':'pri'}" id="ok">${esc(okLabel)}</button><button class="btn ghost" data-act="close-sheet">${esc(t('cancel'))}</button></div>`); $('#ok').addEventListener('click',()=>{closeSheet();onOk();}); }

// ---------- Perform flow ----------
const P={active:false,queue:[],idx:0,stage:'prepare',timer:null,restTimer:null,lock:null};
function startQueue(q){ if(!q.length)return; q.forEach(x=>{ const it=planOf(x.date).find(i=>i.id===x.id); if(it)x.snap=Object.assign({},it); }); Object.assign(P,{active:true,queue:q,idx:0}); enterPrepare(); }
function saveP(){ try{ if(P.active)localStorage.setItem('wwt.perform',JSON.stringify({at:Date.now(),queue:P.queue,idx:P.idx,stage:P.stage==='complete'?'perform':P.stage,sets:P.sets,startedAt:P.startedAt,endAt:P.endAt,remaining:P.remaining,total:P.total,memo:P.memo,pausedMs:P.pausedMs,paused:P.paused})); else localStorage.removeItem('wwt.perform'); }catch(e){} }
function checkResume(){ let saved=null; try{ saved=JSON.parse(localStorage.getItem('wwt.perform')||'null'); }catch(e){} if(!saved||Date.now()-saved.at>6*3600*1000){ try{localStorage.removeItem('wwt.perform');}catch(e){} return; }
  showSheet(`<p style="margin:4px 0 16px;font-weight:600">${esc(t('resume_q'))}</p><div class="stack" style="gap:8px"><button class="btn pri" id="rs-yes">${esc(t('resume'))}</button><button class="btn ghost" id="rs-no">${esc(t('discard_ex'))}</button></div>`);
  $('#rs-no').addEventListener('click',()=>{closeSheet();try{localStorage.removeItem('wwt.perform');}catch(e){}});
  $('#rs-yes').addEventListener('click',()=>{ closeSheet(); Object.assign(P,{active:true,queue:saved.queue,idx:saved.idx,stage:'prepare'}); if(saved.stage==='perform'){ P.stage='perform'; P.sets=saved.sets; P.startedAt=saved.startedAt; P.memo=saved.memo||''; P.pausedMs=saved.pausedMs||0; P.paused=false; const {it}=curItem(); if(it&&it.mode==='time'){ P.total=saved.total; P.remaining=Math.max(0,Math.round((saved.endAt-Date.now())/1000)); P.endAt=Date.now()+P.remaining*1000; P.timer=setInterval(tick,500); } P.restRemaining=0; keepAwake(); renderPerform(); } else enterPrepare(); }); }
function curItem(){ const q=P.queue[P.idx]; if(!q)return {date:todayKey(),it:null,ex:null}; const it=planOf(q.date).find(x=>x.id===q.id)||q.snap||null; return {date:q.date,it,ex:it?exById(it.exId):null}; }
async function keepAwake(){ try{ if(!P.lock&&navigator.wakeLock){ P.lock=await navigator.wakeLock.request('screen'); P.lock.addEventListener('release',()=>{P.lock=null;}); } }catch(e){ P.lock=null; } }
function releaseAwake(){ try{ if(P.lock){P.lock.release();P.lock=null;} }catch(e){} }
function buzz(pat){ try{ if(navigator.vibrate)navigator.vibrate(pat||[150,80,150]); }catch(e){} }
function enterPrepare(){ stopTimers(); P.stage='prepare'; renderPerform(); saveP(); }
function enterPerform(){ const {it,ex,date}=curItem(); if(!it)return exitPerform(); stopTimers(); P.stage='perform'; P.startedAt=Date.now(); P.paused=false; P.pausedMs=0; P.memo=''; keepAwake();
  if(it.mode==='time'){ P.remaining=it.minutes*60; P.total=P.remaining; P.endAt=Date.now()+P.remaining*1000; P.timer=setInterval(tick,500); }
  else { P.sets=warmupSets(it,ex); for(let i=0;i<it.sets;i++){ P.sets.push({reps:it.reps,weight:it.weight,done:false}); } P.restRemaining=0; P.restEndAt=0; }
  renderPerform(); saveP(); }
function tick(){ if(P.paused)return; P.remaining=Math.max(0,Math.round((P.endAt-Date.now())/1000)); const el=$('#big'); if(el){el.textContent=mmss(P.remaining);} const r=$('#ring'); if(r)r.style.setProperty('--p',(100-P.remaining/P.total*100)+'%'); if(P.remaining<=0){ stopTimers(); buzz([300,100,300,100,300]); finishPerform(); } }
function restTick(){ P.restRemaining=Math.max(0,Math.round((P.restEndAt-Date.now())/1000)); const el=$('#restt'); if(el)el.textContent=mmss(P.restRemaining); if(P.restRemaining<=0){ clearInterval(P.restTimer);P.restTimer=null; const box=$('#restbox'); if(box)box.hidden=true; buzz(); } }
function startRest(sec){ P.restRemaining=sec; P.restEndAt=Date.now()+sec*1000; if(P.restTimer)clearInterval(P.restTimer); P.restTimer=setInterval(restTick,500); }
function stopTimers(){ if(P.timer){clearInterval(P.timer);P.timer=null;} if(P.restTimer){clearInterval(P.restTimer);P.restTimer=null;} stopHold(); }
function warmupSets(it,ex){ if(!S.settings.warmupOn||isHoldEx(ex)||ex.type!=='strength')return []; const min=S.settings.unit==='lb'?45:20; if(!(it.weight>=min))return []; const st=S.settings.weightStep||(S.settings.unit==='lb'?5:2.5); const r=w=>Math.max(st,Math.round(w/st)*st); return [{reps:8,weight:r(it.weight*.5),done:false,warm:true},{reps:5,weight:r(it.weight*.7),done:false,warm:true}]; }
function stopHold(){ if(P.hold){ if(P.hold.timer)clearInterval(P.hold.timer); P.hold=null; } }
function holdTick(){ if(!P.hold)return; const el=document.querySelector('#perf [data-p="hold"][data-i="'+P.hold.i+'"]'); const sec=Math.round((Date.now()-P.hold.at)/1000); if(el)el.textContent='■ '+mmss(sec); if(!P.hold.buzzed&&P.hold.target>0&&sec>=P.hold.target){ P.hold.buzzed=true; buzz([200,80,200]); } }
function holdToggle(i){ const {it}=curItem(); const s=P.sets[i]; if(!s||s.done)return;
  if(P.hold&&P.hold.i===i){ const sec=Math.max(1,Math.round((Date.now()-P.hold.at)/1000)); stopHold(); s.reps=sec; s.done=true; s.t=Date.now(); if(it&&it.rest>0&&i<P.sets.length-1)startRest(it.rest); }
  else { stopHold(); P.hold={i,at:Date.now(),target:s.reps||0,buzzed:false}; P.hold.timer=setInterval(holdTick,250); }
  const sc=$('#perf .body')?.scrollTop||0; renderPerform(); const bd=$('#perf .body'); if(bd)bd.scrollTop=sc; saveP(); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&P.active&&P.stage==='perform'){ if(P.timer)tick(); if(P.restTimer)restTick(); keepAwake(); } });
function finishPerform(force){ const {it,date}=curItem(); if(!it)return exitPerform(); if(!force&&it.mode==='sets'&&!P.sets.some(s=>s.done&&!s.warm)){ showSheet(`<p style="margin:4px 0 16px;font-weight:600">${esc(t('no_sets_q'))}</p><div class="stack" style="gap:8px"><button class="btn pri" id="ns-skip">${esc(t('skip_ex'))}</button><button class="btn ghost" id="ns-finish">${esc(t('finish'))}</button><button class="btn ghost" data-act="close-sheet">${esc(t('cancel'))}</button></div>`); $('#ns-skip').addEventListener('click',()=>{closeSheet();skipItem();}); $('#ns-finish').addEventListener('click',()=>{closeSheet();finishPerform(true);}); return; }
  stopTimers(); if(P.paused&&P.pauseAt){P.pausedMs=(P.pausedMs||0)+(Date.now()-P.pauseAt);P.paused=false;} const dur=Math.max(1,Math.round((Date.now()-P.startedAt-(P.pausedMs||0))/1000));
  P.result={id:uid(),planItemId:it.id,exId:it.exId,mode:it.mode,startedAt:P.startedAt,endedAt:Date.now(),duration:it.mode==='time'?Math.min(dur,it.minutes*60*3+900):dur,sets:it.mode==='sets'?P.sets.filter(s=>!s.warm).map(s=>Object.assign({},s)):[],warmups:it.mode==='sets'?P.sets.filter(s=>s.warm&&s.done).length:0,memo:P.memo||'',condition:0,rpe:0}; { const rs=(P.result.sets||[]).filter(s=>s.done&&s.rpe).map(s=>s.rpe); if(rs.length)P.result.rpe=Math.min(10,Math.max(6,Math.round(rs.reduce((a,b)=>a+b,0)/rs.length))); }
  // keep edited targets on the plan item so the next session starts from them
  /* only working sets define the plan; warm-ups are regenerated each session */ const work=it.mode==='sets'?(P.sets||[]).filter(s=>!s.warm):[]; if(work.length){ it.sets=work.length; const d=work.filter(s=>s.done); if(d.length){ it.reps=d[d.length-1].reps; it.weight=d[d.length-1].weight; } }
  P.prev=lastEntry(it.exId,date,it.id); P.stage='complete'; renderPerform(); saveP(); }
function commitResult(){ const {it,date}=curItem(); const r=P.result; if(!r)return; S.logs[date]=S.logs[date]||{entries:[]}; S.logs[date].entries=S.logs[date].entries.filter(e=>e.planItemId!==r.planItemId); S.logs[date].entries.push(r); const live=planOf(date).find(x=>x.id===r.planItemId); if(live){ live.status='done'; if(it&&it!==live)Object.assign(live,{sets:it.sets,reps:it.reps,weight:it.weight}); persist.plan(date); } persist.log(date); P.result=null; }
function skipItem(){ const {it,date}=curItem(); const live=it&&planOf(date).find(x=>x.id===it.id); if(live){live.status='skipped'; persist.plan(date);} nextItem(); }
function nextItem(){ stopTimers(); P.idx++; if(P.idx>=P.queue.length){ P.active=false; saveP(); releaseAwake(); $('#perf')?.remove(); render(); } else enterPrepare(); }
function exitPerform(){ stopTimers(); releaseAwake(); P.active=false; saveP(); $('#perf')?.remove(); render(); }
function hasProgress(){ if(P.stage!=='perform')return false; const {it}=curItem(); if(it.mode==='sets')return P.sets.some(s=>s.done); return (Date.now()-P.startedAt)>20000; }
function askExit(){ if(P.stage==='complete'){commitResult();exitPerform();return;} if(!hasProgress()){exitPerform();return;}
  showSheet(`<p style="margin:4px 0 16px;font-weight:600">${esc(t('leave_q'))}</p><div class="stack" style="gap:8px"><button class="btn pri" id="lv-save">${esc(t('save_done'))}</button><button class="btn sec danger" id="lv-discard">${esc(t('discard_ex'))}</button><button class="btn ghost" data-act="close-sheet">${esc(t('cancel'))}</button></div>`);
  $('#lv-save').addEventListener('click',()=>{closeSheet();finishPerform(true);commitResult();exitPerform();}); /* the user already chose to save: skip the no-working-sets question */
  $('#lv-discard').addEventListener('click',()=>{closeSheet();exitPerform();}); }
function tempoHint(ex){ if(!ex||ex.type!=='strength'||ex.mode!=='sets')return ''; return t(isHoldEx(ex)?'tempo_hold':'tempo_reps'); }
function usedToday(date,exceptItemId){ const by={}; logOf(date).forEach(e=>{ if(e.planItemId===exceptItemId)return; const ex=exById(e.exId); if(!ex)return; const n=(e.sets||[]).filter(s=>s.done).length||(e.mode==='time'?1:0); if(!n)return; targetsOf(ex).p.forEach(k=>{ if(k==='full_body'||k==='heart')return; by[k]=(by[k]||0)+n; }); }); return by; }
function usedTodayHtml(ex,date,itemId){ const by=usedToday(date,itemId); const keys=Object.keys(by).sort((a,b)=>by[b]-by[a]); if(!keys.length)return ''; /* heads of one muscle count as the same muscle */ const fam=k=>k.startsWith('chest_')?'chest':k.startsWith('delt_')?'delt':k; const mine=new Set(targetsOf(ex).p.map(fam)); const same=keys.filter(k=>mine.has(fam(k))); return `<div class="usedtoday ${same.length?'warn':''}" id="usedtoday">${same.length?esc(t('used_same').replace('{m}',same.map(subName).join(' · ')))+' · ':''}${esc(t('used_today'))}: ${keys.slice(0,4).map(k=>esc(subName(k))+' '+by[k]+esc(t('rpt_sets'))).join(' · ')}</div>`; }
function whyText(it){ const w=it&&it.why; if(!w)return ''; const ex=exById(it.exId); const u=S.settings.unit; switch(w.k){ case 'up_w': return t('why_up_w').replace('{r}',w.r).replace('{d}',w.d+u); case 'up_r': return t('why_up_r').replace('{r}',w.r).replace('{u}',repUnit(ex)); case 'hold': return t('why_hold').replace('{r}',w.r).replace('{u}',repUnit(ex)); case 'up_m': return t('why_up_m'); case 'deload': return t('why_deload').replace('{p}',w.p); case 'return': return t('why_return').replace('{p}',w.p); } return ''; }
function swapCandidates(ex,max){ const tp=targetsOf(ex); const P1=new Set(tp.p), S1=new Set(tp.s); return S.exercises.filter(e=>!e.hidden&&e.id!==ex.id&&e.mode===ex.mode).map(e=>{ const t2=targetsOf(e); const pp=t2.p.filter(x=>P1.has(x)).length; const sc=pp*3+t2.p.filter(x=>S1.has(x)).length+t2.s.filter(x=>P1.has(x)).length+(e.muscle===ex.muscle?1:0); return {e,pp,sc}; }).filter(x=>x.pp>0).sort((a,b)=>b.sc-a.sc||(a.e.equip===ex.equip?1:0)-(b.e.equip===ex.equip?1:0)).slice(0,max||12).map(x=>x.e); }
function openSwap(){ const {date,it,ex}=curItem(); if(!it||!ex)return; const list=swapCandidates(ex,12);
  showSheet(`<h2 style="margin-bottom:4px">${esc(t('swap_title'))}</h2><div class="cap" style="margin-bottom:10px">${esc(t('swap_sub').replace('{x}',exName(ex)))}</div>${list.length?`<div class="list" id="swaplist">${list.map(e=>`<button class="li" data-swap="${e.id}"><span class="ic sm">${figSvg(e,48)}</span><span class="grow"><div class="nm">${esc(exName(e))}</div><div class="sub">${esc(exMeta(e))} · ${esc(targetText(e))}</div></span>${ICO.chev}</button>`).join('')}</div>`:`<div class="empty">—</div>`}<button class="btn ghost" data-act="close-sheet" style="margin-top:10px">${esc(t('cancel'))}</button>`);
  const box=$('#swaplist'); if(box)box.addEventListener('click',e=>{ const b=e.target.closest('[data-swap]'); if(!b)return; const ne=exById(b.dataset.swap); const live=planOf(date).find(x=>x.id===it.id); if(!ne||!live)return; Object.assign(live,{exId:ne.id,mode:ne.mode,minutes:ne.minutes,sets:ne.sets,reps:ne.reps,weight:ne.weight,rest:ne.rest??S.settings.restSec}); delete live.why; const ok=persist.plan(date); const q=P.queue[P.idx]; if(q)q.snap=Object.assign({},live); closeSheet(); toast((ok||DB)?t('swapped').replace('{x}',exName(ne)):t('save_failed')); renderPerform(); saveP(); }); }
function addExerciseNow(){ const {date,it}=curItem(); openPicker(date,(ex)=>{ const n=addPlanItem(date,ex,it.id); P.queue.splice(P.idx+1,0,{date,id:n.id}); toast(t('applied')); renderPerform(); }); }
function stepper(id,k,val,unit){ return `<div class="stp"><button data-sp="${k}" data-i="${id}" data-d="-1" aria-label="−">−</button><span class="v num"><input class="svi num" type="number" inputmode="decimal" min="0" step="${k==='weight'?(S.settings.weightStep||2.5):1}" value="${val}" data-svk="${k}" data-i="${id}" aria-label="${esc(unit||k)}">${unit?`<small>${esc(unit)}</small>`:''}</span><button data-sp="${k}" data-i="${id}" data-d="1" aria-label="+">+</button></div>`; }
function renderPerform(keep){
  if(keep&&$('#perf'))return;
  const c=curItem(); if(!c.it||!c.ex){exitPerform();return;} const {it,ex,date}=c; const ko=S.settings.lang==='ko';
  const n=P.queue.length>1?`<span class="cap num">${P.idx+1} / ${P.queue.length}</span>`:'<span></span>';
  let body='',foot='';
  if(P.stage==='prepare'){ const last=lastEntry(ex.id,date);
    body=`<div class="stack" style="padding-top:8px;align-items:stretch"><div style="text-align:center"><div class="hero"><div class="bigico">${figSvg(ex,132)}</div>${(m=>m?`<div class="bmtile">${m}</div>`:'')(muscleMapOf(ex,128))}</div><h1 style="margin-top:10px">${esc(exName(ex))}</h1><div class="cap" style="margin-top:4px"><span class="dot b-${ex.type}"></span> ${esc(exMeta(ex))}</div>${targetsHtml(ex)}</div>
      <div class="tiles ptiles"><button class="tile" data-p="edit-target" style="text-align:center"><div class="cap">${esc(t('target'))} ✎</div><div class="v num" style="font-size:18px">${esc(targetText(it))}</div></button><button class="tile" data-p="history" style="text-align:center"><div class="cap">${esc(t('last'))} ›</div><div class="v num" style="font-size:18px">${esc(entrySummary(last))}</div></button></div>${whyText(it)?`<div class="why" id="why">${esc(whyText(it))}</div>`:''}${tempoHint(ex)?`<div class="tempo" id="tempo">⏱ ${esc(tempoHint(ex))}</div>`:''}${usedTodayHtml(ex,date,it.id)}
      <div class="steps3">${stepCards(ex)}</div></div>`;
    foot=`<button class="btn pri" data-p="start">${esc(t('start'))}</button><div class="row" style="gap:8px"><button class="btn ghost" data-p="skip">${esc(t('skip'))}</button><button class="btn ghost" data-p="swap">⇄ ${esc(t('swap'))}</button><button class="btn ghost" data-p="addex" aria-label="${esc(t('add_ex_now'))}">+ ${esc(t('a11y_add'))}</button></div>`; }
  else if(P.stage==='perform'){
    if(it.mode==='time'){ body=`<div class="timer"><div class="row" style="justify-content:center;gap:10px;margin-bottom:12px"><span class="ic sm">${figSvg(ex,56)}</span><div class="cap">${esc(exName(ex))} · ${it.minutes} ${esc(t('min'))}</div></div><div class="ring" id="ring" style="--p:${(100-P.remaining/P.total*100)}%"><div><div class="big num" id="big">${mmss(P.remaining)}</div></div></div></div>
        <div class="row" style="gap:8px"><button class="btn sec" data-p="minus1">${esc(t('minus1'))}</button><button class="btn sec" data-p="pause" id="pausebtn">${esc(P.paused?t('resume'):t('pause'))}</button><button class="btn sec" data-p="plus1">${esc(t('plus1'))}</button></div>
        <div class="field" style="margin-top:16px"><label>${esc(t('memo'))}</label><textarea id="memo" rows="2">${esc(P.memo)}</textarea></div>`;
      foot=`<button class="btn pri" data-p="finish">${esc(t('done'))}</button><div class="row" style="gap:8px"><button class="btn ghost" data-p="skip">${esc(t('skip_ex'))}</button><button class="btn ghost" data-p="addex">+ ${esc(t('add_ex_now'))}</button></div>`; }
    else { const doneN=P.sets.filter(x=>x.done).length;
      body=`<div class="row between" style="margin-bottom:10px"><div class="row" style="gap:10px"><span class="ic sm">${figSvg(ex,56)}</span><div><b>${esc(exName(ex))}</b><div class="cap">${doneN} ${esc(t('set_of'))} ${P.sets.length} ${esc(t('sets'))}</div></div></div><span class="cap num">${mmss(Math.round((Date.now()-P.startedAt)/1000))}</span></div>
        <div class="restbox" id="restbox" ${P.restRemaining>0?'':'hidden'}><span>${esc(t('rest'))} <b class="num" id="restt">${mmss(P.restRemaining)}</b></span><span class="row" style="gap:6px"><button class="btn sm sec" data-p="rest-15">−15s</button><button class="btn sm sec" data-p="rest+15">+15s</button><button class="btn sm sec" data-p="skiprest">${esc(t('skip_rest'))}</button></span></div>

// completion screen: change vs the previous record of the same exercise
function exHistory(exId){ const ex=exById(exId); const out=[]; Object.keys(S.logs).sort().forEach(k=>{ logOf(k).forEach(e=>{ if(e.exId!==exId)return; const done=(e.sets||[]).filter(s=>s.done); let v=0; if(e.mode==='time')v=Math.round((e.duration||0)/60); else if(done.length){ const anyW=done.some(s=>s.weight>0); v=anyW?Math.max(...done.map(s=>e1rm(s.weight,s.reps))):Math.max(...done.map(s=>s.reps)); } if(e.mode==='time'||done.length)out.push({d:k,e,v,ton:done.reduce((a,s)=>a+(s.weight>0?s.reps*s.weight:0),0),weighted:done.some(s=>s.weight>0)}); }); }); return out; }
function openExHistory(exId){ const ex=exById(exId); if(!ex)return; const H=exHistory(exId); const timeMode=ex.mode==='time'; const same=H.filter(h=>timeMode?h.e.mode==='time':h.e.mode!=='time'); const weighted=!timeMode&&same.some(h=>h.weighted); const unit=timeMode?t('min'):weighted?S.settings.unit+' e1RM':repUnit(ex);
  /* best, change and trend use only records measured the same way as the exercise now (time vs sets; weighted sets only when any exist) */ const ser=weighted?same.filter(h=>h.weighted):same; const vals=ser.map(h=>h.v); const best=ser.reduce((a,h)=>(!a||h.v>a.v)?h:a,null);
  const first=ser[0], lastH=ser[ser.length-1]; const ch=first&&lastH&&first.v>0&&ser.length>=2?(lastH.v-first.v)/first.v:null;
  showSheet(`<div class="row" style="margin-bottom:10px"><span class="ic">${figSvg(ex,56)}</span><div class="grow"><h2>${esc(exName(ex))}</h2><div class="cap">${esc(t('hist_title'))} · ${H.length} ${esc(t('rpt_sessions_w'))}</div></div></div>
   ${H.length?`${best?`<div class="tiles"><div class="tile"><div class="cap">${esc(t('hist_best'))}</div><div class="v num" style="font-size:18px">${esc(fmtN(best.v,1)+' '+unit)}</div><div class="cap">${esc(fmtMD(parseKey(best.d)))}</div></div><div class="tile"><div class="cap">${esc(t('hist_change'))}</div><div class="v num" style="font-size:18px">${ch==null?'–':`<span class="delta ${ch>0?'up':ch<0?'down':''}">${ch>=0?'+':''}${Math.round(ch*100)}%</span>`}</div><div class="cap">${ser.length>=2?esc(fmtMD(parseKey(first.d))+' → '+fmtMD(parseKey(lastH.d))):''}</div></div></div>`:''}
   ${vals.length>=2?`<div style="margin:10px 0 4px">${rptSpark(vals,[ser[0].d.slice(5),ser[ser.length-1].d.slice(5)])}</div><div class="rpt-small">${esc(unit)}</div>`:''}
   <div class="rpt-list" id="histlist" style="margin-top:10px">${H.slice(-12).reverse().map(h=>`<div class="it"><span>${esc(fmtMD(parseKey(h.d)))}</span><span>${esc(entrySummary(h.e))}${h===best?' 🏆':''}</span></div>`).join('')}</div>`
   :`<div class="empty">${esc(t('no_record'))}</div>`}
   <button class="btn sec" data-act="close-sheet" style="margin-top:12px">${esc(t('close'))}</button>`); }
function prOf(r,date){ if(!r||r.mode!=='sets')return ''; const ex=exById(r.exId); const done=r.sets.filter(s=>s.done); if(!done.length)return ''; const hold=isHoldEx(ex); const anyW=done.some(s=>s.weight>0); const score=s=>anyW?e1rm(s.weight,s.reps):s.reps; const cur=Math.max(...done.map(score)); let best=null; Object.keys(S.logs).forEach(k=>{ logOf(k).forEach(e=>{ if(e.exId!==r.exId||e.id===r.id||e.planItemId===r.planItemId||e.mode!=='sets')return; e.sets.filter(s=>s.done).forEach(s=>{ if(anyW&&!(s.weight>0))return; const v=score(s); if(best==null||v>best)best=v; }); }); }); if(best==null||!(cur>best+1e-9))return ''; if(anyW){ const top=done.reduce((a,s)=>score(s)>score(a)?s:a); return top.weight+S.settings.unit+' × '+top.reps+' (≈'+fmtN(cur,1)+S.settings.unit+' 1RM)'; } return cur+(hold?t('sec'):' '+t('reps')); }
function resultDelta(r){ const prevS=entryScore(P.prev), curS=entryScore(r); if(prevS==null||curS==null)return ''; const d=curS-prevS; const cls=d>0?'up':d<0?'down':''; return `<span class="delta ${cls}">${d>0?'↑':d<0?'↓':'='} ${r.mode==='time'?mmss(Math.abs(d)):Math.abs(Math.round(d*10)/10)}</span> <span class="cap">${esc(t('vs_last'))} ${esc(entrySummary(P.prev))}</span>`; }
function onHowtoScroll(e){ if(e.target.id!=='howto')return; const h=e.target; const i=Math.round(h.scrollLeft/(h.clientWidth+12)); h.parentElement.querySelectorAll('#dots i').forEach((d,j)=>d.classList.toggle('on',j===i)); }
function onPerfInput(e){ const x=e.target; if(x.id==='memo'){P.memo=x.value;saveP();return;} if(x.dataset&&x.dataset.svk&&P.sets){ const i=+x.dataset.i, k=x.dataset.svk; const s0=P.sets[i]; if(!s0||x.value==='')return; const nv=Math.max(0,Math.min(k==='weight'?999:3600,Math.round((+x.value||0)*10)/10)); s0[k]=nv; for(let j=i+1;j<P.sets.length;j++){ if(!P.sets[j].done&&!!P.sets[j].warm===!!s0.warm){ P.sets[j][k]=nv; const o=document.querySelector(`.svi[data-svk="${k}"][data-i="${j}"]`); if(o&&o!==x)o.value=nv; } } saveP(); return; } if(P.result&&x.id==='durmin'){ const m=Math.max(0,Math.min(1440,Math.round(+x.value||0))); if(m>0){ P.result.duration=m*60; const dv=$('#dur-v'); if(dv)dv.textContent=mmss(P.result.duration); const de=$('#delta'); if(de)de.innerHTML=resultDelta(P.result); } return;} if(P.result&&x.id==='dist'){P.result.distance=Math.max(0,+x.value||0);return;} if(P.result&&x.id==='hr'){P.result.hr=Math.max(0,Math.round(+x.value||0));return;} }
function onPerfClick(e){ const b=e.target.closest('[data-p],[data-c],[data-sp],[data-rpe]'); if(!b)return;
  if(b.dataset.rpe){ P.result.rpe=+b.dataset.rpe; $('#rpe').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); return; }
  if(b.dataset.c){ P.result.condition=+b.dataset.c; $('#cond').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); return; }
  const {it}=curItem();
  if(b.dataset.sp){ const i=+b.dataset.i, k=b.dataset.sp, d=+b.dataset.d; const st=k==='weight'?(S.settings.weightStep||2.5):1; const s0=P.sets[i]; const nv=Math.max(0,Math.round((s0[k]+d*st)*10)/10); s0[k]=nv; for(let j=i+1;j<P.sets.length;j++){ if(!P.sets[j].done&&!!P.sets[j].warm===!!s0.warm)P.sets[j][k]=nv; } const sc=$('#perf .body')?.scrollTop||0; renderPerform(); const bd=$('#perf .body'); if(bd)bd.scrollTop=sc; saveP(); return; }
  const a=b.dataset.p;
  if(a==='edit-target'){ const {date,it}=curItem(); if(it)openItemEditor(date,it.id); return; }
  if(a==='exit')askExit(); else if(a==='start')enterPerform(); else if(a==='skip')skipItem(); else if(a==='addex')addExerciseNow();
  else if(a==='pause'){ if(P.paused){P.paused=false;P.pausedMs=(P.pausedMs||0)+(Date.now()-P.pauseAt);P.endAt=Date.now()+P.remaining*1000;} else {P.paused=true;P.pauseAt=Date.now();} b.textContent=P.paused?t('resume'):t('pause'); saveP(); }
  else if(a==='plus1'||a==='minus1'){ const d=a==='plus1'?60:-60; P.remaining=Math.max(10,P.remaining+d); P.total=Math.max(P.total+d,P.remaining); P.endAt=Date.now()+P.remaining*1000; $('#big').textContent=mmss(P.remaining); }
  else if(a==='hold'){ holdToggle(+b.dataset.i); }
  else if(a==='skind'){ const s=P.sets[+b.dataset.i]; if(s){ const order=['','drop','fail']; s.kind=order[(order.indexOf(s.kind||'')+1)%order.length]||undefined; if(!s.kind)delete s.kind; } const sc=$('#perf .body')?.scrollTop||0; renderPerform(); const bd=$('#perf .body'); if(bd)bd.scrollTop=sc; saveP(); }
  else if(a==='srpe'){ const s=P.sets[+b.dataset.i]; const v=+b.dataset.v; if(s){ if(s.rpe===v)delete s.rpe; else s.rpe=v; } const sc=$('#perf .body')?.scrollTop||0; renderPerform(); const bd=$('#perf .body'); if(bd)bd.scrollTop=sc; saveP(); }
  else if(a==='swap'){ openSwap(); }
  else if(a==='history'){ const c=curItem(); if(c.ex)openExHistory(c.ex.id); }
  else if(a==='uselast'){ const i=+b.dataset.i; const s=P.sets[i]; const ps=(!s||s.warm)?null:(P.prevSets||[])[i-P.sets.filter(x=>x.warm).length]; if(ps&&s&&!s.done){ s.reps=ps.reps; s.weight=ps.weight||0; } const sc=$('#perf .body')?.scrollTop||0; renderPerform(); const bd=$('#perf .body'); if(bd)bd.scrollTop=sc; saveP(); }
  else if(a==='setdone'){ const i=+b.dataset.i; const s=P.sets[i]; if(P.hold&&P.hold.i===i)stopHold(); s.done=!s.done; if(s.done)s.t=Date.now(); else delete s.t; if(s.done&&it&&it.rest>0&&i<P.sets.length-1){ startRest(it.rest); } const sc=$('#perf .body')?.scrollTop||0; renderPerform(); const bd=$('#perf .body'); if(bd)bd.scrollTop=sc; saveP(); }
  else if(a==='addset'){ const last=P.sets[P.sets.length-1]||{reps:it.reps,weight:it.weight}; P.sets.push({reps:last.reps,weight:last.weight,done:false}); renderPerform(); saveP(); }
  else if(a==='rmset'){ for(let i=P.sets.length-1;i>=0;i--){ if(!P.sets[i].done){ if(P.hold&&P.hold.i===i)stopHold(); P.sets.splice(i,1); break; } } renderPerform(); saveP(); }
  else if(a==='rest-15'||a==='rest+15'){ const d=a==='rest+15'?15:-15; P.restEndAt+=d*1000; if(P.restEndAt<Date.now())P.restEndAt=Date.now(); restTick(); }
  else if(a==='skiprest'){ P.restRemaining=0; if(P.restTimer){clearInterval(P.restTimer);P.restTimer=null;} $('#restbox').hidden=true; }
  else if(a==='finish')finishPerform();
  else if(a==='next'){ commitResult(); nextItem(); } }

  const md=e.target.closest('[data-mode]'); if(md&&S.sub==='edit'){S.editEx.mode=md.dataset.mode;S.editDirty=true;renderEdit();return;}
  const mu=e.target.closest('[data-muscle]'); if(mu&&S.sub==='edit'){S.editEx.muscle=mu.dataset.muscle;S.editDirty=true;view.querySelectorAll('[data-muscle]').forEach(x=>x.classList.toggle('on',x===mu));return;}
  const eq=e.target.closest('[data-equip]'); if(eq&&S.sub==='edit'){S.editEx.equip=eq.dataset.equip;S.editDirty=true;view.querySelectorAll('[data-equip]').forEach(x=>x.classList.toggle('on',x===eq));return;}
  const fl=e.target.closest('[data-filter]'); if(fl){S.libFilter=fl.dataset.filter;renderLibrary();return;}
  const mf=e.target.closest('[data-mfilter]'); if(mf){S.libMuscle=mf.dataset.mfilter;renderLibrary();return;}
  const ef=e.target.closest('[data-efilter]'); if(ef){S.libEquip=ef.dataset.efilter;renderLibrary();return;}
  const a=e.target.closest('[data-act]'); if(!a)return; const act=a.dataset.act;
  switch(act){
    case 'add-today': openPicker(todayKey()); break;
    case 'ex-history': openExHistory(a.dataset.id); break;
    case 'wk-dismiss': S.settings.reviewDismissed=a.dataset.k; persist.settings(); render(); break;
    case 'wk-share': { const W=weekSummary(addDays(startOfWeek(appNow()),-7)); if(window.claude&&window.claude.use){ const txt=weekReviewText(W); const fb=()=>showSheet(`<textarea rows="8" readonly>${esc(txt)}</textarea>`); (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(t('copied'))).catch(fb); } else { try{ const url=weekReviewPng(W); const l=document.createElement('a'); l.href=url; l.download='myfit-week-'+W.a+'.png'; document.body.appendChild(l); l.click(); l.remove(); }catch(e){ toast(t('save_failed')); } } break; }
    case 'quick-log': { const d=todayKey(); openPicker(d,ex=>{ if(!ex)return; const it=addPlanItem(d,ex); render(); if(it)startQueue([{date:d,id:it.id}]); }); break; }
    case 'rpt-period': S.rptPeriod=a.dataset.v; render(); break;
    case 'rpt-save-checkin': { const k=todayKey(); const w=+($('#ci-w').value)||0, sl=+($('#ci-s').value)||0, note=($('#ci-n').value||'').trim(); if(w||sl||note)S.body[k]={w,sleep:sl,note}; else delete S.body[k]; toast(persist.body(k)?t('rpt_saved'):t('save_failed')); render(); break; }
    case 'rpt-save-note': { const k=keyOf(startOfWeek(appNow())); const v=($('#wk-note').value||'').trim(); if(v)S.notes[k]=v; else delete S.notes[k]; toast(persist.notes(k)?t('rpt_saved'):t('save_failed')); break; }
    case 'rpt-text': { const txt=rptText(rptBuild()); navigator.clipboard.writeText(txt).then(()=>toast(t('copied'))).catch(()=>{ showSheet(`<textarea rows="10" readonly>${esc(txt)}</textarea>`); }); break; }
    case 'rpt-csv': { const blob=new Blob([rptCsv()],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='my-fit-report-'+todayKey()+'.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); break; }
    case 'repeat-off': delete S.settings.repeatRoutine; persist.settings(); render(); break;
    case 'go-week': S.tab='week'; S.selDay=todayKey(); S.weekStart=keyOf(startOfWeek(appNow())); render(); break;
    case 'install': { if(S.installEvt){ const ev=S.installEvt; S.installEvt=null; ev.prompt(); ev.userChoice.then(()=>render()); } else { showSheet(`<h2 style="margin-bottom:10px">${esc(t('install'))}</h2><ol style="padding-left:20px;line-height:1.7;margin:0 0 12px"><li>${esc(t('ios_1'))}</li><li>${esc(t('ios_2'))}</li><li>${esc(t('ios_3'))}</li></ol><button class="btn ghost" data-act="close-sheet">${esc(t('close'))}</button>`); } break; }
    case 'start-day': { const d=S.selDay||todayKey(); startQueue(planOf(d).filter(i=>i.status==='planned').map(i=>({date:d,id:i.id}))); break; }
    case 'start-today': { const d=todayKey(); startQueue(planOf(d).filter(i=>i.status==='planned').map(i=>({date:d,id:i.id}))); break; }
    case 'open-item': { if(S._swiping)break; const d=a.dataset.k||todayKey(); const it=planOf(d).find(x=>x.id===a.dataset.id); if(!it)break; if(d!==todayKey()||it.status!=='planned'){openItemEditor(d,it.id);} else startQueue([{date:d,id:a.dataset.id}]); break; }
    case 'swipe-cancel': { const w=a.closest('.swipe'); w&&w.classList.remove('open'); break; }
    case 'swipe-del': { const d=a.dataset.k; const id=a.dataset.id; const it=planOf(d).find(x=>x.id===id); if(!it)break; S.plans[d].items=planOf(d).filter(x=>x.id!==id); if(S.logs[d]){S.logs[d].entries=S.logs[d].entries.filter(x=>x.planItemId!==id);persist.log(d);} persist.plan(d); toast(t('removed')); render(); break; }
    case 'add-day': S.selDay=a.dataset.k; openPicker(a.dataset.k); break;
    case 'smart-apply': applySmart(); break;
    case 'smart-regen': confirmSheet(t('confirm_regen'),t('regenerate'),()=>applySmart(),true); break;
    case 'week-today': S.weekStart=keyOf(startOfWeek(appNow())); S.selDay=todayKey(); S.smartInfo=null; render(); break;
    case 'month-today': { const n=appNow(); S.month=keyOf(new Date(n.getFullYear(),n.getMonth(),1)); render(); break; }
    case 'week-prev': S.weekStart=keyOf(addDays(parseKey(S.weekStart),-7)); S.selDay=S.weekStart; S.smartInfo=null; render(); break;
    case 'week-next': S.weekStart=keyOf(addDays(parseKey(S.weekStart),7)); S.selDay=S.weekStart; S.smartInfo=null; render(); break;
    case 'copy-week': copyLastWeek(); break;
    case 'open-routines': openRoutineList(); break;
    case 'backups': openBackups(); break;
    case 'changelog': openChangelog(); break;
    case 'sign-in': signIn(); break;
    case 'sign-out': signOut().then(()=>render()); break;
    case 'save-routine': saveWeekAsRoutine(); break;
    case 'edit-item': openItemEditor(a.dataset.k||S.selDay,a.dataset.id); break;
    case 'month-prev': { const m=parseKey(S.month); S.month=keyOf(new Date(m.getFullYear(),m.getMonth()-1,1)); render(); break; }
    case 'month-next': { const m=parseKey(S.month); S.month=keyOf(new Date(m.getFullYear(),m.getMonth()+1,1)); render(); break; }
    case 'day-detail': openDayDetail(a.dataset.k); break;
    case 'open-lib': S.sub='library'; render(); break;
    case 'open-guide': S.sub='guide'; render(); view.scrollTop=0; break;
    case 'back': S.sub=null; render(); break;
    case 'new-ex': S.editEx=blankExercise(); S.editDirty=false; S.sub='edit'; render(); break;
    case 'edit-ex': S.editEx=JSON.parse(JSON.stringify(exById(a.dataset.id))); S.editDirty=false; S.sub='edit'; render(); break;
    case 'back-edit': if(S.editDirty){confirmSheet(t('discard'),t('discard_btn'),()=>{S.sub='library';render();},true);} else {S.sub='library';render();} break;
    case 'save-ex': saveExercise(); break;
    case 'add-step': S.editEx.steps.push({titleEn:'',titleKo:'',cueEn:'',cueKo:'',mistakeEn:'',mistakeKo:''}); renderEdit(); break;
    case 'rm-step': S.editEx.steps.pop(); renderEdit(); break;
    case 'toggle-hide': S.editEx.hidden=!S.editEx.hidden; saveExercise(); break;
    case 'del-ex': confirmSheet(t('confirm_delete_ex'),t('delete'),()=>{S.exercises=S.exercises.filter(x=>x.id!==S.editEx.id);persist.exercises();S.sub='library';render();},true); break;
    case 'export': openExport(); break;
    case 'import': { showSheet(`<h2 style="margin-bottom:10px">${esc(t('import'))}</h2><button class="btn sec" style="margin-bottom:8px" id="impfb" type="button">${esc(t('import_file'))}</button><input type="file" id="impf" accept="application/json,.json" hidden><textarea id="imp" rows="8" placeholder="{...}"></textarea><button class="btn pri" style="margin-top:10px" id="ib">${esc(t('import_btn'))}</button>`);
      const ib=$('#ib'), imp=$('#imp'); let readSeq=0;
      $('#impfb').addEventListener('click',()=>$('#impf').click());
      $('#impf').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(!f)return; const seq=++readSeq; imp.value=''; ib.disabled=true; f.text().then(txt=>{ if(seq!==readSeq)return; imp.value=txt; ib.disabled=false; }).catch(()=>{ if(seq!==readSeq)return; ib.disabled=false; toast(t('import_fail')); }); });
      const doImport=(o)=>{ const pk=Object.keys(S.plans),lk=Object.keys(S.logs); if(Array.isArray(o.exercises)){S.exercises=o.exercises;mergeDefaults();} if(o.settings)S.settings=Object.assign(S.settings,o.settings); if(Array.isArray(o.routines))S.routines=o.routines; if(o.plans)S.plans=o.plans; if(o.logs)S.logs=o.logs; if(o.body&&typeof o.body==='object'){ const bk=Object.keys(S.body); S.body={}; Object.keys(o.body).forEach(k=>{ const x=o.body[k]||{}; const w=+x.w||0,sl=+x.sleep||0,note=String(x.note||'').slice(0,140); if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&(w||sl||note))S.body[k]={w,sleep:sl,note}; }); new Set([...bk,...Object.keys(S.body)]).forEach(k=>persist.body(k)); } if(o.notes&&typeof o.notes==='object'){ const nk=Object.keys(S.notes); S.notes={}; Object.keys(o.notes).forEach(k=>{ const v=String(o.notes[k]||'').slice(0,500); if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&v)S.notes[k]=v; }); new Set([...nk,...Object.keys(S.notes)]).forEach(k=>persist.notes(k)); } persist.exercises();persist.settings();persist.routines();new Set([...pk,...Object.keys(S.plans)]).forEach(k=>persist.plan(k));new Set([...lk,...Object.keys(S.logs)]).forEach(k=>persist.log(k)); closeSheet(); toast(t('imported')); render(); };
      ib.addEventListener('click',()=>{ let o; try{ o=JSON.parse(imp.value); if(!o||typeof o!=='object')throw 0; }catch(err){ toast(t('import_fail')); return; } if(o.app&&o.app!=='my-fit'){ toast(t('import_other_app')); return; }
        const run=()=>{ try{ doImport(o); }catch(err){ toast(t('import_fail')); } };
        // signed in: import replaces the account's cloud data (dates missing from the backup are removed), so ask first
        if(FB.user){ confirmSheet(t('import_signed_in'),t('import_btn'),run,true); return; }
        // claude.ai artifact storage is shared saved data too: replacing it also needs a confirmation
        if(S.backend==='db'){ confirmSheet(t('import_replace_saved'),t('import_btn'),run,true); return; }
        confirmSheet(t('import_replace_local'),t('import_btn'),run,true); }); break; }
    case 'reset': confirmSheet(t('confirm_reset'),t('delete'),()=>{ const pk=Object.keys(S.plans),lk=Object.keys(S.logs); const bk=Object.keys(S.body),nk=Object.keys(S.notes); S.plans={};S.logs={}; S.body={}; S.notes={}; S.exercises=DEFAULT_EXERCISES(); pk.forEach(k=>persist.plan(k)); lk.forEach(k=>persist.log(k)); bk.forEach(k=>persist.body(k)); nk.forEach(k=>persist.notes(k)); persist.exercises(); render(); },true); break;
  }
});

// backup file: {app:'my-fit', version, exportedAt, ...data}. Import also accepts older files without app/version.
function openExport(){ const json=JSON.stringify({app:'my-fit',version:APP_VERSION,exportedAt:new Date().toISOString(),exercises:S.exercises,routines:S.routines,settings:S.settings,plans:S.plans,logs:S.logs,body:S.body,notes:S.notes},null,1); showSheet(`<h2 style="margin-bottom:10px">${esc(t('export'))}</h2><textarea id="exp" rows="8" readonly>${esc(json)}</textarea><button class="btn pri" style="margin-top:10px" id="cp">${esc(t('copy'))}</button>${(window.claude&&window.claude.use)?'':`<button class="btn sec" style="margin-top:8px" id="dl">${esc(t('download'))}</button>`}`); $('#dl')?.addEventListener('click',()=>{ const blob=new Blob([json],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='my-fit-'+todayKey()+'.json'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); });
      $('#cp').addEventListener('click',()=>{navigator.clipboard.writeText(json).then(()=>toast(t('copied'))).catch(()=>{$('#exp').select();});}); }
// ---------- moved to its own origin ----------
// My Fit now lives on its own origin (Netlify, owner's account, named by the amber-<app> rule). The old GitHub Pages copy keeps working,
// shows this banner and drops its install manifest (src/head.html); nothing is deleted. An empty NEW_HOME turns the banner off.
const NEW_HOME='https://amber-my-fit.netlify.app/';
const OLD_HOSTS=['amber67-git.github.io'];
function movedBanner(){ if(!NEW_HOME||!OLD_HOSTS.includes(location.hostname)||document.getElementById('moved'))return; const el=document.createElement('div'); el.id='moved'; el.className='moved'; el.setAttribute('role','status');
  el.innerHTML=`<div class="grow"><b>${esc(t('moved_title'))}</b><div class="cap">${esc(t('moved_body'))}</div></div><div class="row"><button class="btn sm sec" data-moved="backup">${esc(t('moved_backup'))}</button><a class="btn sm pri" href="${esc(NEW_HOME)}" target="_blank" rel="noopener">${esc(t('moved_open'))}</a></div>`;
  el.addEventListener('click',e=>{ if(e.target.closest('[data-moved="backup"]'))openExport(); });
  const view=document.getElementById('view'); view.parentNode.insertBefore(el,view); }
// ---------- boot ----------
loadLocal(); render(); movedBanner(); const DB_READY=connectDb(); checkWhatsNew(DB_READY); checkResume();
(function(){ let sw=null,x0=0,y0=0,dx=0,dragging=false,hor=null; const main=document.body;
  const closeAll=(except)=>{ document.querySelectorAll('.swipe.open').forEach(el=>{ if(el!==except)el.classList.remove('open'); }); };
  const start=(el,x,y)=>{ sw=el; x0=x; y0=y; dx=0; hor=null; dragging=false; };
  const move=(x,y)=>{ if(!sw)return; const mx=x-x0,my=y-y0; if(hor==null){ if(Math.abs(mx)<6&&Math.abs(my)<6)return; hor=Math.abs(mx)>Math.abs(my); if(!hor){sw=null;return;} sw.classList.add('dragging'); dragging=true; S._swiping=true; }
    const base=sw.classList.contains('open')?-168:0; dx=Math.max(-180,Math.min(0,base+mx)); sw.querySelector('.card').style.transform=`translateX(${dx}px)`; };
  const end=()=>{ if(!sw)return; const el=sw; sw=null; el.classList.remove('dragging'); const card=el.querySelector('.card'); card.style.transform='';
    if(dragging){ if(dx<-48){ closeAll(el); el.classList.add('open'); } else el.classList.remove('open'); }
    setTimeout(()=>{S._swiping=false;},50); };
  main.addEventListener('touchstart',e=>{ const el=e.target.closest('.swipe'); if(!el){closeAll();return;} if(e.target.closest('.swipe-acts'))return; start(el,e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
  main.addEventListener('touchmove',e=>{ if(sw)move(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
  main.addEventListener('touchend',end); main.addEventListener('touchcancel',end);
  main.addEventListener('mousedown',e=>{ const el=e.target.closest('.swipe'); if(!el){closeAll();return;} if(e.target.closest('.swipe-acts'))return; start(el,e.clientX,e.clientY); });
  main.addEventListener('mousemove',e=>{ if(sw&&e.buttons)move(e.clientX,e.clientY); });
  main.addEventListener('mouseup',end);
})();
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); S.installEvt=e; if(S.tab==='settings'&&!S.sub)render(); });
window.addEventListener('appinstalled',()=>{ S.installEvt=null; toast('My Fit ✓'); if(S.tab==='settings')render(); });
window.addEventListener('myfit-update',()=>{ if(P.active)return; showSheet(`<p style="margin:4px 0 16px;font-weight:600">${esc(t('update_ready'))}</p><div class="stack" style="gap:8px"><button class="btn pri" id="up-reload">${esc(t('reload'))}</button><button class="btn ghost" data-act="close-sheet">${esc(t('close'))}</button></div>`); $('#up-reload').addEventListener('click',()=>location.reload()); });
let LAST_DAY=todayKey(); setInterval(()=>{ if(todayKey()!==LAST_DAY){ LAST_DAY=todayKey(); S.smartInfo=null; render(); } },60000);
})();
